<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Older Data Found (Legacy Choice)</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;display:flex;align-items:center;justify-content:center;padding:0 20px;box-sizing:border-box;">

  <!-- Legacy data card -->
  <section style="width:100%;max-width:384px;border-radius:24px;border:1px solid #e7e3d8;background:#ffffff;padding:24px;">
    <!-- Icon -->
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>

    <!-- Title -->
    <h1 style="font-size:20px;font-weight:700;margin-top:16px;">Older data found on this device</h1>

    <!-- Body -->
    <p style="font-size:14px;line-height:24px;color:#57534e;margin-top:8px;">Import it only if it belongs to the account you just signed into. It will never be attached automatically.</p>

    <!-- Note box -->
    <div style="border-radius:16px;background:#f4f2ec;padding:16px;font-size:12px;line-height:20px;color:#57534e;margin-top:16px;">Choosing "Start Fresh" removes the unassigned local copy from this browser after a new private account record is created.</div>

    <!-- Actions -->
    <button style="width:100%;min-height:48px;border-radius:12px;background:#059669;color:#ffffff;font-weight:600;margin-top:20px;border:none;font-family:'Inter',Arial,sans-serif;">This Is My Data — Import</button>
    <button style="width:100%;min-height:48px;border-radius:12px;border:1px solid #e7e3d8;background:#ffffff;font-weight:600;margin-top:12px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">Start Fresh</button>
  </section>

</div>

</body>
</html>
