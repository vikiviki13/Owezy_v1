<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Required Update Modal</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Dimmed background -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:#fbfaf7;opacity:0.95;"></div>

  <!-- Centered modal -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:0 20px;">
    <div style="width:100%;max-width:358px;border-radius:24px;border:1px solid #e7e3d8;background:#ffffff;padding:24px;text-align:center;">
      <!-- Icon -->
      <span style="width:56px;height:56px;border-radius:9999px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;margin:0 auto;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </span>
      <h2 style="font-size:18px;font-weight:700;margin-top:16px;">Update required</h2>
      <p style="font-size:14px;line-height:24px;color:#57534e;margin-top:8px;">Please update Owezy to continue securely.</p>

      <!-- Update now button -->
      <button style="width:100%;min-height:48px;border-radius:12px;background:#059669;color:#ffffff;font-weight:600;margin-top:24px;border:none;font-family:'Inter',Arial,sans-serif;">Update Now</button>

      <!-- Offline note -->
      <p style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#a8a29e;margin-top:12px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        Connect to the internet to install the latest version.
      </p>
    </div>
  </div>

</div>

</body>
</html>
