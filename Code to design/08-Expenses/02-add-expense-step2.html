<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Add Expense - Step 2</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <div style="height:47px;"></div>

    <!-- Content -->
    <div style="padding:24px 16px 32px;">
      <!-- Header with step dots -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
        <button style="width:36px;height:36px;border-radius:18px;background:#ffffff;border:1px solid #e7e3d8;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </button>
        <h1 style="font-size:18px;font-weight:600;margin:0;color:#1c1917;">Add Expense</h1>
        <div style="margin-left:auto;display:flex;gap:4px;">
          <div style="width:6px;height:6px;border-radius:3px;background:#e7e3d8;"></div>
          <div style="width:24px;height:6px;border-radius:3px;background:#059669;"></div>
          <div style="width:6px;height:6px;border-radius:3px;background:#e7e3d8;"></div>
        </div>
      </div>

      <!-- Amount -->
      <p style="font-size:14px;color:#57534e;margin:0 0 8px;">Total bill amount</p>
      <div style="display:flex;align-items:center;gap:4px;margin-bottom:24px;">
        <span style="font-size:30px;line-height:36px;font-weight:700;color:#a8a29e;">₹</span>
        <span style="font-size:36px;line-height:40px;font-weight:800;color:#1c1917;">1,250.00</span>
      </div>

      <!-- Expense name -->
      <label style="display:block;margin-bottom:20px;">
        <span style="display:block;font-size:14px;font-weight:500;color:#57534e;">Expense Name</span>
        <input type="text" value="Barbeque Nation" placeholder="e.g. Barbeque Nation, Taj Hotel, PVR" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;margin-top:8px;">
      </label>

      <!-- Share note -->
      <div style="background:#ecfdf5;border-radius:12px;padding:12px;margin-bottom:16px;font-size:14px;color:#57534e;line-height:1.5;">Your share is always included in this expense. Add friends only when the bill was shared.</div>

      <!-- Split mode -->
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button style="flex:1;padding:8px 0;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#059669;color:#ffffff;">Equal split</button>
        <button style="flex:1;padding:8px 0;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Custom split</button>
      </div>

      <!-- Equal share breakdown -->
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px;">
          <span style="font-size:14px;font-weight:500;color:#1c1917;">You</span>
          <span style="font-size:14px;font-weight:600;color:#1c1917;">₹416.66</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px;">
          <span style="font-size:14px;font-weight:500;color:#1c1917;">Priya Sharma</span>
          <span style="font-size:14px;font-weight:600;color:#1c1917;">₹416.67</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px;">
          <span style="font-size:14px;font-weight:500;color:#1c1917;">Vikram Singh</span>
          <span style="font-size:14px;font-weight:600;color:#1c1917;">₹416.67</span>
        </div>
      </div>

      <!-- Continue -->
      <button style="width:100%;margin-top:16px;background:#059669;color:#ffffff;font-size:16px;font-weight:500;border:none;border-radius:12px;padding:14px;">Continue</button>
    </div>
  </div>
</body>
</html>
