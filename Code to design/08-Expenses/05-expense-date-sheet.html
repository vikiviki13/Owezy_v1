<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Expense Date Sheet</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Dimmed underlying screen (simplified) -->
    <div style="position:absolute;inset:0;background:#fbfaf7;">
      <div style="height:47px;"></div>
      <div style="padding:24px 16px;">
        <h1 style="font-size:18px;font-weight:600;margin:0;color:#1c1917;">Add Expense</h1>
      </div>
    </div>

    <!-- Scrim -->
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.4);"></div>

    <!-- Bottom sheet -->
    <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);">
      <!-- Handle -->
      <div style="display:flex;justify-content:center;padding-top:12px;">
        <div style="width:40px;height:6px;border-radius:3px;background:#e7e3d8;"></div>
      </div>

      <!-- Title row -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
        <h2 style="font-size:18px;font-weight:600;margin:0;color:#1c1917;">Expense date</h2>
        <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <!-- Quick options -->
      <div style="display:flex;flex-direction:column;gap:8px;padding:4px 20px 0;">
        <button style="width:100%;display:flex;align-items:center;justify-content:space-between;border-radius:12px;border:1px solid #059669;background:#ecfdf5;padding:14px 16px;font-weight:500;color:#047857;text-align:left;box-sizing:border-box;">
          Today
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </button>
        <button style="width:100%;display:flex;align-items:center;justify-content:space-between;border-radius:12px;border:1px solid #e7e3d8;background:#ffffff;padding:14px 16px;font-weight:500;color:#1c1917;text-align:left;box-sizing:border-box;">
          Yesterday
        </button>
        <button style="width:100%;display:flex;align-items:center;justify-content:space-between;border-radius:12px;border:1px solid #e7e3d8;background:#ffffff;padding:14px 16px;font-weight:500;color:#1c1917;text-align:left;box-sizing:border-box;">
          Select Date
        </button>
      </div>

      <!-- Calendar -->
      <div style="margin-top:8px;border-top:1px solid #e7e3d8;padding:16px 20px 24px;">
        <!-- Calendar header -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <button style="width:36px;height:36px;border-radius:18px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <span style="font-size:14px;font-weight:600;color:#1c1917;">August 2026</span>
          <button style="width:36px;height:36px;border-radius:18px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>

        <!-- Weekdays -->
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">
          <span style="text-align:center;font-size:12px;font-weight:500;color:#a8a29e;padding:4px 0;">Su</span>
          <span style="text-align:center;font-size:12px;font-weight:500;color:#a8a29e;padding:4px 0;">Mo</span>
          <span style="text-align:center;font-size:12px;font-weight:500;color:#a8a29e;padding:4px 0;">Tu</span>
          <span style="text-align:center;font-size:12px;font-weight:500;color:#a8a29e;padding:4px 0;">We</span>
          <span style="text-align:center;font-size:12px;font-weight:500;color:#a8a29e;padding:4px 0;">Th</span>
          <span style="text-align:center;font-size:12px;font-weight:500;color:#a8a29e;padding:4px 0;">Fr</span>
          <span style="text-align:center;font-size:12px;font-weight:500;color:#a8a29e;padding:4px 0;">Sa</span>

          <!-- Row 1 (Aug 1 is Saturday) -->
          <span></span><span></span><span></span><span></span><span></span><span></span>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">01</button>

          <!-- Rows 2-5 -->
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">02</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">03</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">04</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">05</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">06</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">07</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">08</button>

          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">09</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">10</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">11</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">12</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">13</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">14</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">15</button>

          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">16</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">17</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">18</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">19</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">20</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">21</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#57534e;">22</button>

          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#047857;font-weight:600;">23</button>
          <button style="aspect-ratio:1;border:none;background:#059669;border-radius:50%;font-size:14px;color:#ffffff;font-weight:600;">24</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#a8a29e;opacity:0.4;">25</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#a8a29e;opacity:0.4;">26</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#a8a29e;opacity:0.4;">27</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#a8a29e;opacity:0.4;">28</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#a8a29e;opacity:0.4;">29</button>

          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#a8a29e;opacity:0.4;">30</button>
          <button style="aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:14px;color:#a8a29e;opacity:0.4;">31</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
