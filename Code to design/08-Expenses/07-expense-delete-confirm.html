<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Delete Expense Confirmation</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Dimmed underlying screen (simplified) -->
    <div style="position:absolute;inset:0;background:#fbfaf7;">
      <div style="height:47px;"></div>
      <div style="padding:24px 16px;">
        <h1 style="font-size:16px;font-weight:600;margin:0;color:#1c1917;">Goa Trip Stay</h1>
      </div>
    </div>

    <!-- Scrim -->
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.4);"></div>

    <!-- Centered dialog -->
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 24px;box-sizing:border-box;">
      <div style="position:relative;background:#ffffff;border-radius:16px;padding:20px;width:100%;max-width:336px;box-sizing:border-box;">
        <p style="font-size:16px;font-weight:600;color:#1c1917;margin:0 0 4px;">Delete this expense?</p>
        <p style="font-size:14px;color:#a8a29e;margin:0 0 16px;line-height:1.5;">This can't be undone. Balances will recalculate.</p>
        <div style="display:flex;gap:8px;">
          <button style="flex:1;padding:10px 0;border:none;border-radius:12px;background:#f4f2ec;font-size:14px;font-weight:500;color:#1c1917;">Cancel</button>
          <button style="flex:1;padding:10px 0;border:none;border-radius:12px;background:#dc2626;font-size:14px;font-weight:500;color:#ffffff;">Delete</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
