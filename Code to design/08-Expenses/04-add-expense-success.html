<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Add Expense - Success</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:47px 16px 32px;box-sizing:border-box;">
    <!-- Centered content -->
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;">
      <span style="margin:0 auto 20px;width:64px;height:64px;border-radius:32px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
      </span>
      <h1 style="font-size:24px;font-weight:700;color:#1c1917;margin:0;">Expense Added Successfully</h1>
      <p style="font-size:14px;color:#57534e;margin:8px 0 0;line-height:1.5;">₹1,250.00 was saved for Today.</p>

      <!-- WhatsApp share cards -->
      <div style="margin-top:28px;display:flex;flex-direction:column;gap:12px;text-align:left;">
        <div style="border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:16px;">
          <p style="font-size:16px;font-weight:600;color:#1c1917;margin:0;"><span>₹416.67</span> added for Priya Sharma</p>
          <p style="font-size:12px;color:#a8a29e;margin:4px 0 0;">Pending balance: <span>₹2,450.00</span></p>
          <button style="margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#059669;color:#ffffff;font-size:16px;font-weight:500;border:none;border-radius:12px;padding:12px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
            Send on WhatsApp — Priya Sharma
          </button>
        </div>

        <div style="border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:16px;">
          <p style="font-size:16px;font-weight:600;color:#1c1917;margin:0;"><span>₹416.67</span> added for Vikram Singh</p>
          <p style="font-size:12px;color:#a8a29e;margin:4px 0 0;">Pending balance: <span>₹5,200.00</span></p>
          <button style="margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#059669;color:#ffffff;font-size:16px;font-weight:500;border:none;border-radius:12px;padding:12px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
            Send on WhatsApp — Vikram Singh
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom actions -->
    <div style="margin-top:28px;display:flex;flex-direction:column;gap:8px;">
      <button style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:14px 0;border:1px solid #e7e3d8;background:#ffffff;font-size:16px;font-weight:500;color:#1c1917;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
        View Expense
      </button>
      <button style="width:100%;border:none;background:none;padding:14px 0;font-size:16px;font-weight:500;color:#57534e;">Done</button>
    </div>
  </div>
</body>
</html>
