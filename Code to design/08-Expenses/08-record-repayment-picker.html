<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Record Repayment - Pick Friend</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <div style="height:47px;"></div>

    <!-- Content -->
    <div style="padding:24px 16px;">
      <!-- Header -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
        <button style="width:36px;height:36px;border-radius:18px;background:#ffffff;border:1px solid #e7e3d8;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </button>
        <h1 style="font-size:18px;font-weight:600;margin:0;color:#1c1917;">Record Repayment</h1>
      </div>

      <p style="font-size:14px;color:#57534e;margin:0 0 12px;">Who paid you back?</p>

      <!-- Friend list -->
      <div style="display:flex;flex-direction:column;gap:4px;">
        <button style="display:flex;align-items:center;gap:12px;padding:12px;border:none;background:none;border-radius:12px;text-align:left;">
          <span style="width:40px;height:40px;border-radius:20px;background:#8834B2;color:#ffffff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;">PS</span>
          <span style="flex:1;font-size:16px;font-weight:500;color:#1c1917;">Priya Sharma</span>
          <span style="font-size:14px;color:#a8a29e;">₹2,450.00</span>
        </button>
        <button style="display:flex;align-items:center;gap:12px;padding:12px;border:none;background:none;border-radius:12px;text-align:left;">
          <span style="width:40px;height:40px;border-radius:20px;background:#B26834;color:#ffffff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;">VS</span>
          <span style="flex:1;font-size:16px;font-weight:500;color:#1c1917;">Vikram Singh</span>
          <span style="font-size:14px;color:#a8a29e;">₹5,200.00</span>
        </button>
        <button style="display:flex;align-items:center;gap:12px;padding:12px;border:none;background:none;border-radius:12px;text-align:left;">
          <span style="width:40px;height:40px;border-radius:20px;background:#3488B2;color:#ffffff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;">RV</span>
          <span style="flex:1;font-size:16px;font-weight:500;color:#1c1917;">Rahul Verma</span>
          <span style="font-size:14px;color:#a8a29e;">₹850.00</span>
        </button>
        <button style="display:flex;align-items:center;gap:12px;padding:12px;border:none;background:none;border-radius:12px;text-align:left;">
          <span style="width:40px;height:40px;border-radius:20px;background:#B2345E;color:#ffffff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;">SP</span>
          <span style="flex:1;font-size:16px;font-weight:500;color:#1c1917;">Sneha Patel</span>
          <span style="font-size:14px;color:#a8a29e;">₹0.00</span>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
