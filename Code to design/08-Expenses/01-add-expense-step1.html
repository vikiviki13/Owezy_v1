<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Add Expense - Step 1</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <div style="height:47px;"></div>

    <!-- Content -->
    <div style="padding:24px 16px 32px;">
      <!-- Header with step dots -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
        <button style="width:36px;height:36px;border-radius:18px;background:#ffffff;border:1px solid #e7e3d8;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </button>
        <h1 style="font-size:18px;font-weight:600;margin:0;color:#1c1917;">Add Expense</h1>
        <div style="margin-left:auto;display:flex;gap:4px;">
          <div style="width:24px;height:6px;border-radius:3px;background:#059669;"></div>
          <div style="width:6px;height:6px;border-radius:3px;background:#e7e3d8;"></div>
          <div style="width:6px;height:6px;border-radius:3px;background:#e7e3d8;"></div>
        </div>
      </div>

      <!-- Audience question -->
      <p style="font-size:14px;color:#57534e;margin:0 0 12px;">Who is this expense for?</p>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button style="flex:1;border:none;border-radius:12px;padding:10px 0;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Self</button>
        <button style="flex:1;border:none;border-radius:12px;padding:10px 0;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Friend</button>
        <button style="flex:1;border:none;border-radius:12px;padding:10px 0;font-size:14px;font-weight:500;background:#059669;color:#ffffff;">Friends</button>
      </div>

      <!-- Search -->
      <div style="position:relative;margin-bottom:12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:14px;top:13px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="Search friends" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px 11px 38px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
      </div>

      <!-- Selected chips -->
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
        <span style="min-height:40px;display:inline-flex;align-items:center;gap:6px;background:#ecfdf5;color:#047857;font-size:14px;font-weight:500;padding:0 12px;border-radius:999px;">Priya Sharma <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
        <span style="min-height:40px;display:inline-flex;align-items:center;gap:6px;background:#ecfdf5;color:#047857;font-size:14px;font-weight:500;padding:0 12px;border-radius:999px;">Vikram Singh <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
      </div>

      <!-- Friend list -->
      <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:16px;">
        <button style="display:flex;align-items:center;gap:12px;padding:10px;border:none;background:none;border-radius:12px;text-align:left;">
          <span style="width:38px;height:38px;border-radius:19px;background:#8834B2;color:#ffffff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;">PS</span>
          <span style="flex:1;font-size:16px;font-weight:500;color:#1c1917;">Priya Sharma</span>
          <span style="width:20px;height:20px;border-radius:10px;background:#059669;display:flex;align-items:center;justify-content:center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        </button>
        <button style="display:flex;align-items:center;gap:12px;padding:10px;border:none;background:none;border-radius:12px;text-align:left;">
          <span style="width:38px;height:38px;border-radius:19px;background:#B26834;color:#ffffff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;">VS</span>
          <span style="flex:1;font-size:16px;font-weight:500;color:#1c1917;">Vikram Singh</span>
          <span style="width:20px;height:20px;border-radius:10px;background:#059669;display:flex;align-items:center;justify-content:center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        </button>
        <button style="display:flex;align-items:center;gap:12px;padding:10px;border:none;background:none;border-radius:12px;text-align:left;">
          <span style="width:38px;height:38px;border-radius:19px;background:#3488B2;color:#ffffff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;">RV</span>
          <span style="flex:1;font-size:16px;font-weight:500;color:#1c1917;">Rahul Verma</span>
        </button>
        <button style="display:flex;align-items:center;gap:12px;padding:10px;border:none;background:none;border-radius:12px;text-align:left;">
          <span style="width:38px;height:38px;border-radius:19px;background:#B2345E;color:#ffffff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;">SP</span>
          <span style="flex:1;font-size:16px;font-weight:500;color:#1c1917;">Sneha Patel</span>
        </button>
      </div>

      <!-- Import contacts -->
      <button style="margin-bottom:16px;min-height:56px;width:100%;display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:0 16px;text-align:left;box-sizing:border-box;">
        <span style="width:40px;height:40px;border-radius:12px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><rect width="6" height="5" x="16" y="2" rx="1"/><rect width="6" height="5" x="16" y="17" rx="1"/></svg>
        </span>
        <span style="flex:1;">
          <span style="display:block;font-size:16px;font-weight:600;color:#1c1917;">Import Contacts</span>
          <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Add and select several friends at once</span>
        </span>
      </button>

      <!-- Add new friend manually -->
      <div style="display:flex;align-items:center;gap:8px;border-top:1px solid #e7e3d8;padding-top:16px;">
        <input type="text" placeholder="Add a new friend by name" style="flex:1;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
        <button style="flex-shrink:0;padding:10px 16px;border:none;border-radius:12px;background:#f4f2ec;font-size:14px;font-weight:500;color:#1c1917;">Add</button>
      </div>

      <!-- Continue -->
      <button style="width:100%;margin-top:24px;background:#059669;color:#ffffff;font-size:16px;font-weight:500;border:none;border-radius:12px;padding:14px;">Continue (2 selected)</button>
    </div>
  </div>
</body>
</html>
