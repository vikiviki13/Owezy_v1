<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Record Repayment - Form</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <div style="height:47px;"></div>

    <!-- Content -->
    <div style="padding:24px 16px 32px;">
      <!-- Header -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
        <button style="width:36px;height:36px;border-radius:18px;background:#ffffff;border:1px solid #e7e3d8;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </button>
        <span style="width:36px;height:36px;border-radius:18px;background:#8834B2;color:#ffffff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;">PS</span>
        <div>
          <h1 style="font-size:16px;font-weight:600;margin:0;color:#1c1917;">Priya Sharma</h1>
          <p style="font-size:12px;color:#a8a29e;margin:2px 0 0;">Owes you ₹2,450.00</p>
        </div>
      </div>

      <!-- Direction -->
      <div style="display:flex;gap:8px;margin-bottom:20px;">
        <button style="flex:1;border:none;border-radius:12px;padding:8px 0;font-size:14px;font-weight:500;background:#059669;color:#ffffff;">Received from friend</button>
        <button style="flex:1;border:none;border-radius:12px;padding:8px 0;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Paid to friend</button>
      </div>

      <!-- Amount -->
      <p style="font-size:14px;color:#57534e;margin:0 0 8px;">Amount received</p>
      <div style="display:flex;align-items:center;gap:4px;margin-bottom:8px;">
        <span style="font-size:30px;line-height:36px;font-weight:700;color:#a8a29e;">₹</span>
        <span style="font-size:36px;line-height:40px;font-weight:800;color:#1c1917;">500.00</span>
      </div>
      <button style="background:none;border:none;font-size:12px;font-weight:500;color:#059669;padding:0;margin-bottom:16px;">Mark full amount (₹2,450.00)</button>

      <!-- Payment method -->
      <p style="font-size:14px;font-weight:500;color:#57534e;margin:0 0 8px;">Payment method</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;">
        <button style="padding:8px 14px;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#059669;color:#ffffff;">UPI</button>
        <button style="padding:8px 14px;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Cash</button>
        <button style="padding:8px 14px;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Bank Transfer</button>
        <button style="padding:8px 14px;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Card</button>
        <button style="padding:8px 14px;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Other</button>
      </div>

      <!-- Apply to -->
      <p style="font-size:14px;font-weight:500;color:#57534e;margin:0 0 8px;">Apply to</p>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button style="flex:1;padding:8px 0;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#059669;color:#ffffff;">General repayment</button>
        <button style="flex:1;padding:8px 0;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Specific expense</button>
      </div>

      <!-- Reference + notes -->
      <input type="text" placeholder="Transaction reference (optional)" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;margin-bottom:12px;">
      <textarea rows="2" placeholder="Notes (optional)" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;resize:none;margin-bottom:24px;"></textarea>

      <!-- Save -->
      <button style="width:100%;background:#059669;color:#ffffff;font-size:16px;font-weight:500;border:none;border-radius:12px;padding:14px;">Record Repayment</button>
    </div>
  </div>
</body>
</html>
