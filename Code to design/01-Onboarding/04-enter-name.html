<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Onboarding - Enter Name</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:47px 24px 24px;box-sizing:border-box;">
    <div style="max-width:384px;width:100%;margin:0 auto;">
      <!-- Heading -->
      <h1 style="font-size:24px;font-weight:700;margin:0 0 4px;color:#1c1917;">What should we call you?</h1>
      <p style="font-size:14px;color:#a8a29e;margin:0 0 24px;">You can change this anytime in Profile.</p>

      <!-- Name input -->
      <input type="text" placeholder="Your name" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;margin-bottom:12px;">

      <!-- Currency note -->
      <p style="font-size:14px;color:#57534e;margin:0 0 24px;">Default currency: <span style="font-weight:500;color:#1c1917;">INR ₹</span></p>

      <!-- Actions -->
      <button style="display:block;width:100%;background:#059669;color:#ffffff;font-size:16px;font-weight:500;border:none;border-radius:12px;padding:14px;margin-bottom:8px;">Get Started</button>
      <button style="display:block;width:100%;background:none;border:none;font-size:14px;font-weight:500;color:#a8a29e;padding:8px 0;">Skip for now</button>
    </div>
  </div>
</body>
</html>
