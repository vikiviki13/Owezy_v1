<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Onboarding - Record Repayments</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:47px 24px 40px;box-sizing:border-box;">
    <!-- Skip -->
    <div style="display:flex;justify-content:flex-end;">
      <button style="background:none;border:none;font-size:14px;font-weight:500;color:#a8a29e;padding:0;">Skip</button>
    </div>

    <!-- Slide content -->
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;">
      <div style="width:80px;height:80px;border-radius:24px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;margin-bottom:24px;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <path d="m8.59 13.51 6.83 3.98"/>
          <path d="m15.41 6.51-6.82 3.98"/>
        </svg>
      </div>
      <h1 style="font-size:24px;font-weight:700;margin:0 0 8px;color:#1c1917;line-height:1.3;">Record repayments and share statements.</h1>
      <p style="font-size:16px;color:#57534e;margin:0;line-height:1.5;">Send a clean summary over WhatsApp whenever you like.</p>
    </div>

    <!-- Dots + Let's go -->
    <div>
      <div style="display:flex;justify-content:center;gap:6px;margin-bottom:24px;">
        <div style="width:6px;height:6px;border-radius:3px;background:#e7e3d8;"></div>
        <div style="width:6px;height:6px;border-radius:3px;background:#e7e3d8;"></div>
        <div style="width:24px;height:6px;border-radius:3px;background:#059669;"></div>
      </div>
      <button style="display:block;width:100%;background:#059669;color:#ffffff;font-size:16px;font-weight:500;border:none;border-radius:12px;padding:14px;">Let's go</button>
    </div>
  </div>
</body>
</html>
