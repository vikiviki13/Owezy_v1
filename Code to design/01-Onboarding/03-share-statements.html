<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Onboarding - Share Statements</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#ffffff;position:relative;overflow:hidden;">
    <div style="height:env(safe-area-inset-top, 44px);"></div>
    
    <div style="padding:24px 24px 0;">
      <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
        <button style="background:none;border:none;color:#a8a29e;font-size:14px;font-weight:500;font-family:inherit;padding:8px;">Skip</button>
      </div>
      
      <div style="display:flex;justify-content:center;gap:6px;margin-bottom:40px;">
        <div style="width:6px;height:2.5px;background:#e7e3d8;border-radius:9999px;"></div>
        <div style="width:6px;height:2.5px;background:#e7e3d8;border-radius:9999px;"></div>
        <div style="width:24px;height:2.5px;background:#059669;border-radius:9999px;"></div>
      </div>
      
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;max-width:320px;margin:0 auto;">
        <div style="width:80px;height:80px;background:#ecfdf5;border-radius:24px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/>
            <circle cx="6" cy="12" r="3"/>
            <circle cx="18" cy="19" r="3"/>
            <path d="M8.59 13.51l1.79 1.8a2 2 0 0 0 2.83 0l3.53-3.52"/>
            <path d="M8.59 6.5a2 2 0 1 1 2.83 0l1.79 1.8"/>
            <path d="M8.59 19.5a2 2 0 1 0 2.83 0l3.53-3.52"/>
          </svg>
        </div>
        
        <h1 style="font-size:28px;font-weight:700;color:#1c1917;margin:0 0 8px;line-height:1.2;">Record repayments and share statements.</h1>
        <p style="font-size:16px;color:#57534e;margin:0;line-height:1.5;">Send a clean summary over WhatsApp whenever you like.</p>
      </div>
    </div>
    
    <div style="position:absolute;bottom:0;left:0;right:0;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom, 20px));background:#ffffff;">
      <button style="width:100%;max-width:342px;background:#059669;color:#ffffff;font-size:16px;font-weight:500;font-family:inherit;border:none;border-radius:16px;padding:16px 24px;display:block;margin:0 auto;">
        Let's go
      </button>
    </div>
  </div>
</body>
</html>
