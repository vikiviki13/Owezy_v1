<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Onboarding - Profile Setup</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#ffffff;position:relative;overflow:hidden;">
    <div style="height:env(safe-area-inset-top, 44px);"></div>
    
    <div style="padding:24px 24px 0;flex:1;display:flex;flex-direction:column;justify-content:center;">
      <div style="max-width:342px;margin:0 auto;width:100%;">
        <h1 style="font-size:28px;font-weight:700;color:#1c1917;margin:0 0 4px;line-height:1.2;">What should we call you?</h1>
        <p style="font-size:14px;color:#a8a29e;margin:0 0 24px;line-height:1.5;">You can change this anytime in Profile.</p>
        
        <input type="text" value="Arun Kumar" placeholder="Your name" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:14px 16px;font-size:16px;color:#1c1917;font-family:inherit;box-sizing:border-box;margin-bottom:16px;">
        
        <p style="font-size:14px;font-weight:500;color:#57534e;margin:0 0 24px;">Default currency: <span style="color:#1c1917;">INR ₹</span></p>
        
        <button style="width:100%;background:#059669;color:#ffffff;font-size:16px;font-weight:500;font-family:inherit;border:none;border-radius:16px;padding:16px 24px;display:block;margin-bottom:12px;">
          Get Started
        </button>
        
        <button style="width:100%;background:none;border:none;color:#a8a29e;font-size:14px;font-weight:500;font-family:inherit;padding:12px;">
          Skip for now
        </button>
      </div>
    </div>
  </div>
</body>
</html>
