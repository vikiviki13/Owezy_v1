<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contact Import — Success</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;">
  <!-- Centered success state -->
  <div style="text-align:center;padding:0 20px;width:100%;max-width:358px;">
    <span style="width:64px;height:64px;border-radius:9999px;background:#ecfdf5;display:grid;place-items:center;margin:0 auto 20px;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
    </span>
    <h1 style="font-size:24px;font-weight:700;margin:0;">3 friends added</h1>
    <p style="color:#57534e;margin-top:8px;">They're ready for expenses and payments.</p>

    <!-- Actions -->
    <div style="margin-top:32px;display:flex;flex-direction:column;gap:12px;">
      <button style="min-height:48px;border-radius:12px;background:#059669;color:#ffffff;font-weight:600;border:none;font-family:'Inter',Arial,sans-serif;">View Friends</button>
      <button style="min-height:48px;border-radius:12px;border:1px solid #e7e3d8;background:#ffffff;color:#1c1917;font-weight:600;font-family:'Inter',Arial,sans-serif;">Add Expense</button>
      <button style="min-height:44px;border:none;background:transparent;color:#57534e;font-size:14px;font-weight:600;font-family:'Inter',Arial,sans-serif;">Done</button>
    </div>
  </div>

</div>

</body>
</html>
