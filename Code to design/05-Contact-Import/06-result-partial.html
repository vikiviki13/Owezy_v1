<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contact Import — Partial Result</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <div style="padding:24px 16px 32px;box-sizing:border-box;">

    <!-- Back button -->
    <button style="width:44px;height:44px;border-radius:9999px;display:grid;place-items:center;margin-left:-4px;border:none;background:transparent;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>

    <!-- Header -->
    <div style="margin-top:12px;">
      <span style="width:56px;height:56px;border-radius:9999px;background:#fef3c7;display:grid;place-items:center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </span>
      <h1 style="font-size:24px;font-weight:700;margin:20px 0 0;">1 of 3 friends added</h1>
      <p style="font-size:14px;color:#57534e;margin:8px 0 0;">The friends below still need your attention. Everyone else remains added.</p>
    </div>

    <!-- Failure cards -->
    <div style="margin-top:24px;display:flex;flex-direction:column;gap:12px;">
      <!-- Failure card -->
      <div style="border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:16px;">
        <div style="display:flex;align-items:flex-start;gap:12px;">
          <div style="width:42px;height:42px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#ffffff;background:hsl(25,55%,45%);">SK</div>
          <div style="min-width:0;flex:1;">
            <p style="font-weight:600;margin:0;">Sana Khan couldn't be added</p>
            <p style="font-size:14px;line-height:20px;color:#dc2626;margin-top:4px;">WhatsApp number required</p>
          </div>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px;padding-left:54px;">
          <button style="min-height:44px;padding:0 16px;border-radius:12px;border:1px solid #e7e3d8;background:#ffffff;font-size:14px;font-weight:600;font-family:'Inter',Arial,sans-serif;color:#1c1917;">Fix</button>
          <button style="min-height:44px;padding:0 16px;border-radius:12px;border:none;background:#ecfdf5;color:#047857;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;font-family:'Inter',Arial,sans-serif;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg> Try Again
          </button>
        </div>
      </div>
    </div>

    <!-- Continue button -->
    <button style="margin-top:24px;width:100%;min-height:48px;border-radius:12px;background:#059669;color:#ffffff;font-weight:600;border:none;font-family:'Inter',Arial,sans-serif;">View added friends</button>

  </div>
</div>

</body>
</html>
