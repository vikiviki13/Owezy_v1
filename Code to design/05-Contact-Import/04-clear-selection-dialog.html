<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contact Import — Clear Selection Dialog</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Dimmed review screen behind -->
  <div style="padding:20px 16px;opacity:0.4;">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:44px;height:44px;border-radius:9999px;"></div>
      <div>
        <div style="height:24px;width:160px;background:#f4f2ec;border-radius:6px;"></div>
        <div style="height:18px;width:120px;background:#f4f2ec;border-radius:6px;margin-top:8px;"></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px;">
      <div style="height:64px;border-radius:16px;background:#ecfdf5;"></div>
      <div style="height:64px;border-radius:16px;background:#f0f9ff;"></div>
      <div style="height:64px;border-radius:16px;background:#fffbeb;"></div>
    </div>
    <div style="border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;height:110px;margin-top:20px;"></div>
    <div style="border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;height:110px;margin-top:12px;"></div>
  </div>

  <!-- Overlay scrim -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:#000000;opacity:0.5;"></div>

  <!-- Confirm dialog centered -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;padding:16px;">
    <div style="position:relative;width:100%;max-width:358px;border-radius:24px;background:#ffffff;padding:20px;box-sizing:border-box;">
      <h2 style="font-size:18px;font-weight:700;margin:0;">Clear selection?</h2>
      <p style="margin-top:8px;font-size:14px;line-height:24px;color:#57534e;">This will deselect all 3 contacts. You can select individual contacts again without reopening the picker.</p>
      <div style="margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <button style="min-height:48px;border-radius:12px;border:1px solid #e7e3d8;background:#ffffff;font-weight:600;font-family:'Inter',Arial,sans-serif;color:#1c1917;">Cancel</button>
        <button style="min-height:48px;border-radius:12px;border:none;background:#dc2626;color:#ffffff;font-weight:600;font-family:'Inter',Arial,sans-serif;">Clear Selection</button>
      </div>
    </div>
  </div>

</div>

</body>
</html>
