<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Contact Import — Choose Friends</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <div style="padding:20px 16px 144px;box-sizing:border-box;min-height:844px;">

    <!-- Header -->
    <div style="display:flex;align-items:center;gap:12px;">
      <button style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;margin-left:-4px;border:none;background:transparent;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div style="min-width:0;flex:1;">
        <h1 style="font-size:20px;font-weight:700;margin:0;">Add Friends</h1>
        <p style="font-size:14px;color:#57534e;margin:2px 0 0;">0 contacts selected</p>
      </div>
      <span style="min-height:44px;padding:0 12px;border-radius:12px;font-size:14px;font-weight:600;color:#059669;display:inline-flex;align-items:center;gap:8px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg> Add more
      </span>
    </div>

    <!-- Empty state -->
    <section style="display:grid;place-items:center;text-align:center;min-height:520px;">
      <div style="max-width:384px;">
        <span style="width:56px;height:56px;border-radius:16px;background:#ecfdf5;display:grid;place-items:center;margin:0 auto;">
          <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        <h2 style="font-size:18px;font-weight:700;margin:16px 0 0;">Choose friends from your contacts</h2>
        <p style="font-size:14px;line-height:24px;color:#57534e;margin:8px 0 0;">You'll review names and WhatsApp numbers before anything is saved.</p>
        <button style="margin-top:24px;min-height:48px;padding:0 20px;border-radius:12px;background:#059669;color:#ffffff;font-weight:600;display:inline-flex;align-items:center;gap:8px;border:none;font-family:'Inter',Arial,sans-serif;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          Select contacts
        </button>
      </div>
    </section>

  </div>

  <!-- Sticky bottom action bar (disabled state) -->
  <div style="position:absolute;left:0;right:0;bottom:0;border-top:1px solid #e7e3d8;background:#fbfaf7;padding:12px 16px;">
    <button style="width:100%;min-height:48px;border-radius:12px;background:#059669;opacity:0.4;color:#ffffff;font-weight:600;padding:0 16px;border:none;font-family:'Inter',Arial,sans-serif;">Review 0 Contacts</button>
  </div>

</div>

</body>
</html>
