<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Security Setup — Auto Lock</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;flex-direction:column;">
  <!-- Top bar -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:28px 20px 0;">
    <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:#a8a29e;">Security Setup</span>
    <button style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  <!-- Centered content -->
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 20px 32px;">
    <!-- Header -->
    <div style="text-align:center;">
      <span style="width:64px;height:64px;border-radius:16px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;margin:0 auto;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
      </span>
      <h1 style="font-size:24px;font-weight:700;margin-top:20px;">Automatically Lock</h1>
      <p style="font-size:14px;color:#57534e;margin-top:8px;">Choose how quickly Tab locks when you stop using it.</p>
    </div>

    <!-- Options list -->
    <div style="margin-top:24px;border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;overflow:hidden;">
      <button style="width:100%;min-height:56px;padding:12px 16px;display:flex;align-items:center;gap:12px;border:none;background:#ffffff;border-bottom:1px solid #e7e3d8;font-family:'Inter',Arial,sans-serif;text-align:left;box-sizing:border-box;">
        <span style="width:20px;height:20px;border-radius:9999px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
        <span style="flex:1;font-size:14px;font-weight:500;">Immediately</span>
      </button>
      <button style="width:100%;min-height:56px;padding:12px 16px;display:flex;align-items:center;gap:12px;border:none;background:#ffffff;border-bottom:1px solid #e7e3d8;font-family:'Inter',Arial,sans-serif;text-align:left;box-sizing:border-box;">
        <span style="width:20px;height:20px;border-radius:9999px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
        <span style="flex:1;font-size:14px;font-weight:500;">After 1 minute</span>
      </button>
      <button style="width:100%;min-height:56px;padding:12px 16px;display:flex;align-items:center;gap:12px;border:none;background:#ffffff;border-bottom:1px solid #e7e3d8;font-family:'Inter',Arial,sans-serif;text-align:left;box-sizing:border-box;">
        <span style="width:20px;height:20px;border-radius:9999px;border:2px solid #059669;background:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span style="flex:1;font-size:14px;font-weight:500;">After 5 minutes</span>
        <span style="font-size:12px;font-weight:600;color:#059669;">Recommended</span>
      </button>
      <button style="width:100%;min-height:56px;padding:12px 16px;display:flex;align-items:center;gap:12px;border:none;background:#ffffff;border-bottom:1px solid #e7e3d8;font-family:'Inter',Arial,sans-serif;text-align:left;box-sizing:border-box;">
        <span style="width:20px;height:20px;border-radius:9999px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
        <span style="flex:1;font-size:14px;font-weight:500;">After 15 minutes</span>
      </button>
      <button style="width:100%;min-height:56px;padding:12px 16px;display:flex;align-items:center;gap:12px;border:none;background:#ffffff;font-family:'Inter',Arial,sans-serif;text-align:left;box-sizing:border-box;">
        <span style="width:20px;height:20px;border-radius:9999px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
        <span style="flex:1;font-size:14px;font-weight:500;">After 30 minutes</span>
      </button>
    </div>

    <!-- Turn on button -->
    <button style="width:100%;min-height:56px;border-radius:16px;background:#059669;color:#ffffff;font-weight:600;margin-top:28px;border:none;font-family:'Inter',Arial,sans-serif;">Turn On App Lock</button>
  </div>

</div>

</body>
</html>
