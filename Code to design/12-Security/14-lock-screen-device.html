<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lock Screen — Device Security</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:32px 20px;text-align:center;box-sizing:border-box;">
  <!-- Brand -->
  <div style="display:flex;align-items:center;justify-content:center;gap:8px;color:#059669;margin-bottom:32px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
    <span style="font-weight:700;letter-spacing:-0.02em;">Owezy</span>
  </div>

  <!-- Lock icon -->
  <span style="width:80px;height:80px;border-radius:26px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;margin:0 auto;">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
  </span>

  <h1 style="font-size:24px;font-weight:700;margin-top:20px;">App Locked</h1>
  <p style="font-size:14px;color:#57534e;margin-top:8px;">Your financial records are protected.</p>

  <!-- Device unlock button -->
  <button style="margin-top:32px;width:100%;min-height:56px;border-radius:16px;background:#059669;color:#ffffff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;border:none;font-family:'Inter',Arial,sans-serif;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
    Unlock with Device Security
  </button>

  <!-- Use PIN instead -->
  <button style="margin-top:12px;min-height:48px;padding:0 16px;font-size:14px;font-weight:600;color:#059669;border:none;border-radius:12px;background:transparent;display:inline-flex;align-items:center;font-family:'Inter',Arial,sans-serif;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/></svg> Use App PIN Instead
  </button>

  <!-- Privacy footnote -->
  <p style="font-size:12px;line-height:20px;color:#a8a29e;margin-top:32px;">Your biometric information stays on your device. Tab only receives confirmation that verification succeeded.</p>

  <!-- Reset link -->
  <button style="min-height:44px;padding:0 16px;margin-top:16px;font-size:14px;font-weight:600;color:#a8a29e;border:none;border-radius:12px;background:transparent;font-family:'Inter',Arial,sans-serif;">Can't unlock? Turn off App Lock with your account password</button>

</div>

</body>
</html>
