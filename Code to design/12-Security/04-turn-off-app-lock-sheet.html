<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Turn Off App Lock Sheet</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Dimmed app lock page behind -->
  <div style="padding:76px 16px 40px;opacity:0.4;box-sizing:border-box;">
    <div style="border-radius:24px;background:#ffffff;border:1px solid #e7e3d8;height:110px;margin-bottom:28px;"></div>
    <div style="border-radius:24px;background:#ecfdf5;height:150px;margin-bottom:28px;"></div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:200px;"></div>
  </div>

  <!-- Overlay scrim -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:#000000;opacity:0.4;"></div>

  <!-- Turn off App Lock bottom sheet -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:24px 24px 0 0;">
    <!-- Grabber -->
    <div style="display:flex;justify-content:center;padding-top:12px;">
      <div style="height:6px;width:40px;border-radius:9999px;background:#e7e3d8;"></div>
    </div>

    <!-- Sheet header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
      <h2 style="font-size:18px;font-weight:600;margin:0;">Turn off App Lock?</h2>
      <div style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </div>
    </div>

    <!-- Body -->
    <div style="padding:4px 20px 24px;">
      <p style="font-size:14px;line-height:24px;color:#57534e;margin:0 0 20px;">Anyone who can access this device may be able to view your expense and repayment information.</p>
      <div style="display:flex;gap:12px;">
        <button style="flex:1;min-height:48px;border-radius:12px;background:#f4f2ec;border:none;font-weight:600;font-family:'Inter',Arial,sans-serif;color:#1c1917;">Cancel</button>
        <button style="flex:1;min-height:48px;border-radius:12px;background:#dc2626;border:none;font-weight:600;font-family:'Inter',Arial,sans-serif;color:#ffffff;">Turn Off</button>
      </div>
    </div>
  </div>

</div>

</body>
</html>
