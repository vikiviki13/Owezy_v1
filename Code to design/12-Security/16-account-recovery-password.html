<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Recover App PIN — Verify Password</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <div style="padding:32px 20px 32px;box-sizing:border-box;min-height:844px;">
    <div style="width:100%;max-width:358px;margin:0 auto;">

      <!-- Icon -->
      <span style="width:64px;height:64px;border-radius:16px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
      </span>

      <!-- Title -->
      <h1 style="font-size:24px;font-weight:700;margin-top:20px;">Recover App PIN</h1>
      <p style="font-size:14px;line-height:24px;color:#57534e;margin-top:8px;">Verify your account identity, then create a new PIN. Your existing PIN is never revealed or emailed.</p>

      <!-- Password verify card -->
      <form style="border-radius:24px;background:#ffffff;border:1px solid #e7e3d8;padding:20px;margin-top:28px;display:block;">
        <label style="display:block;text-align:left;">
          <span style="font-size:14px;font-weight:600;">Account password</span>
          <input type="password" placeholder="••••••••" style="margin-top:8px;width:100%;box-sizing:border-box;min-height:48px;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
        </label>

        <!-- Verify button -->
        <button style="margin-top:20px;width:100%;min-height:48px;border-radius:12px;background:#059669;color:#ffffff;font-weight:600;border:none;font-family:'Inter',Arial,sans-serif;">Verify Account</button>

        <!-- Use device security instead -->
        <button type="button" style="margin-top:8px;width:100%;min-height:44px;border:none;background:transparent;color:#059669;font-size:14px;font-weight:600;font-family:'Inter',Arial,sans-serif;">Use Device Security Instead</button>
      </form>

      <!-- Cancel -->
      <button style="margin-top:16px;min-height:44px;padding:0 16px;border:none;background:transparent;color:#57534e;font-size:14px;font-weight:600;font-family:'Inter',Arial,sans-serif;">Cancel</button>

    </div>
  </div>
</div>

</body>
</html>
