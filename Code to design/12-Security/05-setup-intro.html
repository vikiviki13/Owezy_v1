<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Security Setup — Protect Your App</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;flex-direction:column;">
  <!-- Top bar -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:28px 20px 0;">
    <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:#a8a29e;">Security Setup</span>
    <button style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  <!-- Centered content -->
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 20px 32px;text-align:center;">
    <!-- Icon -->
    <span style="width:80px;height:80px;border-radius:26px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;margin:0 auto;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
    </span>
    <p style="font-size:14px;font-weight:600;color:#059669;margin-top:24px;">Protect Your App</p>
    <h1 style="font-size:24px;font-weight:700;margin-top:8px;">Keep your financial records private</h1>
    <p style="font-size:14px;line-height:24px;color:#57534e;margin-top:12px;">Use your device security or an app PIN to unlock your records.</p>

    <!-- Benefits card -->
    <div style="text-align:left;border-radius:24px;background:#ffffff;border:1px solid #e7e3d8;padding:20px;margin-top:28px;">
      <div style="display:flex;align-items:center;gap:12px;font-size:14px;margin-bottom:12px;">
        <span style="width:24px;height:24px;border-radius:9999px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span> Protect expense history
      </div>
      <div style="display:flex;align-items:center;gap:12px;font-size:14px;margin-bottom:12px;">
        <span style="width:24px;height:24px;border-radius:9999px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span> Protect friend balances
      </div>
      <div style="display:flex;align-items:center;gap:12px;font-size:14px;margin-bottom:12px;">
        <span style="width:24px;height:24px;border-radius:9999px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span> Protect repayment information
      </div>
      <div style="display:flex;align-items:center;gap:12px;font-size:14px;margin-bottom:12px;">
        <span style="width:24px;height:24px;border-radius:9999px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span> Protect statements
      </div>
      <div style="display:flex;align-items:center;gap:12px;font-size:14px;">
        <span style="width:24px;height:24px;border-radius:9999px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span> Protect attachments
      </div>
    </div>

    <!-- Continue -->
    <button style="width:100%;min-height:56px;border-radius:16px;background:#059669;color:#ffffff;font-weight:600;margin-top:28px;border:none;font-family:'Inter',Arial,sans-serif;">Continue</button>
    <button style="min-height:48px;padding:0 20px;font-size:14px;font-weight:600;color:#57534e;margin-top:8px;border:none;background:transparent;font-family:'Inter',Arial,sans-serif;">Not Now</button>
  </div>

</div>

</body>
</html>
