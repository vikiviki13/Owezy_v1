<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>App Lock — Off</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Sticky header -->
  <div style="position:absolute;top:0;left:0;right:0;z-index:20;height:56px;background:#fbfaf7;border-bottom:1px solid #e7e3d8;display:flex;align-items:center;padding:0 12px;">
    <button style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <h1 style="font-size:18px;font-weight:600;margin-left:4px;">App Lock</h1>
  </div>

  <div style="padding:76px 16px 40px;box-sizing:border-box;">
    <!-- Description -->
    <p style="font-size:14px;line-height:24px;color:#57534e;margin:0 0 20px;">Protect your expense, repayment and financial records when you open the app.</p>

    <!-- App lock toggle card -->
    <div style="border-radius:24px;background:#ffffff;border:1px solid #e7e3d8;padding:20px;margin-bottom:28px;">
      <div style="display:flex;align-items:center;gap:16px;">
        <span style="width:48px;height:48px;border-radius:16px;background:#f4f2ec;color:#a8a29e;display:flex;align-items:center;justify-content:center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
        </span>
        <div style="flex:1;">
          <h2 style="font-weight:700;margin:0;">App Lock</h2>
          <p style="font-size:12px;color:#a8a29e;margin-top:4px;">OFF</p>
        </div>
        <!-- Switch unchecked -->
        <span style="width:44px;height:24px;background:#e7e3d8;border-radius:9999px;display:inline-flex;align-items:center;padding:2px;flex-shrink:0;box-sizing:border-box;">
          <span style="width:20px;height:20px;border-radius:9999px;background:#ffffff;"></span>
        </span>
      </div>
    </div>

    <!-- Disabled notice card -->
    <div style="border-radius:24px;background:#f4f2ec;padding:20px;text-align:center;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto;display:block;"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
      <h2 style="font-weight:700;margin-top:12px;">App Lock is currently disabled</h2>
      <p style="font-size:14px;line-height:24px;color:#57534e;margin-top:8px;">Anyone with access to this device may be able to open your financial records.</p>
      <button style="width:100%;min-height:48px;border-radius:12px;background:#059669;color:#ffffff;font-weight:600;margin-top:20px;border:none;font-family:'Inter',Arial,sans-serif;">Turn On App Lock</button>
    </div>

  </div>
</div>

</body>
</html>
