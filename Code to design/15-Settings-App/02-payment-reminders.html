<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Payment Reminder Settings</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Sticky header -->
    <header style="position:absolute;top:47px;left:0;right:0;z-index:20;height:56px;display:flex;align-items:center;background:rgba(251,250,247,0.95);border-bottom:1px solid #e7e3d8;padding:0 12px;box-sizing:border-box;">
      <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <h1 style="font-size:18px;font-weight:600;margin:0 0 0 4px;color:#1c1917;">Payment Reminders</h1>
    </header>

    <!-- Content -->
    <div style="padding:120px 16px 40px;box-sizing:border-box;">
      <p style="font-size:14px;line-height:24px;color:#57534e;margin:0 0 20px;">Choose when Tab should remind you to follow up. Messages to friends are never sent automatically.</p>

      <!-- Default reminder timing -->
      <section style="margin-bottom:28px;">
        <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:#a8a29e;margin:0 0 8px 4px;">Default Reminder Timing</h2>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;overflow:hidden;">
          <button style="width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;border-bottom:1px solid #e7e3d8;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #059669;background:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            <span style="flex:1;font-size:15px;font-weight:600;color:#1c1917;">7 days</span>
          </button>
          <button style="width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;border-bottom:1px solid #e7e3d8;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
            <span style="flex:1;font-size:15px;font-weight:600;color:#1c1917;">1 day</span>
          </button>
          <button style="width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;border-bottom:1px solid #e7e3d8;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
            <span style="flex:1;font-size:15px;font-weight:600;color:#1c1917;">3 days</span>
          </button>
          <button style="width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
            <span style="flex:1;font-size:15px;font-weight:600;color:#1c1917;">Custom</span>
          </button>
        </div>
      </section>

      <!-- Reminder time -->
      <label style="display:block;margin-bottom:28px;">
        <span style="display:block;font-size:14px;font-weight:600;color:#1c1917;margin-bottom:8px;">Reminder time</span>
        <input type="time" value="09:00" style="width:100%;min-height:48px;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
      </label>

      <!-- Note -->
      <div style="border-radius:16px;background:#f4f2ec;padding:16px;margin-bottom:28px;font-size:12px;line-height:20px;color:#57534e;">Reminders notify you—the app owner—to take action. WhatsApp sharing always requires you to tap and send.</div>

      <button style="width:100%;min-height:48px;border:none;border-radius:12px;background:#059669;color:#ffffff;font-size:16px;font-weight:600;">Save Reminder Settings</button>
    </div>
  </div>
</body>
</html>
