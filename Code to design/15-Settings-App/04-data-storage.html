<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Data &amp; Storage Settings</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Sticky header -->
    <header style="position:absolute;top:47px;left:0;right:0;z-index:20;height:56px;display:flex;align-items:center;background:rgba(251,250,247,0.95);border-bottom:1px solid #e7e3d8;padding:0 12px;box-sizing:border-box;">
      <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <h1 style="font-size:18px;font-weight:600;margin:0 0 0 4px;color:#1c1917;">Data &amp; Storage</h1>
    </header>

    <!-- Content -->
    <div style="padding:120px 16px 40px;box-sizing:border-box;">
      <p style="font-size:14px;line-height:24px;color:#57534e;margin:0 0 20px;">See what is stored on this device and safely manage temporary files.</p>

      <!-- Info cards -->
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:28px;">
        <div style="border-radius:16px;background:#ffffff;border:1px solid #e7e3d8;padding:16px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:16px;"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
          <p style="font-size:12px;color:#a8a29e;margin:0;">Stored Receipts</p>
          <p style="font-size:16px;font-weight:700;color:#1c1917;margin:4px 0 0;">3 receipts</p>
        </div>
        <div style="border-radius:16px;background:#ffffff;border:1px solid #e7e3d8;padding:16px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:16px;"><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></svg>
          <p style="font-size:12px;color:#a8a29e;margin:0;">Storage Used</p>
          <p style="font-size:16px;font-weight:700;color:#1c1917;margin:4px 0 0;">248.3 KB</p>
        </div>
      </div>

      <!-- Attachments -->
      <section style="margin-bottom:28px;">
        <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:#a8a29e;margin:0 0 8px 4px;">Attachments</h2>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;overflow:hidden;">
          <button style="width:100%;min-height:56px;padding:0 16px;display:flex;align-items:center;gap:12px;border:none;background:none;text-align:left;box-sizing:border-box;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
            <span style="flex:1;font-size:14px;font-weight:500;color:#1c1917;">Manage Attachments</span>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </section>

      <!-- Cache -->
      <section style="margin-bottom:28px;">
        <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:#a8a29e;margin:0 0 8px 4px;">Cache</h2>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;overflow:hidden;">
          <button style="width:100%;min-height:56px;padding:12px 16px;display:flex;align-items:center;gap:12px;border:none;background:none;text-align:left;box-sizing:border-box;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
            <span style="flex:1;">
              <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;">Clear Cached Data</span>
              <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;margin-top:4px;">Removes temporary app files only</span>
            </span>
          </button>
        </div>
      </section>

      <!-- Note -->
      <div style="border-radius:16px;background:#f4f2ec;padding:16px;font-size:12px;line-height:20px;color:#57534e;"><strong style="color:#1c1917;">Cache is not user data.</strong> Clearing cache never deletes friends, expenses, repayments, groups, or account information.</div>
    </div>
  </div>
</body>
</html>
