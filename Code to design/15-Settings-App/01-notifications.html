<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notification Settings</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Sticky header -->
    <header style="position:absolute;top:47px;left:0;right:0;z-index:20;height:56px;display:flex;align-items:center;background:rgba(251,250,247,0.95);border-bottom:1px solid #e7e3d8;padding:0 12px;box-sizing:border-box;">
      <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <h1 style="font-size:18px;font-weight:600;margin:0 0 0 4px;color:#1c1917;">Notifications</h1>
    </header>

    <!-- Content -->
    <div style="padding:120px 16px 40px;box-sizing:border-box;">
      <p style="font-size:14px;line-height:24px;color:#57534e;margin:0 0 20px;">Control the reminders and important updates you receive.</p>

      <!-- Enable browser notifications -->
      <button style="width:100%;min-height:48px;margin-bottom:24px;border:none;border-radius:12px;background:#ecfdf5;color:#059669;font-size:16px;font-weight:600;">Enable browser notifications</button>

      <!-- Notifications -->
      <section style="margin-bottom:28px;">
        <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:#a8a29e;margin:0 0 8px 4px;">Notifications</h2>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;">
          <div style="min-height:72px;padding:14px 16px;display:flex;align-items:center;gap:16px;">
            <label style="flex:1;min-width:0;">
              <span style="display:block;font-size:15px;font-weight:500;line-height:20px;color:#1c1917;">Allow Notifications</span>
            </label>
            <span style="width:44px;height:24px;border-radius:12px;background:#059669;position:relative;flex-shrink:0;">
              <span style="position:absolute;top:2px;left:22px;width:20px;height:20px;border-radius:10px;background:#ffffff;"></span>
            </span>
          </div>
        </div>
      </section>

      <!-- Categories -->
      <section style="margin-bottom:28px;">
        <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:#a8a29e;margin:0 0 8px 4px;">Categories</h2>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;overflow:hidden;">
          <div style="min-height:72px;padding:14px 16px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #e7e3d8;">
            <label style="flex:1;min-width:0;">
              <span style="display:block;font-size:15px;font-weight:500;line-height:20px;color:#1c1917;">Payment Reminders</span>
              <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;margin-top:4px;">Notify me when I schedule a reminder for a friend.</span>
            </label>
            <span style="width:44px;height:24px;border-radius:12px;background:#059669;position:relative;flex-shrink:0;">
              <span style="position:absolute;top:2px;left:22px;width:20px;height:20px;border-radius:10px;background:#ffffff;"></span>
            </span>
          </div>
          <div style="min-height:72px;padding:14px 16px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #e7e3d8;">
            <label style="flex:1;min-width:0;">
              <span style="display:block;font-size:15px;font-weight:500;line-height:20px;color:#1c1917;">Pending Balance Reminders</span>
              <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;margin-top:4px;">Remind me about long-pending balances.</span>
            </label>
            <span style="width:44px;height:24px;border-radius:12px;background:#e7e3d8;position:relative;flex-shrink:0;">
              <span style="position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;background:#ffffff;"></span>
            </span>
          </div>
          <div style="min-height:72px;padding:14px 16px;display:flex;align-items:center;gap:16px;">
            <label style="flex:1;min-width:0;">
              <span style="display:block;font-size:15px;font-weight:500;line-height:20px;color:#1c1917;">App Updates</span>
              <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;margin-top:4px;">Important product information. Marketing is off by default.</span>
            </label>
            <span style="width:44px;height:24px;border-radius:12px;background:#059669;position:relative;flex-shrink:0;">
              <span style="position:absolute;top:2px;left:22px;width:20px;height:20px;border-radius:10px;background:#ffffff;"></span>
            </span>
          </div>
        </div>
      </section>

      <button style="width:100%;min-height:48px;border:none;border-radius:12px;background:#059669;color:#ffffff;font-size:16px;font-weight:600;">Save Preferences</button>
    </div>
  </div>
</body>
</html>
