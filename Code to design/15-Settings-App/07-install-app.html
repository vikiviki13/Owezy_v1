<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Install App Settings</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Sticky header -->
    <header style="position:absolute;top:47px;left:0;right:0;z-index:20;height:56px;display:flex;align-items:center;background:rgba(251,250,247,0.95);border-bottom:1px solid #e7e3d8;padding:0 12px;box-sizing:border-box;">
      <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <h1 style="font-size:18px;font-weight:600;margin:0 0 0 4px;color:#1c1917;">Install App</h1>
    </header>

    <!-- Content -->
    <div style="padding:136px 16px 40px;box-sizing:border-box;">
      <!-- Install card -->
      <div style="border-radius:24px;background:#ffffff;border:1px solid #e7e3d8;padding:24px;text-align:center;">
        <span style="width:64px;height:64px;border-radius:16px;background:#ecfdf5;color:#059669;display:flex;align-items:center;justify-content:center;margin:0 auto;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>
        </span>
        <h2 style="font-size:20px;font-weight:700;color:#1c1917;margin:20px 0 0;">Install Tab</h2>
        <p style="font-size:14px;line-height:24px;color:#57534e;margin:8px 0 0;">Install this app on your device for quicker access.</p>

        <button style="margin-top:24px;width:100%;min-height:48px;border:none;border-radius:12px;background:#059669;color:#ffffff;font-size:16px;font-weight:600;">Install</button>
      </div>
    </div>
  </div>
</body>
</html>
