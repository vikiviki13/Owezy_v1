<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Create Group Bottom Sheet</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Dimmed groups screen behind -->
  <div style="padding:24px 16px;opacity:0.4;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div style="height:22px;width:80px;background:#f4f2ec;border-radius:6px;"></div>
      <div style="width:36px;height:36px;border-radius:9999px;background:#059669;"></div>
    </div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:74px;margin-bottom:8px;"></div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:74px;"></div>
  </div>

  <!-- Overlay scrim -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:#000000;opacity:0.4;"></div>

  <!-- Create Group bottom sheet -->
  <div style="position:absolute;left:0;right:0;bottom:0;top:300px;background:#ffffff;border-radius:24px 24px 0 0;display:flex;flex-direction:column;">
    <!-- Grabber -->
    <div style="display:flex;justify-content:center;padding-top:12px;">
      <div style="height:6px;width:40px;border-radius:9999px;background:#e7e3d8;"></div>
    </div>

    <!-- Sheet header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
      <h2 style="font-size:18px;font-weight:600;margin:0;">Create Group</h2>
      <div style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </div>
    </div>

    <!-- Body -->
    <div style="padding:4px 20px 24px;display:flex;flex-direction:column;gap:16px;">
      <!-- Group name -->
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:14px;font-weight:500;color:#57534e;">Group name <span style="color:#dc2626;">*</span></span>
        <input type="text" value="Goa Trip" placeholder="e.g. Office Friends" style="box-sizing:border-box;width:100%;background:#ffffff;border:1px solid #059669;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
      </label>

      <!-- Members -->
      <div>
        <p style="font-size:14px;font-weight:500;color:#57534e;margin:0 0 8px;">Members</p>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <button style="display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:12px;text-align:left;width:100%;box-sizing:border-box;border:none;background:transparent;font-family:'Inter',Arial,sans-serif;">
            <span style="font-weight:500;font-size:14px;">Jiya Mehta</span>
            <span style="width:20px;height:20px;border-radius:9999px;background:#059669;display:flex;align-items:center;justify-content:center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button style="display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:12px;text-align:left;width:100%;box-sizing:border-box;border:none;background:transparent;font-family:'Inter',Arial,sans-serif;">
            <span style="font-weight:500;font-size:14px;">Arun Kumar</span>
            <span style="width:20px;height:20px;border-radius:9999px;background:#059669;display:flex;align-items:center;justify-content:center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </button>
          <button style="display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:12px;text-align:left;width:100%;box-sizing:border-box;border:none;background:transparent;font-family:'Inter',Arial,sans-serif;">
            <span style="font-weight:500;font-size:14px;">Rhea Lal</span>
          </button>
          <button style="display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:12px;text-align:left;width:100%;box-sizing:border-box;border:none;background:transparent;font-family:'Inter',Arial,sans-serif;">
            <span style="font-weight:500;font-size:14px;">Sameer Patel</span>
          </button>
        </div>
      </div>

      <!-- Create button -->
      <button style="background:#059669;color:#ffffff;font-size:15px;font-weight:500;border:none;border-radius:12px;padding:12px 0;font-family:'Inter',Arial,sans-serif;">Create Group</button>
    </div>
  </div>

</div>

</body>
</html>
