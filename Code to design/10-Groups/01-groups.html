<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Groups</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Main content -->
  <div style="padding:24px 16px 120px;">

    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <h1 style="font-size:20px;font-weight:600;margin:0;">Groups</h1>
      <button style="width:36px;height:36px;border-radius:9999px;background:#059669;display:flex;align-items:center;justify-content:center;border:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <!-- Group list -->
    <div style="display:flex;flex-direction:column;gap:8px;">
      <!-- Group row -->
      <button style="display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;padding:16px;text-align:left;width:100%;box-sizing:border-box;font-family:'Inter',Arial,sans-serif;">
        <div style="flex:1;min-width:0;">
          <p style="font-weight:500;margin:0;">Goa Trip</p>
          <p style="font-size:12px;color:#a8a29e;margin:2px 0 0;">4 members</p>
        </div>
        <div style="display:flex;">
          <span style="width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#ffffff;background:hsl(160,55%,45%);border:2px solid #ffffff;">JM</span>
          <span style="width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#ffffff;background:hsl(190,55%,45%);border:2px solid #ffffff;margin-left:-8px;">AK</span>
          <span style="width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#ffffff;background:hsl(25,55%,45%);border:2px solid #ffffff;margin-left:-8px;">RL</span>
        </div>
        <div style="text-align:right;flex-shrink:0;margin-left:8px;">
          <p style="font-weight:600;font-size:14px;margin:0;">₹3,060</p>
        </div>
      </button>

      <!-- Group row -->
      <button style="display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;padding:16px;text-align:left;width:100%;box-sizing:border-box;font-family:'Inter',Arial,sans-serif;">
        <div style="flex:1;min-width:0;">
          <p style="font-weight:500;margin:0;">Office Friends</p>
          <p style="font-size:12px;color:#a8a29e;margin:2px 0 0;">6 members</p>
        </div>
        <div style="display:flex;">
          <span style="width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#ffffff;background:hsl(340,55%,45%);border:2px solid #ffffff;">SP</span>
          <span style="width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#ffffff;background:hsl(260,55%,45%);border:2px solid #ffffff;margin-left:-8px;">DP</span>
          <span style="width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#ffffff;background:hsl(45,55%,45%);border:2px solid #ffffff;margin-left:-8px;">+4</span>
        </div>
        <div style="text-align:right;flex-shrink:0;margin-left:8px;">
          <p style="font-weight:600;font-size:14px;margin:0;">₹1,240</p>
        </div>
      </button>
    </div>

  </div>

  <!-- Floating add button -->
  <div style="position:absolute;bottom:88px;right:20px;width:56px;height:56px;border-radius:9999px;background:#059669;display:flex;align-items:center;justify-content:center;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </div>

  <!-- Bottom Navigation (Groups active) -->
  <nav style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-top:1px solid #e7e3d8;padding-bottom:8px;">
    <div style="display:flex;align-items:stretch;justify-content:space-around;">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Home</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Friends</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Activity</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        <span style="font-size:11px;font-weight:500;color:#059669;">Groups</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Profile</span>
      </div>
    </div>
  </nav>

</div>

</body>
</html>
