<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Activity</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Main content -->
  <div style="padding:24px 16px 120px;">

    <!-- Header -->
    <h1 style="font-size:20px;font-weight:600;margin:0 0 16px;">Activity</h1>

    <!-- Search -->
    <div style="position:relative;margin-bottom:16px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:14px;top:15px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" placeholder="Search by name, reason, amount" style="width:100%;box-sizing:border-box;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:13px 16px 13px 40px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
    </div>

    <!-- Filter chips -->
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <span style="padding:6px 16px;border-radius:9999px;font-size:14px;font-weight:500;background:#059669;color:#ffffff;">All</span>
      <span style="padding:6px 16px;border-radius:9999px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Expenses</span>
      <span style="padding:6px 16px;border-radius:9999px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Repayments</span>
    </div>

    <!-- Grouped list -->
    <div style="display:flex;flex-direction:column;gap:20px;">
      <!-- Today -->
      <div>
        <p style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#a8a29e;margin:0 0 8px;">Today</p>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;">
          <button style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px;text-align:left;border:none;background:transparent;border-bottom:1px solid #e7e3d8;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
            <div style="min-width:0;">
              <p style="font-weight:500;margin:0;">Team dinner at Barbeque Nation</p>
              <p style="font-size:12px;color:#a8a29e;margin:2px 0 0;">Jiya Mehta, Arun Kumar · 8:30 PM</p>
            </div>
            <div style="text-align:right;flex-shrink:0;margin-left:12px;">
              <p style="font-weight:600;margin:0;">₹1,600</p>
              <span style="display:inline-block;background:#fef3c7;color:#92400e;border-radius:9999px;padding:2px 8px;font-size:12px;font-weight:500;margin-top:2px;">Pending</span>
            </div>
          </button>
          <button style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px;text-align:left;border:none;background:transparent;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
            <div style="min-width:0;">
              <p style="font-weight:500;margin:0;">Payment received</p>
              <p style="font-size:12px;color:#a8a29e;margin:2px 0 0;">Jiya Mehta · UPI · 5:12 PM</p>
            </div>
            <div style="text-align:right;flex-shrink:0;margin-left:12px;">
              <p style="font-weight:600;color:#059669;margin:0;">+₹1,000</p>
            </div>
          </button>
        </div>
      </div>

      <!-- Yesterday -->
      <div>
        <p style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#a8a29e;margin:0 0 8px;">Yesterday</p>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;">
          <button style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px;text-align:left;border:none;background:transparent;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
            <div style="min-width:0;">
              <p style="font-weight:500;margin:0;">Goa trip stay</p>
              <p style="font-size:12px;color:#a8a29e;margin:2px 0 0;">Jiya Mehta · 1:05 PM</p>
            </div>
            <div style="text-align:right;flex-shrink:0;margin-left:12px;">
              <p style="font-weight:600;margin:0;">₹3,060</p>
              <span style="display:inline-block;background:#dbeafe;color:#1e40af;border-radius:9999px;padding:2px 8px;font-size:12px;font-weight:500;margin-top:2px;">Partial</span>
            </div>
          </button>
        </div>
      </div>

      <!-- This Week -->
      <div>
        <p style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#a8a29e;margin:0 0 8px;">This Week</p>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;">
          <button style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px;text-align:left;border:none;background:transparent;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
            <div style="min-width:0;">
              <p style="font-weight:500;margin:0;">Movie tickets PVR</p>
              <p style="font-size:12px;color:#a8a29e;margin:2px 0 0;">Rhea Lal · 6:45 PM</p>
            </div>
            <div style="text-align:right;flex-shrink:0;margin-left:12px;">
              <p style="font-weight:600;margin:0;">₹720</p>
              <span style="display:inline-block;background:#ecfdf5;color:#047857;border-radius:9999px;padding:2px 8px;font-size:12px;font-weight:500;margin-top:2px;">Settled</span>
            </div>
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom Navigation (Activity active) -->
  <nav style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-top:1px solid #e7e3d8;padding-bottom:8px;">
    <div style="display:flex;align-items:stretch;justify-content:space-around;">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Home</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Friends</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span style="font-size:11px;font-weight:500;color:#059669;">Activity</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Groups</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Profile</span>
      </div>
    </div>
  </nav>

</div>

</body>
</html>
