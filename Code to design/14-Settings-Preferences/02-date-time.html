<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Date &amp; Time Settings</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Sticky header -->
    <header style="position:absolute;top:47px;left:0;right:0;z-index:20;height:56px;display:flex;align-items:center;background:rgba(251,250,247,0.95);border-bottom:1px solid #e7e3d8;padding:0 12px;box-sizing:border-box;">
      <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <h1 style="font-size:18px;font-weight:600;margin:0 0 0 4px;color:#1c1917;">Date &amp; Time</h1>
    </header>

    <!-- Content -->
    <div style="padding:120px 16px 40px;box-sizing:border-box;">
      <!-- Preview card -->
      <div style="border-radius:16px;background:#ffffff;border:1px solid #e7e3d8;padding:20px;margin-bottom:28px;background-image:linear-gradient(135deg,#ecfdf5,#ffffff);">
        <p style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#059669;margin:0 0 12px;">Preview</p>
        <p style="font-size:20px;font-weight:700;color:#1c1917;margin:0;">Wednesday, 12 Aug 2026</p>
        <p style="font-size:24px;line-height:30px;font-weight:800;color:#1c1917;margin:4px 0 0;">2:03 PM</p>
        <div style="border-top:1px solid #e7e3d8;margin-top:16px;padding-top:16px;">
          <p style="font-size:14px;font-weight:600;color:#1c1917;margin:0;">Dinner with Arun</p>
          <p style="font-size:12px;color:#a8a29e;margin:4px 0 0;">12 Aug 2026 · 8:33 PM</p>
        </div>
      </div>

      <!-- Date format -->
      <section style="margin-bottom:28px;">
        <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:#a8a29e;margin:0 0 8px 4px;">Date Format</h2>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;overflow:hidden;">
          <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;border-bottom:1px solid #e7e3d8;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #059669;background:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            <span style="flex:1;">
              <span style="display:block;font-size:15px;font-weight:600;color:#1c1917;">12 Aug 2026</span>
              <span style="display:block;font-size:12px;color:#a8a29e;margin-top:4px;">DD MMM YYYY · Recommended</span>
            </span>
          </button>
          <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;border-bottom:1px solid #e7e3d8;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
            <span style="flex:1;">
              <span style="display:block;font-size:15px;font-weight:600;color:#1c1917;">12/08/2026</span>
              <span style="display:block;font-size:12px;color:#a8a29e;margin-top:4px;">DD/MM/YYYY · Numeric Day First</span>
            </span>
          </button>
          <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;border-bottom:1px solid #e7e3d8;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
            <span style="flex:1;">
              <span style="display:block;font-size:15px;font-weight:600;color:#1c1917;">08/12/2026</span>
              <span style="display:block;font-size:12px;color:#a8a29e;margin-top:4px;">MM/DD/YYYY · Numeric Month First</span>
            </span>
          </button>
          <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;border-bottom:1px solid #e7e3d8;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
            <span style="flex:1;">
              <span style="display:block;font-size:15px;font-weight:600;color:#1c1917;">2026-08-12</span>
              <span style="display:block;font-size:12px;color:#a8a29e;margin-top:4px;">YYYY-MM-DD · ISO</span>
            </span>
          </button>
          <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
            <span style="flex:1;">
              <span style="display:block;font-size:15px;font-weight:600;color:#1c1917;">12 Aug 26</span>
              <span style="display:block;font-size:12px;color:#a8a29e;margin-top:4px;">DD MMM YY · Short</span>
            </span>
          </button>
        </div>
      </section>

      <!-- Time format -->
      <section style="margin-bottom:28px;">
        <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:#a8a29e;margin:0 0 8px 4px;">Time Format</h2>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;overflow:hidden;">
          <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;border-bottom:1px solid #e7e3d8;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #059669;background:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            <span style="flex:1;">
              <span style="display:block;font-size:15px;font-weight:600;color:#1c1917;">12-hour</span>
              <span style="display:block;font-size:12px;color:#a8a29e;margin-top:4px;">2:03 PM</span>
            </span>
          </button>
          <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
            <span style="flex:1;">
              <span style="display:block;font-size:15px;font-weight:600;color:#1c1917;">24-hour</span>
              <span style="display:block;font-size:12px;color:#a8a29e;margin-top:4px;">14:03</span>
            </span>
          </button>
        </div>
      </section>

      <!-- First day of week -->
      <section style="margin-bottom:28px;">
        <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:#a8a29e;margin:0 0 8px 4px;">First Day of Week</h2>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;overflow:hidden;">
          <button style="width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;border-bottom:1px solid #e7e3d8;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #059669;background:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            <span style="flex:1;font-size:15px;font-weight:600;color:#1c1917;">Automatic</span>
          </button>
          <button style="width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;border-bottom:1px solid #e7e3d8;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
            <span style="flex:1;font-size:15px;font-weight:600;color:#1c1917;">Monday</span>
          </button>
          <button style="width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
            <span style="flex:1;font-size:15px;font-weight:600;color:#1c1917;">Sunday</span>
          </button>
        </div>
      </section>

      <!-- Time zone -->
      <section style="margin-bottom:28px;">
        <h2 style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:#a8a29e;margin:0 0 8px 4px;">Time Zone</h2>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;overflow:hidden;">
          <button style="width:100%;min-height:72px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:none;text-align:left;box-sizing:border-box;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span style="flex:1;">
              <span style="display:block;font-size:15px;font-weight:600;color:#1c1917;">Automatic</span>
              <span style="display:block;font-size:12px;color:#a8a29e;margin-top:4px;">Asia/Kolkata (GMT+5:30)</span>
            </span>
          </button>
        </div>
      </section>

      <p style="font-size:12px;line-height:20px;color:#a8a29e;margin:0 4px;">Transaction moments are stored in UTC. Changing your time zone updates their display, not when they happened.</p>
    </div>
  </div>
</body>
</html>
