<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Appearance Settings</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Sticky header -->
    <header style="position:absolute;top:47px;left:0;right:0;z-index:20;height:56px;display:flex;align-items:center;background:rgba(251,250,247,0.95);border-bottom:1px solid #e7e3d8;padding:0 12px;box-sizing:border-box;">
      <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <h1 style="font-size:18px;font-weight:600;margin:0 0 0 4px;color:#1c1917;">Appearance</h1>
    </header>

    <!-- Content -->
    <div style="padding:120px 16px 40px;box-sizing:border-box;">
      <p style="font-size:14px;line-height:24px;color:#57534e;margin:0 0 20px;">Choose how Tab looks on this device.</p>

      <div style="display:grid;gap:12px;">
        <!-- System Default -->
        <button style="position:relative;min-height:128px;border-radius:16px;border:2px solid #059669;background:#ecfdf5;padding:16px;text-align:left;overflow:hidden;box-sizing:border-box;width:100%;">
          <span style="display:flex;align-items:flex-start;justify-content:space-between;">
            <span style="width:40px;height:40px;border-radius:12px;background:#f4f2ec;display:flex;align-items:center;justify-content:center;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
            </span>
            <span style="width:24px;height:24px;border-radius:12px;background:#059669;display:flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          </span>
          <p style="font-size:16px;font-weight:700;color:#1c1917;margin:16px 0 0;">System Default</p>
          <p style="font-size:12px;color:#a8a29e;margin:4px 0 0;">Follow your device setting</p>
        </button>

        <!-- Light -->
        <button style="position:relative;min-height:128px;border-radius:16px;border:2px solid #e7e3d8;background:#ffffff;padding:16px;text-align:left;overflow:hidden;box-sizing:border-box;width:100%;">
          <span style="display:flex;align-items:flex-start;justify-content:space-between;">
            <span style="width:40px;height:40px;border-radius:12px;background:#f4f2ec;display:flex;align-items:center;justify-content:center;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </span>
          </span>
          <p style="font-size:16px;font-weight:700;color:#1c1917;margin:16px 0 0;">Light</p>
          <p style="font-size:12px;color:#a8a29e;margin:4px 0 0;">Always use light theme</p>
        </button>

        <!-- Dark -->
        <button style="position:relative;min-height:128px;border-radius:16px;border:2px solid #e7e3d8;background:#ffffff;padding:16px;text-align:left;overflow:hidden;box-sizing:border-box;width:100%;">
          <span style="display:flex;align-items:flex-start;justify-content:space-between;">
            <span style="width:40px;height:40px;border-radius:12px;background:#f4f2ec;display:flex;align-items:center;justify-content:center;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </span>
          </span>
          <p style="font-size:16px;font-weight:700;color:#1c1917;margin:16px 0 0;">Dark</p>
          <p style="font-size:12px;color:#a8a29e;margin:4px 0 0;">Always use dark theme</p>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
