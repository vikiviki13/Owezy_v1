<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Onboarding — You pay.</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:40px 24px 40px;box-sizing:border-box;">

  <!-- Skip -->
  <div style="display:flex;justify-content:flex-end;">
    <span style="font-size:14px;font-weight:500;color:#a8a29e;">Skip</span>
  </div>

  <!-- Slide content -->
  <div style="display:flex;flex-direction:column;align-items:center;text-align:center;max-width:384px;margin:0 auto;width:100%;">
    <!-- Illustration -->
    <div style="position:relative;width:100%;height:320px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <!-- Background glow -->
      <div style="position:absolute;top:-40px;left:45px;width:300px;height:300px;border-radius:9999px;background:#ecfdf5;opacity:0.5;"></div>

      <!-- Background blob -->
      <div style="position:absolute;top:50%;left:50%;margin-left:-115px;margin-top:-115px;width:230px;height:230px;border-radius:9999px;background:#ecfdf5;"></div>

      <!-- Dotted ring -->
      <svg width="280" height="280" viewBox="0 0 280 280" style="position:absolute;top:50%;left:50%;margin-left:-140px;margin-top:-140px;">
        <circle cx="140" cy="140" r="128" fill="none" stroke="#d1fae5" stroke-width="1.5" stroke-dasharray="2 8" stroke-linecap="round"/>
      </svg>

      <!-- Floating dollar coin top left -->
      <div style="position:absolute;top:20px;left:28px;width:48px;height:48px;background:#ffffff;border:1px solid #e7e3d8;border-radius:9999px;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:20px;font-weight:800;color:#059669;">$</span>
      </div>

      <!-- Floating checkmark badge top right -->
      <div style="position:absolute;top:32px;right:24px;width:40px;height:40px;background:#059669;border-radius:9999px;display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>

      <!-- Paid chip bottom left -->
      <div style="position:absolute;bottom:36px;left:22px;">
        <div style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:6px;">
          <div style="width:6px;height:6px;background:#059669;border-radius:9999px;"></div>
          <span style="font-size:11px;font-weight:600;color:#059669;">Paid</span>
        </div>
      </div>

      <!-- Accent dots -->
      <div style="position:absolute;bottom:60px;right:28px;width:9px;height:36px;background:#a7f3d0;border-radius:9999px;"></div>
      <div style="position:absolute;top:100px;left:44px;width:5px;height:5px;background:#e7e3d8;border-radius:9999px;"></div>

      <!-- Payment card behind -->
      <div style="position:absolute;width:154px;height:98px;border-radius:16px;left:170px;top:170px;background:#059669;box-sizing:border-box;">
        <div style="padding:14px;">
          <div style="width:26px;height:18px;background:rgba(255,255,255,0.25);border-radius:2px;margin-bottom:16px;"></div>
          <div style="height:5px;width:64px;background:rgba(255,255,255,0.4);border-radius:3px;margin-bottom:5px;"></div>
          <div style="height:5px;width:44px;background:rgba(255,255,255,0.25);border-radius:3px;"></div>
        </div>
        <div style="position:absolute;top:0;right:0;width:60px;height:100%;border-radius:0 16px 16px 0;background:rgba(255,255,255,0.08);"></div>
      </div>

      <!-- Receipt card main -->
      <div style="position:relative;width:182px;height:226px;background:#ffffff;border:1px solid #e7e3d8;border-radius:20px;z-index:2;padding:16px;box-sizing:border-box;">
        <!-- Receipt header -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <div style="display:flex;align-items:center;gap:6px;">
            <div style="width:28px;height:28px;background:#ecfdf5;border-radius:9px;display:flex;align-items:center;justify-content:center;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
            </div>
            <span style="font-size:10.5px;font-weight:600;color:#a8a29e;">Receipt</span>
          </div>
          <div style="background:#ecfdf5;border:1px solid #d1fae5;border-radius:6px;padding:2px 8px;">
            <span style="font-size:9px;font-weight:600;color:#059669;">Dinner</span>
          </div>
        </div>

        <!-- Line items -->
        <div style="margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <div style="display:flex;align-items:center;gap:6px;">
              <div style="width:5px;height:5px;background:#a7f3d0;border-radius:9999px;"></div>
              <div style="height:5px;width:56px;background:#e7e3d8;border-radius:3px;"></div>
            </div>
            <span style="font-size:10.5px;font-weight:600;color:#1c1917;">$22.00</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <div style="display:flex;align-items:center;gap:6px;">
              <div style="width:5px;height:5px;background:#a7f3d0;border-radius:9999px;"></div>
              <div style="height:5px;width:44px;background:#e7e3d8;border-radius:3px;"></div>
            </div>
            <span style="font-size:10.5px;font-weight:600;color:#1c1917;">$36.00</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="display:flex;align-items:center;gap:6px;">
              <div style="width:5px;height:5px;background:#a7f3d0;border-radius:9999px;"></div>
              <div style="height:5px;width:50px;background:#e7e3d8;border-radius:3px;"></div>
            </div>
            <span style="font-size:10.5px;font-weight:600;color:#1c1917;">$26.20</span>
          </div>
        </div>

        <!-- Split avatars row -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <span style="font-size:9.5px;color:#a8a29e;font-weight:500;">Split with</span>
          <div style="display:flex;">
            <div style="width:20px;height:20px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;border:2px solid #ffffff;background:#ddd6fe;color:#5b21b6;">A</div>
            <div style="width:20px;height:20px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;border:2px solid #ffffff;background:#fde68a;color:#92400e;margin-left:-6px;">J</div>
            <div style="width:20px;height:20px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;border:2px solid #ffffff;background:#fecaca;color:#991b1b;margin-left:-6px;">R</div>
          </div>
        </div>

        <!-- Dashed divider -->
        <div style="border-top:1px dashed #e7e3d8;margin-bottom:12px;"></div>

        <!-- Total row -->
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:10px;color:#a8a29e;font-weight:500;">Total paid</span>
          <span style="font-size:15px;color:#1c1917;font-weight:700;">$84.20</span>
        </div>
      </div>
    </div>

    <!-- Title + body -->
    <h1 style="font-size:24px;font-weight:700;margin:0 0 8px;">You pay.</h1>
    <p style="color:#57534e;font-size:15px;line-height:1.5;margin:0;">Cover the bill at dinner, on a trip, wherever — record it in seconds.</p>
  </div>

  <!-- Bottom controls -->
  <div style="width:100%;">
    <!-- Page dots -->
    <div style="display:flex;justify-content:center;gap:6px;margin-bottom:24px;">
      <div style="height:6px;width:24px;border-radius:9999px;background:#059669;"></div>
      <div style="height:6px;width:6px;border-radius:9999px;background:#e7e3d8;"></div>
      <div style="height:6px;width:6px;border-radius:9999px;background:#e7e3d8;"></div>
    </div>
    <!-- Next button -->
    <button style="width:100%;max-width:342px;margin:0 auto;display:block;background:#059669;color:#ffffff;font-size:16px;font-weight:500;border:none;border-radius:12px;padding:14px 0;font-family:'Inter',Arial,sans-serif;">Next</button>
  </div>

</div>

</body>
</html>
