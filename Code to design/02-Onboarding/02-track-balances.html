<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Onboarding — Track what friends owe you.</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:40px 24px 40px;box-sizing:border-box;">

  <!-- Skip -->
  <div style="display:flex;justify-content:flex-end;">
    <span style="font-size:14px;font-weight:500;color:#a8a29e;">Skip</span>
  </div>

  <!-- Slide content -->
  <div style="display:flex;flex-direction:column;align-items:center;text-align:center;max-width:384px;margin:0 auto;width:100%;">
    <!-- Illustration -->
    <div style="position:relative;width:100%;height:320px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <!-- Background blob -->
      <div style="position:absolute;top:50%;left:50%;margin-left:-115px;margin-top:-115px;width:230px;height:230px;border-radius:9999px;background:#ecfdf5;"></div>

      <!-- Dotted ring -->
      <svg width="280" height="280" viewBox="0 0 280 280" style="position:absolute;top:50%;left:50%;margin-left:-140px;margin-top:-140px;">
        <circle cx="140" cy="140" r="128" fill="none" stroke="#d1fae5" stroke-width="1.5" stroke-dasharray="2 8" stroke-linecap="round"/>
      </svg>

      <!-- Floating avatar JM top left -->
      <div style="position:absolute;top:18px;left:24px;">
        <div style="position:relative;">
          <div style="width:48px;height:48px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;border:3px solid #ffffff;background:#fde68a;color:#92400e;">JM</div>
          <div style="position:absolute;bottom:1px;right:1px;width:11px;height:11px;background:#059669;border-radius:9999px;border:2.5px solid #fbfaf7;"></div>
        </div>
      </div>

      <!-- Floating avatar AK top right -->
      <div style="position:absolute;top:28px;right:20px;">
        <div style="position:relative;">
          <div style="width:42px;height:42px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:3px solid #ffffff;background:#ddd6fe;color:#5b21b6;">AK</div>
          <div style="position:absolute;bottom:1px;right:1px;width:10px;height:10px;background:#059669;border-radius:9999px;border:2.5px solid #fbfaf7;"></div>
        </div>
      </div>

      <!-- Owes you chip bottom right -->
      <div style="position:absolute;bottom:30px;right:20px;">
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:7px 10px;display:flex;align-items:center;gap:6px;">
          <div style="width:7px;height:7px;background:#059669;border-radius:9999px;"></div>
          <span style="font-size:11px;font-weight:600;color:#059669;">+$32 owed</span>
        </div>
      </div>

      <!-- Accent dots -->
      <div style="position:absolute;bottom:56px;left:26px;width:9px;height:9px;background:#a7f3d0;border-radius:9999px;"></div>
      <div style="position:absolute;top:104px;left:42px;width:5px;height:5px;background:#e7e3d8;border-radius:9999px;"></div>

      <!-- Mini contact card behind -->
      <div style="position:absolute;width:144px;height:88px;background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;left:168px;top:176px;padding:14px;box-sizing:border-box;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <div style="width:22px;height:22px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;background:#fecaca;color:#991b1b;">RL</div>
          <div style="height:6px;width:52px;background:#e7e3d8;border-radius:3px;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="height:5px;width:40px;background:#f4f2ec;border-radius:3px;"></div>
          <span style="font-size:11px;font-weight:700;color:#059669;">+$18</span>
        </div>
      </div>

      <!-- Main balance list card -->
      <div style="position:relative;width:186px;height:232px;background:#ffffff;border:1px solid #e7e3d8;border-radius:20px;z-index:2;padding:16px;box-sizing:border-box;">
        <!-- Header -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <div style="display:flex;align-items:center;gap:6px;">
            <div style="width:28px;height:28px;background:#ecfdf5;border-radius:9px;display:flex;align-items:center;justify-content:center;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <span style="font-size:10.5px;font-weight:600;color:#57534e;">Balances</span>
          </div>
          <div style="background:#ecfdf5;border:1px solid #d1fae5;border-radius:6px;padding:2px 8px;">
            <span style="font-size:9px;font-weight:600;color:#059669;">3 friends</span>
          </div>
        </div>

        <!-- Friend row JM -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #f4f2ec;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="position:relative;">
              <div style="width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:#fde68a;color:#92400e;">JM</div>
              <div style="position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;background:#059669;border-radius:9999px;border:2px solid #ffffff;"></div>
            </div>
            <div>
              <div style="height:6px;width:48px;background:#e7e3d8;border-radius:3px;margin-bottom:4px;"></div>
              <div style="height:4px;width:32px;background:#f4f2ec;border-radius:3px;"></div>
            </div>
          </div>
          <span style="font-size:12px;font-weight:700;color:#059669;">+$32</span>
        </div>

        <!-- Friend row AK -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #f4f2ec;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="position:relative;">
              <div style="width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:#ddd6fe;color:#5b21b6;">AK</div>
              <div style="position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;background:#059669;border-radius:9999px;border:2px solid #ffffff;"></div>
            </div>
            <div>
              <div style="height:6px;width:40px;background:#e7e3d8;border-radius:3px;margin-bottom:4px;"></div>
              <div style="height:4px;width:28px;background:#f4f2ec;border-radius:3px;"></div>
            </div>
          </div>
          <span style="font-size:12px;font-weight:700;color:#059669;">+$18</span>
        </div>

        <!-- Friend row RL -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:#fecaca;color:#991b1b;">RL</div>
            <div>
              <div style="height:6px;width:44px;background:#e7e3d8;border-radius:3px;margin-bottom:4px;"></div>
              <div style="height:4px;width:30px;background:#f4f2ec;border-radius:3px;"></div>
            </div>
          </div>
          <span style="font-size:12px;font-weight:700;color:#059669;">+$14</span>
        </div>

        <!-- Dashed divider -->
        <div style="border-top:1px dashed #e7e3d8;margin-bottom:10px;"></div>

        <!-- Total -->
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:10px;color:#a8a29e;font-weight:500;">You're owed</span>
          <span style="font-size:15px;color:#059669;font-weight:700;">$64.00</span>
        </div>
      </div>
    </div>

    <!-- Title + body -->
    <h1 style="font-size:24px;font-weight:700;margin:0 0 8px;">Track what friends owe you.</h1>
    <p style="color:#57534e;font-size:15px;line-height:1.5;margin:0;">Every friend has a running balance, calculated automatically.</p>
  </div>

  <!-- Bottom controls -->
  <div style="width:100%;">
    <!-- Page dots -->
    <div style="display:flex;justify-content:center;gap:6px;margin-bottom:24px;">
      <div style="height:6px;width:6px;border-radius:9999px;background:#e7e3d8;"></div>
      <div style="height:6px;width:24px;border-radius:9999px;background:#059669;"></div>
      <div style="height:6px;width:6px;border-radius:9999px;background:#e7e3d8;"></div>
    </div>
    <!-- Next button -->
    <button style="width:100%;max-width:342px;margin:0 auto;display:block;background:#059669;color:#ffffff;font-size:16px;font-weight:500;border:none;border-radius:12px;padding:14px 0;font-family:'Inter',Arial,sans-serif;">Next</button>
  </div>

</div>

</body>
</html>
