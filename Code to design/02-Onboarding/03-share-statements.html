<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Onboarding — Record repayments &amp; share statements.</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:40px 24px 40px;box-sizing:border-box;">

  <!-- Skip -->
  <div style="display:flex;justify-content:flex-end;">
    <span style="font-size:14px;font-weight:500;color:#a8a29e;">Skip</span>
  </div>

  <!-- Slide content -->
  <div style="display:flex;flex-direction:column;align-items:center;text-align:center;max-width:384px;margin:0 auto;width:100%;">
    <!-- Illustration -->
    <div style="position:relative;width:100%;height:320px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <!-- Background blob -->
      <div style="position:absolute;top:50%;left:50%;margin-left:-115px;margin-top:-115px;width:230px;height:230px;border-radius:9999px;background:#ecfdf5;"></div>

      <!-- Dotted ring -->
      <svg width="280" height="280" viewBox="0 0 280 280" style="position:absolute;top:50%;left:50%;margin-left:-140px;margin-top:-140px;">
        <circle cx="140" cy="140" r="128" fill="none" stroke="#d1fae5" stroke-width="1.5" stroke-dasharray="2 8" stroke-linecap="round"/>
      </svg>

      <!-- Floating WhatsApp badge top left -->
      <div style="position:absolute;top:16px;left:24px;width:48px;height:48px;border-radius:9999px;display:flex;align-items:center;justify-content:center;background:#25d366;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#ffffff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.126.556 4.12 1.528 5.847L.057 23.5a.5.5 0 0 0 .611.63l5.79-1.517A11.94 11.94 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.848 0-3.58-.504-5.064-1.382l-.363-.214-3.761.986.999-3.648-.236-.374A9.956 9.956 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
      </div>

      <!-- Sent reply bubble top right -->
      <div style="position:absolute;top:22px;right:18px;">
        <div style="background:#dcfce7;border:1px solid #a7f3d0;border-radius:14px 14px 4px 14px;padding:9px 12px;">
          <div style="display:flex;align-items:center;gap:5px;">
            <div style="width:16px;height:16px;background:#059669;border-radius:9999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <span style="font-size:11px;font-weight:700;color:#059669;">Paid!</span>
          </div>
        </div>
      </div>

      <!-- Shared chip bottom left -->
      <div style="position:absolute;bottom:28px;left:18px;">
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:7px 10px;display:flex;align-items:center;gap:6px;">
          <div style="width:20px;height:20px;background:#059669;border-radius:6px;display:flex;align-items:center;justify-content:center;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </div>
          <span style="font-size:11px;font-weight:600;color:#1c1917;">Shared</span>
        </div>
      </div>

      <!-- Accent dots -->
      <div style="position:absolute;bottom:56px;right:28px;width:9px;height:9px;background:#a7f3d0;border-radius:9999px;"></div>
      <div style="position:absolute;top:108px;left:42px;width:5px;height:5px;background:#e7e3d8;border-radius:9999px;"></div>

      <!-- WhatsApp chat card behind -->
      <div style="position:absolute;width:148px;height:96px;background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;left:170px;top:174px;padding:14px;box-sizing:border-box;">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:10px;">
          <div style="width:20px;height:20px;border-radius:9999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#25d366;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="#ffffff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/></svg>
          </div>
          <span style="font-size:10px;font-weight:600;color:#1c1917;">Alex K.</span>
        </div>
        <div style="background:#dcfce7;border-radius:8px 8px 8px 2px;padding:8px 9px;">
          <div style="height:5px;width:82px;background:#a7f3d0;border-radius:3px;margin-bottom:4px;"></div>
          <div style="height:5px;width:60px;background:#a7f3d0;border-radius:3px;"></div>
        </div>
      </div>

      <!-- Main statement card -->
      <div style="position:relative;width:186px;height:232px;background:#ffffff;border:1px solid #e7e3d8;border-radius:20px;z-index:2;padding:16px;box-sizing:border-box;">
        <!-- Header -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <div style="display:flex;align-items:center;gap:6px;">
            <div style="width:28px;height:28px;background:#ecfdf5;border-radius:9px;display:flex;align-items:center;justify-content:center;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <span style="font-size:10.5px;font-weight:600;color:#57534e;">Statement</span>
          </div>
          <div style="background:#ecfdf5;border:1px solid #d1fae5;border-radius:6px;padding:2px 8px;">
            <span style="font-size:9px;font-weight:600;color:#059669;">July</span>
          </div>
        </div>

        <!-- Friend row -->
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:11px;border-bottom:1px solid #f4f2ec;">
          <div style="width:28px;height:28px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;background:#ddd6fe;color:#5b21b6;">AK</div>
          <div style="flex:1;">
            <div style="height:6px;width:52px;background:#e7e3d8;border-radius:3px;margin-bottom:4px;"></div>
            <div style="height:4px;width:36px;background:#f4f2ec;border-radius:3px;"></div>
          </div>
          <div style="width:8px;height:8px;background:#a7f3d0;border-radius:9999px;"></div>
        </div>

        <!-- Transaction rows -->
        <div style="margin-bottom:10px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;">
            <div style="display:flex;align-items:center;gap:6px;">
              <div style="width:5px;height:5px;border-radius:9999px;background:#a7f3d0;"></div>
              <div style="height:5px;width:54px;background:#e7e3d8;border-radius:3px;"></div>
            </div>
            <span style="font-size:10.5px;font-weight:600;color:#1c1917;">$24.00</span>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;">
            <div style="display:flex;align-items:center;gap:6px;">
              <div style="width:5px;height:5px;border-radius:9999px;background:#a7f3d0;"></div>
              <div style="height:5px;width:42px;background:#e7e3d8;border-radius:3px;"></div>
            </div>
            <span style="font-size:10.5px;font-weight:600;color:#1c1917;">$18.50</span>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div style="display:flex;align-items:center;gap:6px;">
              <div style="width:5px;height:5px;border-radius:9999px;background:#fca5a5;"></div>
              <div style="height:5px;width:48px;background:#e7e3d8;border-radius:3px;"></div>
            </div>
            <span style="font-size:10.5px;font-weight:600;color:#dc2626;">-$10.00</span>
          </div>
        </div>

        <!-- Dashed divider -->
        <div style="border-top:1px dashed #e7e3d8;margin-bottom:10px;"></div>

        <!-- Total + send -->
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div style="font-size:9px;color:#a8a29e;font-weight:500;margin-bottom:2px;">Owes you</div>
            <span style="font-size:15px;color:#059669;font-weight:700;">$32.50</span>
          </div>
          <div style="background:#059669;border-radius:10px;padding:7px 10px;display:flex;align-items:center;gap:5px;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            <span style="font-size:10px;font-weight:600;color:#ffffff;">Send</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Title + body -->
    <h1 style="font-size:24px;font-weight:700;margin:0 0 8px;line-height:1.25;">Record repayments &amp; share statements.</h1>
    <p style="color:#57534e;font-size:15px;line-height:1.5;margin:0;">Send a clean summary over WhatsApp whenever you like.</p>
  </div>

  <!-- Bottom controls -->
  <div style="width:100%;">
    <!-- Page dots -->
    <div style="display:flex;justify-content:center;gap:6px;margin-bottom:24px;">
      <div style="height:6px;width:6px;border-radius:9999px;background:#e7e3d8;"></div>
      <div style="height:6px;width:6px;border-radius:9999px;background:#e7e3d8;"></div>
      <div style="height:6px;width:24px;border-radius:9999px;background:#059669;"></div>
    </div>
    <!-- Let's go button -->
    <button style="width:100%;max-width:342px;margin:0 auto;display:block;background:#059669;color:#ffffff;font-size:16px;font-weight:500;border:none;border-radius:12px;padding:14px 0;font-family:'Inter',Arial,sans-serif;">Let's go</button>
  </div>

</div>

</body>
</html>
