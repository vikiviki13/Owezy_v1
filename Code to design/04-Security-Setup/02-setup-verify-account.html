<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Security Setup - Verify Account</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:47px 20px 28px;box-sizing:border-box;">
    <!-- Flow header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
      <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.68px;color:#a8a29e;">Security Setup</span>
      <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;">
      <form style="background:#ffffff;border:1px solid #e7e3d8;border-radius:24px;padding:20px;display:block;">
        <div style="text-align:center;">
          <div style="width:64px;height:64px;border-radius:16px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;margin:0 auto;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
          </div>
          <h1 style="font-size:24px;font-weight:700;margin:20px 0 0;color:#1c1917;">Verify Your Account</h1>
          <p style="font-size:14px;line-height:24px;color:#57534e;margin:8px 0 0;">Enter your current account password before adding unlock methods. This proof is valid only for this setup and expires after five minutes.</p>
        </div>

        <label style="display:block;margin-top:24px;">
          <span style="display:block;font-size:14px;font-weight:600;color:#1c1917;">Account password</span>
          <input type="password" placeholder="Enter your account password" style="width:100%;min-height:48px;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;margin-top:8px;">
        </label>

        <button type="submit" style="margin-top:20px;width:100%;min-height:56px;border:none;border-radius:16px;background:#059669;color:#ffffff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;">
          Verify and Continue
        </button>
      </form>
    </div>
  </div>
</body>
</html>
