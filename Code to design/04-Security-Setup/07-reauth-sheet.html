<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Verify It's You - Reauthentication</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Dimmed underlying screen -->
    <div style="position:absolute;inset:0;background:#fbfaf7;">
      <div style="padding:47px 16px 0;">
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:24px;padding:20px;height:220px;"></div>
      </div>
    </div>

    <!-- Scrim -->
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45);"></div>

    <!-- Bottom sheet -->
    <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:28px 28px 0 0;padding:20px 20px 32px;box-sizing:border-box;">
      <!-- Header -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
        <span style="width:44px;height:44px;border-radius:14px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
        </span>
        <div style="flex:1;min-width:0;">
          <h2 style="font-size:16px;font-weight:700;margin:0;color:#1c1917;">Verify it's you</h2>
          <p style="font-size:12px;color:#a8a29e;margin:2px 0 0;">Required to turn off App Lock.</p>
        </div>
        <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <!-- Device security option -->
      <button style="width:100%;min-height:56px;border:none;border-radius:16px;background:#059669;color:#ffffff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
        Use Device Security
      </button>

      <!-- PIN option -->
      <button style="width:100%;min-height:48px;background:none;border:none;font-size:14px;font-weight:600;color:#059669;margin-top:8px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:8px;"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
        Use App PIN
      </button>
    </div>
  </div>
</body>
</html>
