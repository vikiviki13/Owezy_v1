<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Security Setup - Auto Lock</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:47px 20px 28px;box-sizing:border-box;">
    <!-- Flow header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
      <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.68px;color:#a8a29e;">Security Setup</span>
      <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;">
      <section>
        <!-- Heading -->
        <div style="text-align:center;">
          <div style="width:64px;height:64px;border-radius:16px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;margin:0 auto;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="15" r="1"/></svg>
          </div>
          <h1 style="font-size:24px;font-weight:700;margin:20px 0 0;color:#1c1917;">Automatically Lock</h1>
          <p style="font-size:14px;color:#57534e;margin:8px 0 0;">Choose how quickly Tab locks when you stop using it.</p>
        </div>

        <!-- Options -->
        <div style="margin-top:24px;background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;overflow:hidden;">
          <button style="width:100%;min-height:56px;border:none;background:none;border-bottom:1px solid #e7e3d8;padding:12px 16px;display:flex;align-items:center;gap:12px;text-align:left;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #e7e3d8;box-sizing:border-box;"></span>
            <span style="flex:1;font-size:14px;font-weight:500;color:#1c1917;">Immediately</span>
          </button>
          <button style="width:100%;min-height:56px;border:none;background:none;border-bottom:1px solid #e7e3d8;padding:12px 16px;display:flex;align-items:center;gap:12px;text-align:left;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #e7e3d8;box-sizing:border-box;"></span>
            <span style="flex:1;font-size:14px;font-weight:500;color:#1c1917;">After 1 minute</span>
          </button>
          <button style="width:100%;min-height:56px;border:none;background:none;border-bottom:1px solid #e7e3d8;padding:12px 16px;display:flex;align-items:center;gap:12px;text-align:left;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #059669;background:#059669;display:flex;align-items:center;justify-content:center;box-sizing:border-box;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            <span style="flex:1;font-size:14px;font-weight:500;color:#1c1917;">After 5 minutes</span>
            <span style="font-size:12px;font-weight:600;color:#059669;">Recommended</span>
          </button>
          <button style="width:100%;min-height:56px;border:none;background:none;border-bottom:1px solid #e7e3d8;padding:12px 16px;display:flex;align-items:center;gap:12px;text-align:left;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #e7e3d8;box-sizing:border-box;"></span>
            <span style="flex:1;font-size:14px;font-weight:500;color:#1c1917;">After 15 minutes</span>
          </button>
          <button style="width:100%;min-height:56px;border:none;background:none;padding:12px 16px;display:flex;align-items:center;gap:12px;text-align:left;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:10px;border:2px solid #e7e3d8;box-sizing:border-box;"></span>
            <span style="flex:1;font-size:14px;font-weight:500;color:#1c1917;">After 30 minutes</span>
          </button>
        </div>

        <button style="margin-top:28px;width:100%;min-height:56px;border:none;border-radius:16px;background:#059669;color:#ffffff;font-size:16px;font-weight:600;">Turn On App Lock</button>
      </section>
    </div>
  </div>
</body>
</html>
