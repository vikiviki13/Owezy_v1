<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Record Repayment — Form</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <div style="padding:24px 16px 32px;box-sizing:border-box;">

    <!-- Header -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <button style="width:36px;height:36px;border-radius:9999px;background:#ffffff;border:1px solid #e7e3d8;display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div style="width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#ffffff;background:hsl(160,55%,45%);">JM</div>
      <div>
        <h1 style="font-size:16px;font-weight:600;margin:0;">Jiya Mehta</h1>
        <p style="font-size:12px;color:#a8a29e;margin:2px 0 0;">Owes you ₹2,400</p>
      </div>
    </div>

    <!-- Direction toggle -->
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <span style="flex:1;border-radius:12px;padding:8px 0;font-size:14px;font-weight:500;text-align:center;background:#059669;color:#ffffff;">Received from friend</span>
      <span style="flex:1;border-radius:12px;padding:8px 0;font-size:14px;font-weight:500;text-align:center;background:#f4f2ec;color:#57534e;">Paid to friend</span>
    </div>

    <!-- Amount -->
    <p style="font-size:14px;color:#57534e;margin:0 0 8px;">Amount received</p>
    <div style="display:flex;align-items:center;gap:4px;margin-bottom:8px;">
      <span style="font-size:30px;font-weight:700;color:#a8a29e;">₹</span>
      <span style="font-size:36px;font-weight:800;">1,000</span>
    </div>
    <!-- Mark full amount link -->
    <button style="border:none;background:transparent;padding:0;font-size:12px;font-weight:500;color:#059669;font-family:'Inter',Arial,sans-serif;margin-bottom:16px;">Mark full amount (₹2,400)</button>

    <!-- Payment method -->
    <p style="font-size:14px;font-weight:500;color:#57534e;margin:0 0 8px;">Payment method</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;">
      <span style="padding:8px 14px;border-radius:12px;font-size:14px;font-weight:500;background:#059669;color:#ffffff;">UPI</span>
      <span style="padding:8px 14px;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Cash</span>
      <span style="padding:8px 14px;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Bank Transfer</span>
      <span style="padding:8px 14px;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Card</span>
      <span style="padding:8px 14px;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Other</span>
    </div>

    <!-- Apply to -->
    <p style="font-size:14px;font-weight:500;color:#57534e;margin:0 0 8px;">Apply to</p>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <span style="flex:1;padding:8px 0;border-radius:12px;font-size:14px;font-weight:500;text-align:center;background:#059669;color:#ffffff;">General repayment</span>
      <span style="flex:1;padding:8px 0;border-radius:12px;font-size:14px;font-weight:500;text-align:center;background:#f4f2ec;color:#57534e;">Specific expense</span>
    </div>

    <!-- Specific expense list -->
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">
      <button style="display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:12px;text-align:left;width:100%;box-sizing:border-box;border:none;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;border-left:none;">
        <span style="font-weight:500;font-size:14px;">Team dinner at Barbeque Nation</span>
        <span style="display:flex;align-items:center;gap:8px;font-size:14px;">₹420 pending
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
      </button>
      <button style="display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:12px;text-align:left;width:100%;box-sizing:border-box;border:1px solid #e7e3d8;background:#ffffff;font-family:'Inter',Arial,sans-serif;">
        <span style="font-weight:500;font-size:14px;">Goa trip stay</span>
        <span style="display:flex;align-items:center;gap:8px;font-size:14px;">₹760 pending</span>
      </button>
    </div>

    <!-- Reference + notes -->
    <input type="text" placeholder="Transaction reference (optional)" value="UPI/334512908" style="margin-bottom:12px;box-sizing:border-box;width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
    <textarea rows="2" placeholder="Notes (optional)" style="box-sizing:border-box;width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;resize:none;margin-bottom:24px;"></textarea>

    <!-- Save button -->
    <button style="width:100%;background:#059669;color:#ffffff;font-size:15px;font-weight:500;border:none;border-radius:12px;padding:14px 0;font-family:'Inter',Arial,sans-serif;">Record Repayment</button>

  </div>
</div>

</body>
</html>
