<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Record Repayment — Friend Picker</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <div style="padding:24px 16px 32px;box-sizing:border-box;">

    <!-- Header -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <button style="width:36px;height:36px;border-radius:9999px;background:#ffffff;border:1px solid #e7e3d8;display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <h1 style="font-size:18px;font-weight:600;margin:0;">Record Repayment</h1>
    </div>

    <!-- Question -->
    <p style="font-size:14px;color:#57534e;margin:0 0 12px;">Who paid you back?</p>

    <!-- Friend picker list -->
    <div style="display:flex;flex-direction:column;gap:4px;">
      <button style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;text-align:left;width:100%;box-sizing:border-box;border:none;background:transparent;font-family:'Inter',Arial,sans-serif;">
        <div style="width:40px;height:40px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#ffffff;background:hsl(160,55%,45%);">JM</div>
        <span style="flex:1;font-weight:500;">Jiya Mehta</span>
        <span style="font-size:14px;color:#a8a29e;">₹2,400</span>
      </button>

      <button style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;text-align:left;width:100%;box-sizing:border-box;border:none;background:transparent;font-family:'Inter',Arial,sans-serif;">
        <div style="width:40px;height:40px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#ffffff;background:hsl(190,55%,45%);">AK</div>
        <span style="flex:1;font-weight:500;">Arun Kumar</span>
        <span style="font-size:14px;color:#a8a29e;">₹1,180</span>
      </button>

      <button style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;text-align:left;width:100%;box-sizing:border-box;border:none;background:transparent;font-family:'Inter',Arial,sans-serif;">
        <div style="width:40px;height:40px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#ffffff;background:hsl(25,55%,45%);">RL</div>
        <span style="flex:1;font-weight:500;">Rhea Lal</span>
        <span style="font-size:14px;color:#a8a29e;">₹890</span>
      </button>

      <button style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;text-align:left;width:100%;box-sizing:border-box;border:none;background:transparent;font-family:'Inter',Arial,sans-serif;">
        <div style="width:40px;height:40px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#ffffff;background:hsl(340,55%,45%);">SP</div>
        <span style="flex:1;font-weight:500;">Sameer Patel</span>
        <span style="font-size:14px;color:#a8a29e;">₹0</span>
      </button>
    </div>

  </div>
</div>

</body>
</html>
