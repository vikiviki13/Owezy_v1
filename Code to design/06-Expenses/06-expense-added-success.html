<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Expense Added Successfully</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;flex-direction:column;">
  <div style="padding:40px 16px 32px;box-sizing:border-box;flex:1;display:flex;flex-direction:column;">
    <div style="margin:auto 0;text-align:center;width:100%;max-width:358px;align-self:center;flex:1;display:flex;flex-direction:column;justify-content:center;">

      <!-- Success icon -->
      <span style="width:64px;height:64px;border-radius:9999px;background:#ecfdf5;color:#059669;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
      </span>

      <!-- Title + subtitle -->
      <h1 style="font-size:24px;font-weight:700;margin:0;">Expense Added Successfully</h1>
      <p style="margin-top:8px;font-size:14px;color:#57534e;">₹2,400 was saved for Today, 26 Aug 2026.</p>

      <!-- WhatsApp share cards -->
      <div style="margin-top:28px;display:flex;flex-direction:column;gap:12px;text-align:left;">
        <!-- Card -->
        <div style="border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:16px;">
          <p style="font-weight:600;margin:0;">₹800 added for Jiya Mehta</p>
          <p style="margin-top:4px;font-size:12px;color:#a8a29e;">Pending balance: <span>₹3,200</span></p>
          <button style="margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#059669;color:#ffffff;font-weight:500;border:none;border-radius:12px;padding:12px 0;font-family:'Inter',Arial,sans-serif;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
            Send on WhatsApp — Jiya Mehta
          </button>
        </div>
        <!-- Card 2 -->
        <div style="border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:16px;">
          <p style="font-weight:600;margin:0;">₹800 added for Arun Kumar</p>
          <p style="margin-top:4px;font-size:12px;color:#a8a29e;">Pending balance: <span>₹1,980</span></p>
          <button style="margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#059669;color:#ffffff;font-weight:500;border:none;border-radius:12px;padding:12px 0;font-family:'Inter',Arial,sans-serif;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
            Send on WhatsApp — Arun Kumar
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom actions -->
    <div style="margin-top:28px;display:flex;flex-direction:column;gap:8px;max-width:358px;width:100%;align-self:center;">
      <button style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid #e7e3d8;background:#ffffff;font-weight:500;padding:14px 0;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
        View Expense
      </button>
      <button style="width:100%;border-radius:12px;border:none;padding:14px 0;color:#57534e;font-weight:500;background:transparent;font-family:'Inter',Arial,sans-serif;">Done</button>
    </div>
  </div>
</div>

</body>
</html>
