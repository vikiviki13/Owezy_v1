<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Expense Date Bottom Sheet (Calendar)</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Dimmed form behind -->
  <div style="padding:24px 16px;opacity:0.4;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <div style="width:36px;height:36px;border-radius:9999px;background:#ffffff;border:1px solid #e7e3d8;"></div>
      <div style="height:20px;width:120px;background:#f4f2ec;border-radius:6px;"></div>
    </div>
    <div style="height:44px;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;margin-bottom:16px;"></div>
    <div style="height:44px;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;margin-bottom:16px;"></div>
    <div style="height:44px;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;"></div>
  </div>

  <!-- Overlay scrim -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:#000000;opacity:0.4;"></div>

  <!-- Expense date bottom sheet with calendar expanded -->
  <div style="position:absolute;left:0;right:0;bottom:0;top:280px;background:#ffffff;border-radius:24px 24px 0 0;">
    <!-- Grabber -->
    <div style="display:flex;justify-content:center;padding-top:12px;">
      <div style="height:6px;width:40px;border-radius:9999px;background:#e7e3d8;"></div>
    </div>

    <!-- Sheet header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
      <h2 style="font-size:18px;font-weight:600;margin:0;">Expense date</h2>
      <div style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </div>
    </div>

    <!-- Body -->
    <div style="padding:4px 20px 24px;display:flex;flex-direction:column;gap:8px;">
      <!-- Quick options -->
      <button style="width:100%;display:flex;align-items:center;justify-content:space-between;border-radius:12px;border:1px solid #059669;background:#ecfdf5;padding:14px 16px;font-weight:500;text-align:left;color:#047857;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
        Today
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <button style="width:100%;display:flex;align-items:center;justify-content:space-between;border-radius:12px;border:1px solid #e7e3d8;background:#ffffff;padding:14px 16px;font-weight:500;text-align:left;color:#1c1917;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">Yesterday</button>
      <button style="width:100%;display:flex;align-items:center;justify-content:space-between;border-radius:12px;border:1px solid #e7e3d8;background:#ffffff;padding:14px 16px;font-weight:500;text-align:left;color:#1c1917;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">Select Date</button>

      <!-- Calendar section -->
      <div style="margin-top:8px;border-top:1px solid #e7e3d8;padding-top:16px;">
        <!-- Month header -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <button style="width:36px;height:36px;border-radius:9999px;display:grid;place-items:center;border:none;background:transparent;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <span style="font-size:14px;font-weight:600;">August 2026</span>
          <button style="width:36px;height:36px;border-radius:9999px;display:grid;place-items:center;border:none;background:transparent;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>

        <!-- Weekday header -->
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">
          <span style="text-align:center;font-size:12px;font-weight:500;color:#a8a29e;padding:4px 0;">Su</span>
          <span style="text-align:center;font-size:12px;font-weight:500;color:#a8a29e;padding:4px 0;">Mo</span>
          <span style="text-align:center;font-size:12px;font-weight:500;color:#a8a29e;padding:4px 0;">Tu</span>
          <span style="text-align:center;font-size:12px;font-weight:500;color:#a8a29e;padding:4px 0;">We</span>
          <span style="text-align:center;font-size:12px;font-weight:500;color:#a8a29e;padding:4px 0;">Th</span>
          <span style="text-align:center;font-size:12px;font-weight:500;color:#a8a29e;padding:4px 0;">Fr</span>
          <span style="text-align:center;font-size:12px;font-weight:500;color:#a8a29e;padding:4px 0;">Sa</span>

          <!-- Week 1 -->
          <span></span><span></span><span></span><span></span><span></span><span></span>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">1</button>

          <!-- Week 2 -->
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">2</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">3</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">4</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">5</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">6</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">7</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">8</button>

          <!-- Week 3 -->
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">9</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">10</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">11</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">12</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">13</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">14</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">15</button>

          <!-- Week 4 -->
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">16</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">17</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">18</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">19</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">20</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">21</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">22</button>

          <!-- Week 5 -->
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">23</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">24</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;border:none;background:transparent;color:#1c1917;font-family:'Inter',Arial,sans-serif;">25</button>
          <button style="aspect-ratio:1;border-radius:9999px;font-size:14px;font-weight:600;border:none;background:#059669;color:#ffffff;font-family:'Inter',Arial,sans-serif;">26</button>
          <!-- Future dates disabled -->
          <span style="aspect-ratio:1;border-radius:9999px;font-size:14px;display:grid;place-items:center;color:#a8a29e;opacity:0.4;">27</span>
          <span style="aspect-ratio:1;border-radius:9999px;font-size:14px;display:grid;place-items:center;color:#a8a29e;opacity:0.4;">28</span>
          <span style="aspect-ratio:1;border-radius:9999px;font-size:14px;display:grid;place-items:center;color:#a8a29e;opacity:0.4;">29</span>

          <!-- Week 6 -->
          <span style="aspect-ratio:1;border-radius:9999px;font-size:14px;display:grid;place-items:center;color:#a8a29e;opacity:0.4;">30</span>
          <span style="aspect-ratio:1;border-radius:9999px;font-size:14px;display:grid;place-items:center;color:#a8a29e;opacity:0.4;">31</span>
        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
