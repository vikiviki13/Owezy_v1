<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Add Expense — Step 1</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <div style="padding:24px 16px 32px;box-sizing:border-box;min-height:844px;display:flex;flex-direction:column;">

    <!-- Header -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <button style="width:36px;height:36px;border-radius:9999px;background:#ffffff;border:1px solid #e7e3d8;display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <h1 style="font-size:18px;font-weight:600;margin:0;">Add Expense</h1>
      <!-- Step indicator -->
      <div style="margin-left:auto;display:flex;gap:4px;">
        <div style="height:6px;width:24px;border-radius:9999px;background:#059669;"></div>
        <div style="height:6px;width:6px;border-radius:9999px;background:#e7e3d8;"></div>
        <div style="height:6px;width:6px;border-radius:9999px;background:#e7e3d8;"></div>
      </div>
    </div>

    <div style="flex:1;">
      <!-- Audience question -->
      <p style="font-size:14px;color:#57534e;margin:0 0 12px;">Who is this expense for?</p>

      <!-- Audience segmented control -->
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <span style="flex:1;border-radius:12px;padding:10px 0;font-size:14px;font-weight:500;text-align:center;background:#f4f2ec;color:#57534e;">Self</span>
        <span style="flex:1;border-radius:12px;padding:10px 0;font-size:14px;font-weight:500;text-align:center;background:#f4f2ec;color:#57534e;">Friend</span>
        <span style="flex:1;border-radius:12px;padding:10px 0;font-size:14px;font-weight:500;text-align:center;background:#059669;color:#ffffff;">Friends</span>
      </div>

      <!-- Search friends -->
      <div style="position:relative;margin-bottom:12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:14px;top:15px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="Search friends" style="width:100%;box-sizing:border-box;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px 14px 12px 36px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
      </div>

      <!-- Selected chips -->
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
        <span style="min-height:40px;display:inline-flex;align-items:center;gap:6px;background:#ecfdf5;color:#047857;font-size:14px;font-weight:500;padding:0 12px;border-radius:9999px;">Jiya Mehta <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
        <span style="min-height:40px;display:inline-flex;align-items:center;gap:6px;background:#ecfdf5;color:#047857;font-size:14px;font-weight:500;padding:0 12px;border-radius:9999px;">Arun Kumar <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
      </div>

      <!-- Friend list -->
      <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:16px;">
        <!-- Selected row -->
        <button style="display:flex;align-items:center;gap:12px;padding:10px;border:none;background:transparent;text-align:left;font-family:'Inter',Arial,sans-serif;width:100%;box-sizing:border-box;">
          <div style="width:38px;height:38px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#ffffff;background:hsl(160,55%,45%);">JM</div>
          <span style="flex:1;font-weight:500;">Jiya Mehta</span>
          <span style="width:20px;height:20px;border-radius:9999px;background:#059669;display:flex;align-items:center;justify-content:center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        </button>
        <!-- Selected row -->
        <button style="display:flex;align-items:center;gap:12px;padding:10px;border:none;background:transparent;text-align:left;font-family:'Inter',Arial,sans-serif;width:100%;box-sizing:border-box;">
          <div style="width:38px;height:38px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#ffffff;background:hsl(190,55%,45%);">AK</div>
          <span style="flex:1;font-weight:500;">Arun Kumar</span>
          <span style="width:20px;height:20px;border-radius:9999px;background:#059669;display:flex;align-items:center;justify-content:center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        </button>
        <!-- Unselected row -->
        <button style="display:flex;align-items:center;gap:12px;padding:10px;border:none;background:transparent;text-align:left;font-family:'Inter',Arial,sans-serif;width:100%;box-sizing:border-box;">
          <div style="width:38px;height:38px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#ffffff;background:hsl(25,55%,45%);">RL</div>
          <span style="flex:1;font-weight:500;">Rhea Lal</span>
        </button>
      </div>

      <!-- Import contacts card -->
      <button style="margin-bottom:16px;min-height:56px;width:100%;display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:0 16px;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
        <span style="width:40px;height:40px;border-radius:12px;background:#ecfdf5;display:grid;place-items:center;flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="10" r="2.5"/><path d="M7.5 17c.8-2 2.5-3 4.5-3s3.7 1 4.5 3"/></svg>
        </span>
        <span style="flex:1;">
          <span style="display:block;font-weight:600;color:#1c1917;">Import Contacts</span>
          <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Add and select several friends at once</span>
        </span>
      </button>

      <!-- Add new friend inline -->
      <div style="display:flex;align-items:center;gap:8px;border-top:1px solid #e7e3d8;padding-top:16px;">
        <input type="text" placeholder="Add a new friend by name" style="flex:1;box-sizing:border-box;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:10px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
        <button style="flex-shrink:0;padding:10px 16px;border-radius:12px;background:#f4f2ec;border:none;font-weight:500;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">Add</button>
      </div>

      <!-- Continue button -->
      <button style="width:100%;margin-top:24px;background:#059669;color:#ffffff;font-size:15px;font-weight:500;border:none;border-radius:12px;padding:14px 0;font-family:'Inter',Arial,sans-serif;">Continue (2 selected)</button>
    </div>

  </div>
</div>

</body>
</html>
