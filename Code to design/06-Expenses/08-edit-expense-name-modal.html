<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Edit Expense Name Modal</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Dimmed detail screen behind -->
  <div style="padding:24px 16px;opacity:0.4;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <div style="width:36px;height:36px;border-radius:9999px;background:#ffffff;border:1px solid #e7e3d8;"></div>
      <div style="flex:1;">
        <div style="height:18px;width:220px;background:#f4f2ec;border-radius:6px;margin-bottom:8px;"></div>
        <div style="height:14px;width:140px;background:#f4f2ec;border-radius:6px;"></div>
      </div>
    </div>
    <div style="border-radius:24px;background:#ffffff;border:1px solid #e7e3d8;height:110px;margin-bottom:20px;"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;">
      <div style="height:64px;background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;"></div>
      <div style="height:64px;background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;"></div>
    </div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:160px;"></div>
  </div>

  <!-- Overlay scrim -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:#000000;opacity:0.4;"></div>

  <!-- Centered edit modal -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:0 24px;">
    <div style="position:relative;background:#ffffff;border-radius:16px;padding:20px;width:100%;max-width:342px;box-sizing:border-box;">
      <p style="font-weight:600;margin:0 0 12px;">Edit Expense Name</p>
      <input type="text" value="Team dinner at Barbeque Nation" placeholder="e.g. Barbeque Nation, Taj Hotel, PVR" style="width:100%;box-sizing:border-box;background:#ffffff;border:1px solid #059669;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button style="flex:1;padding:10px 0;border-radius:12px;background:#f4f2ec;border:none;font-weight:500;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">Cancel</button>
        <button style="flex:1;padding:10px 0;border-radius:12px;background:#059669;border:none;font-weight:500;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#ffffff;">Save</button>
      </div>
    </div>
  </div>

</div>

</body>
</html>
