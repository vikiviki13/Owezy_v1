<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Create Group Sheet</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Dimmed underlying screen (simplified) -->
    <div style="position:absolute;inset:0;background:#fbfaf7;">
      <div style="height:47px;"></div>
      <div style="padding:24px 16px;">
        <h1 style="font-size:20px;font-weight:600;margin:0;color:#1c1917;">Groups</h1>
      </div>
    </div>

    <!-- Scrim -->
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.4);"></div>

    <!-- Bottom sheet -->
    <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);">
      <!-- Handle -->
      <div style="display:flex;justify-content:center;padding-top:12px;">
        <div style="width:40px;height:6px;border-radius:3px;background:#e7e3d8;"></div>
      </div>

      <!-- Title row -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
        <h2 style="font-size:18px;font-weight:600;margin:0;color:#1c1917;">Create Group</h2>
        <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <!-- Content -->
      <div style="display:flex;flex-direction:column;gap:16px;padding:4px 20px 24px;">
        <!-- Group name -->
        <label style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:500;color:#57534e;">Group name <span style="color:#dc2626;">*</span></span>
          <input type="text" placeholder="e.g. Office Friends" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
        </label>

        <!-- Members -->
        <div>
          <p style="font-size:14px;font-weight:500;color:#57534e;margin:0 0 8px;">Members</p>
          <div style="display:flex;flex-direction:column;gap:4px;max-height:224px;overflow:hidden;">
            <button style="display:flex;align-items:center;justify-content:space-between;padding:10px;border:none;background:none;border-radius:12px;text-align:left;">
              <span style="font-size:14px;font-weight:500;color:#1c1917;">Priya Sharma</span>
              <span style="width:20px;height:20px;border-radius:10px;background:#059669;display:flex;align-items:center;justify-content:center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            </button>
            <button style="display:flex;align-items:center;justify-content:space-between;padding:10px;border:none;background:none;border-radius:12px;text-align:left;">
              <span style="font-size:14px;font-weight:500;color:#1c1917;">Vikram Singh</span>
              <span style="width:20px;height:20px;border-radius:10px;background:#059669;display:flex;align-items:center;justify-content:center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            </button>
            <button style="display:flex;align-items:center;justify-content:space-between;padding:10px;border:none;background:none;border-radius:12px;text-align:left;">
              <span style="font-size:14px;font-weight:500;color:#1c1917;">Rahul Verma</span>
            </button>
            <button style="display:flex;align-items:center;justify-content:space-between;padding:10px;border:none;background:none;border-radius:12px;text-align:left;">
              <span style="font-size:14px;font-weight:500;color:#1c1917;">Sneha Patel</span>
            </button>
          </div>
        </div>

        <!-- Create -->
        <button style="background:#059669;color:#ffffff;font-size:16px;font-weight:500;border:none;border-radius:12px;padding:12px;">Create Group</button>
      </div>
    </div>
  </div>
</body>
</html>
