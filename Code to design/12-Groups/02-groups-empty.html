<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Groups - Empty State</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <div style="height:47px;"></div>

    <!-- Content -->
    <div style="padding:24px 16px 120px;">
      <!-- Header -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h1 style="font-size:20px;font-weight:600;margin:0;color:#1c1917;">Groups</h1>
        <button style="width:36px;height:36px;border-radius:18px;background:#059669;border:none;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
      </div>

      <!-- Empty state -->
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 24px;">
        <div style="width:56px;height:56px;border-radius:16px;background:#f4f2ec;display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        </div>
        <p style="font-size:16px;font-weight:500;color:#1c1917;margin:0;">No groups yet.</p>
        <p style="font-size:14px;color:#a8a29e;margin:4px 0 0;max-width:240px;line-height:1.5;">Create a group for recurring outings — office friends, roommates, a trip.</p>
        <button style="margin-top:16px;font-size:14px;font-weight:500;color:#ffffff;background:#059669;padding:8px 16px;border:none;border-radius:12px;">Create Group</button>
      </div>
    </div>

    <!-- Floating add button -->
    <div style="position:absolute;bottom:80px;right:20px;width:56px;height:56px;border-radius:28px;background:#059669;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 15px -3px rgba(0,0,0,0.2);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </div>

    <!-- Bottom navigation -->
    <div style="position:absolute;bottom:0;left:0;right:0;background:#ffffff;border-top:1px solid #e7e3d8;padding-bottom:env(safe-area-inset-bottom,0px);">
      <div style="display:flex;align-items:stretch;justify-content:space-around;">
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span style="font-size:11px;font-weight:500;color:#a8a29e;">Home</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span style="font-size:11px;font-weight:500;color:#a8a29e;">Friends</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span style="font-size:11px;font-weight:500;color:#a8a29e;">Activity</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
          <span style="font-size:11px;font-weight:500;color:#059669;">Groups</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span style="font-size:11px;font-weight:500;color:#a8a29e;">Profile</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
