<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Delete Friend Sheet</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Dimmed underlying screen (simplified) -->
    <div style="position:absolute;inset:0;background:#fbfaf7;">
      <div style="height:47px;"></div>
      <div style="padding:24px 16px;">
        <h1 style="font-size:18px;font-weight:600;margin:0;color:#1c1917;">Manage Friend</h1>
      </div>
    </div>

    <!-- Scrim -->
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.4);"></div>

    <!-- Bottom sheet -->
    <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);">
      <!-- Handle -->
      <div style="display:flex;justify-content:center;padding-top:12px;">
        <div style="width:40px;height:6px;border-radius:3px;background:#e7e3d8;"></div>
      </div>

      <!-- Title row -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
        <h2 style="font-size:18px;font-weight:600;margin:0;color:#1c1917;">Delete Friend</h2>
        <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <!-- Content -->
      <div style="padding:4px 20px 24px;">
        <p style="font-size:14px;line-height:24px;color:#57534e;margin:0;"><span style="font-weight:600;color:#1c1917;">Priya Sharma</span> has financial history. Deleting the profile immediately would also remove it — instead, choose how to proceed.</p>

        <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;">
          <!-- Archive option -->
          <button style="width:100%;display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:14px 16px;text-align:left;box-sizing:border-box;">
            <span style="width:36px;height:36px;border-radius:12px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
            </span>
            <span style="flex:1;">
              <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;">Archive Friend</span>
              <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Recommended — keeps all history and balances</span>
            </span>
          </button>

          <!-- Clear data and delete option -->
          <button style="width:100%;display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:14px 16px;text-align:left;box-sizing:border-box;">
            <span style="width:36px;height:36px;border-radius:12px;background:rgba(220,38,38,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
            </span>
            <span style="flex:1;">
              <span style="display:block;font-size:14px;font-weight:500;color:#dc2626;">Clear Data &amp; Delete</span>
              <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Removes the profile and all financial history</span>
            </span>
          </button>
        </div>

        <!-- Cancel -->
        <button style="width:100%;border:none;background:none;padding:12px 0;margin-top:8px;font-size:16px;font-weight:500;color:#57534e;">Cancel</button>
      </div>
    </div>
  </div>
</body>
</html>
