<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Add Friend Sheet</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Dimmed underlying screen (simplified) -->
    <div style="position:absolute;inset:0;background:#fbfaf7;">
      <div style="height:47px;"></div>
      <div style="padding:24px 16px;">
        <h1 style="font-size:20px;font-weight:600;margin:0;color:#1c1917;">Friends</h1>
      </div>
    </div>

    <!-- Scrim -->
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.4);"></div>

    <!-- Bottom sheet -->
    <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);">
      <!-- Handle -->
      <div style="display:flex;justify-content:center;padding-top:12px;">
        <div style="width:40px;height:6px;border-radius:3px;background:#e7e3d8;"></div>
      </div>

      <!-- Title row -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
        <h2 style="font-size:18px;font-weight:600;margin:0;color:#1c1917;">Add Friend</h2>
        <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <!-- Content -->
      <div style="display:flex;flex-direction:column;gap:16px;padding:4px 20px 24px;">
        <!-- Import from contacts -->
        <button style="min-height:56px;display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:0 16px;text-align:left;">
          <span style="width:40px;height:40px;border-radius:12px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><rect width="6" height="5" x="16" y="2" rx="1"/><rect width="6" height="5" x="16" y="17" rx="1"/></svg>
          </span>
          <span style="flex:1;">
            <span style="display:block;font-size:16px;font-weight:600;color:#1c1917;">Import from Contacts</span>
            <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Select and review multiple contacts</span>
          </span>
        </button>

        <!-- Divider -->
        <div style="display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#a8a29e;">
          <span style="height:1px;flex:1;background:#e7e3d8;"></span>
          or add manually
          <span style="height:1px;flex:1;background:#e7e3d8;"></span>
        </div>

        <!-- Name -->
        <label style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:500;color:#57534e;">Name <span style="color:#dc2626;">*</span></span>
          <input type="text" placeholder="e.g. Arun Kumar" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
        </label>

        <!-- Nickname -->
        <label style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:500;color:#57534e;">Nickname</span>
          <input type="text" placeholder="Optional" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
        </label>

        <!-- Phone -->
        <label style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:500;color:#57534e;">Phone / WhatsApp</span>
          <input type="tel" placeholder="e.g. 98765 43210" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
        </label>

        <!-- Save -->
        <button style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;background:#059669;color:#ffffff;font-size:16px;font-weight:500;border:none;border-radius:12px;padding:12px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
          Add Friend
        </button>
      </div>
    </div>
  </div>
</body>
</html>
