<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Manage Friend</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <div style="height:47px;"></div>

    <!-- Content -->
    <div style="padding:24px 16px 32px;">
      <!-- Header -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
        <button style="width:36px;height:36px;border-radius:18px;background:#ffffff;border:1px solid #e7e3d8;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </button>
        <h1 style="font-size:18px;font-weight:600;margin:0;color:#1c1917;">Manage Friend</h1>
      </div>

      <!-- Profile row -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
        <div style="width:52px;height:52px;border-radius:26px;background:#8834B2;color:#ffffff;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center;">PS</div>
        <div style="flex:1;min-width:0;">
          <p style="font-size:16px;font-weight:600;color:#1c1917;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Priya Sharma</p>
          <p style="font-size:12px;color:#a8a29e;margin:2px 0 0;">Known as Pri</p>
        </div>
        <button style="flex-shrink:0;display:flex;align-items:center;gap:6px;background:#f4f2ec;border:none;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:500;color:#1c1917;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
          Edit
        </button>
      </div>

      <!-- Friend information section -->
      <div style="margin-bottom:28px;">
        <p style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#a8a29e;font-weight:500;margin:0 0 8px;">Friend Information</p>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;overflow:hidden;">
          <button style="width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:none;background:none;text-align:left;border-bottom:1px solid #e7e3d8;box-sizing:border-box;">
            <span style="width:36px;height:36px;border-radius:12px;background:#f4f2ec;color:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><rect width="6" height="5" x="16" y="2" rx="1"/><rect width="6" height="5" x="16" y="17" rx="1"/></svg></span>
            <span style="flex:1;min-width:0;">
              <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;">Edit Profile</span>
              <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Photo, name, nickname, contact details</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <button style="width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:none;background:none;text-align:left;box-sizing:border-box;">
            <span style="width:36px;height:36px;border-radius:12px;background:#f4f2ec;color:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/></svg></span>
            <span style="flex:1;min-width:0;">
              <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;">WhatsApp Number</span>
              <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">98765 43210</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>

      <!-- Financial section -->
      <div style="margin-bottom:28px;">
        <p style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#a8a29e;font-weight:500;margin:0 0 8px;">Financial</p>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;padding:16px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;">
          <div>
            <p style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#a8a29e;font-weight:500;margin:0;">Current Pending</p>
            <p style="font-size:24px;line-height:30px;font-weight:800;margin:4px 0 0;color:#059669;">₹2,450.00</p>
          </div>
          <span style="width:44px;height:44px;border-radius:12px;background:#ecfdf5;color:#059669;display:flex;align-items:center;justify-content:center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          </span>
        </div>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;overflow:hidden;">
          <button style="width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:none;background:none;text-align:left;border-bottom:1px solid #e7e3d8;box-sizing:border-box;">
            <span style="width:36px;height:36px;border-radius:12px;background:#f4f2ec;color:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg></span>
            <span style="flex:1;min-width:0;">
              <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;">Clear All Dues</span>
              <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Mark the complete outstanding balance as settled</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <button style="width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:none;background:none;text-align:left;box-sizing:border-box;">
            <span style="width:36px;height:36px;border-radius:12px;background:#f4f2ec;color:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg></span>
            <span style="flex:1;min-width:0;">
              <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;">Export Statement</span>
              <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Share a statement summary over WhatsApp</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>

      <!-- Data section -->
      <div>
        <p style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#a8a29e;font-weight:500;margin:0 0 8px;">Data</p>
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;overflow:hidden;">
          <button style="width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:none;background:none;text-align:left;border-bottom:1px solid #e7e3d8;box-sizing:border-box;">
            <span style="width:36px;height:36px;border-radius:12px;background:#f4f2ec;color:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg></span>
            <span style="flex:1;min-width:0;">
              <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;">Archive Friend</span>
              <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Hide from Add Expense while keeping all history</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <button style="width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:none;background:none;text-align:left;border-bottom:1px solid #e7e3d8;box-sizing:border-box;">
            <span style="width:36px;height:36px;border-radius:12px;background:rgba(220,38,38,0.1);color:#dc2626;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></span>
            <span style="flex:1;min-width:0;">
              <span style="display:block;font-size:14px;font-weight:500;color:#dc2626;">Clear Friend Data</span>
              <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Permanently remove this friend's financial history</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <button style="width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:none;background:none;text-align:left;box-sizing:border-box;">
            <span style="width:36px;height:36px;border-radius:12px;background:rgba(220,38,38,0.1);color:#dc2626;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg></span>
            <span style="flex:1;min-width:0;">
              <span style="display:block;font-size:14px;font-weight:500;color:#dc2626;">Delete Friend</span>
              <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Archive first, or clear data and delete</span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
