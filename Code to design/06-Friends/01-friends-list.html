<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Friends</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <div style="height:47px;"></div>

    <!-- Content -->
    <div style="padding:24px 16px 120px;">
      <!-- Header -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h1 style="font-size:20px;font-weight:600;margin:0;color:#1c1917;">Friends</h1>
        <button style="width:44px;height:44px;border-radius:22px;background:#059669;border:none;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
      </div>

      <!-- Search -->
      <div style="position:relative;margin-bottom:16px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:14px;top:13px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="Search friends" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:10px 16px 10px 40px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
      </div>

      <!-- Filter tabs -->
      <div style="display:flex;gap:8px;margin-bottom:20px;">
        <button style="padding:6px 16px;border-radius:999px;font-size:14px;font-weight:500;background:#059669;color:#ffffff;border:none;">All</button>
        <button style="padding:6px 16px;border-radius:999px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;border:none;">Pending</button>
        <button style="padding:6px 16px;border-radius:999px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;border:none;">Settled</button>
      </div>

      <!-- Friend list -->
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button style="display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;padding:14px;text-align:left;">
          <div style="width:46px;height:46px;border-radius:23px;background:#8834B2;color:#ffffff;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;">PS</div>
          <div style="flex:1;min-width:0;">
            <p style="font-size:16px;font-weight:500;color:#1c1917;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Priya Sharma</p>
            <p style="font-size:12px;color:#a8a29e;margin:2px 0 0;">Last activity 22 Aug 2026</p>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <p style="font-size:16px;font-weight:600;color:#1c1917;margin:0;">₹2,450.00</p>
            <span style="display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:500;background:#fef3c7;color:#92400e;margin-top:2px;">Pending</span>
          </div>
        </button>

        <button style="display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;padding:14px;text-align:left;">
          <div style="width:46px;height:46px;border-radius:23px;background:#B26834;color:#ffffff;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;">VS</div>
          <div style="flex:1;min-width:0;">
            <p style="font-size:16px;font-weight:500;color:#1c1917;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Vikram Singh</p>
            <p style="font-size:12px;color:#a8a29e;margin:2px 0 0;">Last activity 21 Aug 2026</p>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <p style="font-size:16px;font-weight:600;color:#1c1917;margin:0;">₹5,200.00</p>
            <span style="display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:500;background:#fef3c7;color:#92400e;margin-top:2px;">Pending</span>
          </div>
        </button>

        <button style="display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;padding:14px;text-align:left;">
          <div style="width:46px;height:46px;border-radius:23px;background:#3488B2;color:#ffffff;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;">RV</div>
          <div style="flex:1;min-width:0;">
            <p style="font-size:16px;font-weight:500;color:#1c1917;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Rahul Verma</p>
            <p style="font-size:12px;color:#a8a29e;margin:2px 0 0;">Last activity 19 Aug 2026</p>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <p style="font-size:16px;font-weight:600;color:#1c1917;margin:0;">₹850.00</p>
            <span style="display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:500;background:#dbeafe;color:#1e40af;margin-top:2px;">Partial</span>
          </div>
        </button>

        <button style="display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;padding:14px;text-align:left;">
          <div style="width:46px;height:46px;border-radius:23px;background:#B2345E;color:#ffffff;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;">SP</div>
          <div style="flex:1;min-width:0;">
            <p style="font-size:16px;font-weight:500;color:#1c1917;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Sneha Patel</p>
            <p style="font-size:12px;color:#a8a29e;margin:2px 0 0;">No transactions yet</p>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <p style="font-size:16px;font-weight:600;color:#1c1917;margin:0;">₹0.00</p>
            <span style="display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:500;background:#ecfdf5;color:#047857;margin-top:2px;">Settled</span>
          </div>
        </button>
      </div>
    </div>

    <!-- Floating add button -->
    <div style="position:absolute;bottom:80px;right:20px;width:56px;height:56px;border-radius:28px;background:#059669;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 15px -3px rgba(0,0,0,0.2);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </div>

    <!-- Bottom navigation -->
    <div style="position:absolute;bottom:0;left:0;right:0;background:#ffffff;border-top:1px solid #e7e3d8;padding-bottom:env(safe-area-inset-bottom,0px);">
      <div style="display:flex;align-items:stretch;justify-content:space-around;">
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span style="font-size:11px;font-weight:500;color:#a8a29e;">Home</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span style="font-size:11px;font-weight:500;color:#059669;">Friends</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span style="font-size:11px;font-weight:500;color:#a8a29e;">Activity</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
          <span style="font-size:11px;font-weight:500;color:#a8a29e;">Groups</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span style="font-size:11px;font-weight:500;color:#a8a29e;">Profile</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
