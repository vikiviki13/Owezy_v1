<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Clear All Dues Sheet</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Dimmed underlying screen (simplified) -->
    <div style="position:absolute;inset:0;background:#fbfaf7;">
      <div style="height:47px;"></div>
      <div style="padding:24px 16px;">
        <h1 style="font-size:18px;font-weight:600;margin:0;color:#1c1917;">Manage Friend</h1>
      </div>
    </div>

    <!-- Scrim -->
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.4);"></div>

    <!-- Bottom sheet -->
    <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);">
      <!-- Handle -->
      <div style="display:flex;justify-content:center;padding-top:12px;">
        <div style="width:40px;height:6px;border-radius:3px;background:#e7e3d8;"></div>
      </div>

      <!-- Title row -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
        <h2 style="font-size:18px;font-weight:600;margin:0;color:#1c1917;">Clear All Dues</h2>
        <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <!-- Content -->
      <div style="display:flex;flex-direction:column;gap:16px;padding:4px 20px 24px;">
        <!-- Summary -->
        <div style="background:#f4f2ec;border-radius:16px;padding:16px;">
          <p style="font-size:14px;color:#57534e;margin:0;">Clear <span style="font-weight:700;color:#1c1917;">₹2,450.00</span> pending for <span style="font-weight:600;color:#1c1917;">Priya Sharma</span>?</p>
          <p style="margin-top:4px;font-size:12px;line-height:20px;color:#a8a29e;">A settlement record will be created. Past expenses and repayments stay in history.</p>
        </div>

        <!-- Settlement date -->
        <label style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:500;color:#57534e;">Settlement date</span>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <div style="display:flex;gap:8px;">
              <button style="flex:1;padding:10px 0;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#059669;color:#ffffff;">Today</button>
              <button style="flex:1;padding:10px 0;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#1c1917;">Yesterday</button>
              <button style="flex:1;padding:10px 0;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#1c1917;">Select Date</button>
            </div>
            <p style="font-size:12px;color:#a8a29e;margin:0;">24 Aug 2026</p>
          </div>
        </label>

        <!-- Payment method -->
        <label style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:500;color:#57534e;">Payment method (optional)</span>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            <button style="padding:8px 14px;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">UPI</button>
            <button style="padding:8px 14px;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Cash</button>
            <button style="padding:8px 14px;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Bank Transfer</button>
            <button style="padding:8px 14px;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Card</button>
            <button style="padding:8px 14px;border:none;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Other</button>
          </div>
        </label>

        <!-- Notes -->
        <label style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:500;color:#57534e;">Notes (optional)</span>
          <textarea rows="2" placeholder="e.g. Settled outside the app" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;resize:none;"></textarea>
        </label>

        <!-- Actions -->
        <div style="display:flex;gap:8px;margin-top:8px;">
          <button style="flex:1;border-radius:12px;border:1px solid #e7e3d8;padding:12px 0;font-size:16px;font-weight:500;color:#57534e;background:#ffffff;">Cancel</button>
          <button style="flex:1;border-radius:12px;border:none;padding:12px 0;font-size:16px;font-weight:500;color:#ffffff;background:#059669;">Clear Dues</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
