<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Edit Friend Sheet</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Dimmed underlying screen (simplified) -->
    <div style="position:absolute;inset:0;background:#fbfaf7;">
      <div style="height:47px;"></div>
      <div style="padding:24px 16px;">
        <h1 style="font-size:18px;font-weight:600;margin:0;color:#1c1917;">Manage Friend</h1>
      </div>
    </div>

    <!-- Scrim -->
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.4);"></div>

    <!-- Bottom sheet -->
    <div style="position:absolute;left:0;right:0;bottom:0;top:120px;background:#ffffff;border-radius:24px 24px 0 0;overflow:hidden;display:flex;flex-direction:column;">
      <!-- Handle -->
      <div style="display:flex;justify-content:center;padding-top:12px;">
        <div style="width:40px;height:6px;border-radius:3px;background:#e7e3d8;"></div>
      </div>

      <!-- Title row -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
        <h2 style="font-size:18px;font-weight:600;margin:0;color:#1c1917;">Edit Friend</h2>
        <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <!-- Scrollable content -->
      <div style="flex:1;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:4px 20px 24px;">
        <!-- Photo row -->
        <div style="display:flex;align-items:center;gap:16px;">
          <div style="width:64px;height:64px;border-radius:32px;background:#8834B2;color:#ffffff;font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center;">PS</div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <span style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:#059669;min-height:36px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>Add photo</span>
            <span style="display:flex;align-items:center;gap:6px;font-size:14px;color:#a8a29e;min-height:36px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>Remove photo</span>
          </div>
        </div>

        <!-- Name -->
        <label style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:500;color:#57534e;">Name <span style="color:#dc2626;">*</span></span>
          <input type="text" value="Priya Sharma" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
        </label>

        <!-- Nickname -->
        <label style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:500;color:#57534e;">Nickname</span>
          <input type="text" value="Pri" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
        </label>

        <!-- WhatsApp -->
        <label style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:500;color:#57534e;">WhatsApp number</span>
          <input type="tel" value="98765 43210" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
        </label>

        <!-- Phone -->
        <label style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:500;color:#57534e;">Phone number</span>
          <input type="tel" placeholder="Optional" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
        </label>

        <!-- Email -->
        <label style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:500;color:#57534e;">Email</span>
          <input type="email" placeholder="Optional" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
        </label>

        <!-- Notes -->
        <label style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:14px;font-weight:500;color:#57534e;">Notes</span>
          <textarea rows="2" placeholder="Optional" style="width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;resize:none;"></textarea>
        </label>

        <!-- Save -->
        <button style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;background:#059669;color:#ffffff;font-size:16px;font-weight:500;border:none;border-radius:12px;padding:12px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          Save Changes
        </button>
      </div>
    </div>
  </div>
</body>
</html>
