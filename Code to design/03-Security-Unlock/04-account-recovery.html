<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Account Recovery - Verify Password</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;padding:47px 20px 32px;box-sizing:border-box;">
    <div style="max-width:384px;width:100%;margin:0 auto;">
      <!-- Icon -->
      <div style="width:64px;height:64px;border-radius:16px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>

      <!-- Heading -->
      <h1 style="font-size:24px;font-weight:700;margin:20px 0 0;color:#1c1917;">Recover App PIN</h1>
      <p style="font-size:14px;line-height:24px;color:#57534e;margin:8px 0 0;">Verify your account identity, then create a new PIN. Your existing PIN is never revealed or emailed.</p>

      <!-- Verify password card -->
      <form style="background:#ffffff;border:1px solid #e7e3d8;border-radius:24px;padding:20px;margin-top:28px;display:block;">
        <label style="display:block;">
          <span style="display:block;font-size:14px;font-weight:600;color:#1c1917;">Account password</span>
          <input type="password" placeholder="Enter your account password" style="width:100%;min-height:48px;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;margin-top:8px;">
        </label>

        <!-- Error message (visible on failed verification) -->
        <p style="font-size:14px;color:#dc2626;margin:12px 0 0;">The password doesn't match this account.</p>

        <button type="submit" style="margin-top:20px;width:100%;min-height:56px;border:none;border-radius:16px;background:#059669;color:#ffffff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;">
          Verify Identity
        </button>

        <button type="button" style="margin-top:8px;width:100%;min-height:44px;background:none;border:none;font-size:14px;font-weight:600;color:#059669;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:8px;"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
          Use Device Security Instead
        </button>
      </form>
    </div>
  </div>
</body>
</html>
