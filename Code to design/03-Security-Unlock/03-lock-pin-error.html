<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>App Locked - Incorrect PIN</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:47px 20px 32px;box-sizing:border-box;">
    <div style="max-width:384px;width:100%;margin:0 auto;text-align:center;">
      <!-- Brand -->
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;color:#059669;margin-bottom:28px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
        <span style="font-size:16px;font-weight:700;">Owezy</span>
      </div>

      <!-- Lock icon -->
      <div style="width:80px;height:80px;border-radius:26px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;margin:0 auto;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="15" r="1"/></svg>
      </div>
      <h1 style="font-size:24px;font-weight:700;margin:20px 0 0;color:#1c1917;">App Locked</h1>
      <p style="font-size:14px;color:#57534e;margin:8px 0 0;line-height:1.5;">Your financial records are protected.</p>

      <!-- PIN pad with error -->
      <div style="max-width:320px;margin:28px auto 0;">
        <div style="text-align:center;margin-bottom:20px;">
          <h2 style="font-size:18px;font-weight:700;margin:0;color:#1c1917;">Enter your PIN</h2>
          <p style="font-size:14px;line-height:20px;color:#57534e;margin:6px 0 0;">Enter your 6-digit App PIN.</p>
        </div>

        <!-- Dots (empty after failed attempt) -->
        <div style="display:flex;justify-content:center;gap:12px;margin-bottom:20px;">
          <div style="width:12px;height:12px;border-radius:6px;background:transparent;border:1px solid #a8a29e;"></div>
          <div style="width:12px;height:12px;border-radius:6px;background:transparent;border:1px solid #a8a29e;"></div>
          <div style="width:12px;height:12px;border-radius:6px;background:transparent;border:1px solid #a8a29e;"></div>
          <div style="width:12px;height:12px;border-radius:6px;background:transparent;border:1px solid #a8a29e;"></div>
          <div style="width:12px;height:12px;border-radius:6px;background:transparent;border:1px solid #a8a29e;"></div>
          <div style="width:12px;height:12px;border-radius:6px;background:transparent;border:1px solid #a8a29e;"></div>
        </div>

        <!-- Error message -->
        <p style="min-height:20px;text-align:center;font-size:12px;color:#dc2626;margin:0 0 12px;">Too many attempts. Try again in 42 seconds.</p>

        <!-- Keypad (disabled state) -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
          <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;opacity:0.5;">1</button>
          <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;opacity:0.5;">2</button>
          <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;opacity:0.5;">3</button>
          <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;opacity:0.5;">4</button>
          <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;opacity:0.5;">5</button>
          <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;opacity:0.5;">6</button>
          <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;opacity:0.5;">7</button>
          <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;opacity:0.5;">8</button>
          <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;opacity:0.5;">9</button>
          <span></span>
          <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;opacity:0.5;">0</button>
          <button style="min-height:56px;border:none;border-radius:16px;background:transparent;display:flex;align-items:center;justify-content:center;opacity:0.3;">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H11l-8 7 8 7h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><path d="m14 9-4 4"/><path d="m10 9 4 4"/></svg>
          </button>
        </div>

        <!-- Forgot PIN -->
        <button style="margin-top:16px;min-height:44px;padding:0 16px;background:none;border:none;font-size:14px;font-weight:600;color:#059669;">Forgot PIN?</button>
      </div>

      <!-- Footnote -->
      <p style="font-size:12px;color:#a8a29e;margin:24px 0 0;line-height:1.6;">Your biometric information stays on your device. Tab only receives confirmation that verification succeeded.</p>

      <!-- Escape hatch -->
      <button style="margin-top:16px;min-height:44px;padding:0 16px;background:none;border:none;font-size:14px;font-weight:600;color:#a8a29e;">Can't unlock? Turn off App Lock with your account password</button>
    </div>
  </div>
</body>
</html>
