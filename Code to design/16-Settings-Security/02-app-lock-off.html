<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>App Lock Settings</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Sticky header -->
    <header style="position:absolute;top:47px;left:0;right:0;z-index:20;height:56px;display:flex;align-items:center;background:rgba(251,250,247,0.95);border-bottom:1px solid #e7e3d8;padding:0 12px;box-sizing:border-box;">
      <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <h1 style="font-size:18px;font-weight:600;margin:0 0 0 4px;color:#1c1917;">App Lock</h1>
    </header>

    <!-- Content -->
    <div style="padding:120px 16px 40px;box-sizing:border-box;">
      <p style="font-size:14px;line-height:24px;color:#57534e;margin:0 0 20px;">Protect your expense, repayment and financial records when you open the app.</p>

      <!-- Toggle card -->
      <div style="border-radius:24px;background:#ffffff;border:1px solid #e7e3d8;padding:20px;margin-bottom:28px;">
        <div style="display:flex;align-items:center;gap:16px;">
          <span style="width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#f4f2ec;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <div style="flex:1;">
            <h2 style="font-size:16px;font-weight:700;color:#1c1917;margin:0;">App Lock</h2>
            <p style="font-size:12px;color:#a8a29e;margin:4px 0 0;">OFF</p>
          </div>
          <span style="width:44px;height:24px;border-radius:12px;background:#e7e3d8;position:relative;flex-shrink:0;">
            <span style="position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;background:#ffffff;"></span>
          </span>
        </div>
      </div>

      <!-- Disabled state -->
      <div style="border-radius:24px;background:#f4f2ec;padding:20px;text-align:center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <h2 style="font-size:16px;font-weight:700;color:#1c1917;margin:12px 0 0;">App Lock is currently disabled</h2>
        <p style="font-size:14px;line-height:24px;color:#57534e;margin:8px 0 0;">Anyone with access to this device may be able to open your financial records.</p>
        <button style="margin-top:20px;width:100%;min-height:48px;border:none;border-radius:12px;background:#059669;color:#ffffff;font-size:16px;font-weight:600;">Turn On App Lock</button>
      </div>
    </div>
  </div>
</body>
</html>
