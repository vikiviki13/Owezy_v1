<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Change PIN</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Sticky header -->
    <header style="position:absolute;top:47px;left:0;right:0;z-index:20;height:56px;display:flex;align-items:center;background:rgba(251,250,247,0.95);border-bottom:1px solid #e7e3d8;padding:0 12px;box-sizing:border-box;">
      <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <h1 style="font-size:18px;font-weight:600;margin:0 0 0 4px;color:#1c1917;">Change PIN</h1>
    </header>

    <!-- Content -->
    <div style="padding:120px 16px 40px;box-sizing:border-box;">
      <p style="font-size:14px;line-height:24px;color:#57534e;margin:0 0 20px;">Fresh verification is required before changing your App PIN.</p>

      <!-- New PIN card -->
      <div style="border-radius:24px;background:#ffffff;border:1px solid #e7e3d8;padding:20px;">
        <div style="max-width:320px;margin:0 auto;text-align:center;">
          <div style="text-align:center;margin-bottom:20px;">
            <h2 style="font-size:18px;font-weight:700;margin:0;color:#1c1917;">Confirm your PIN</h2>
            <p style="font-size:14px;line-height:20px;color:#57534e;margin:6px 0 0;">Enter your PIN again.</p>
          </div>

          <!-- Dots (3 of 6 entered) -->
          <div style="display:flex;justify-content:center;gap:12px;margin-bottom:20px;">
            <div style="width:12px;height:12px;border-radius:6px;background:#059669;border:1px solid #059669;"></div>
            <div style="width:12px;height:12px;border-radius:6px;background:#059669;border:1px solid #059669;"></div>
            <div style="width:12px;height:12px;border-radius:6px;background:#059669;border:1px solid #059669;"></div>
            <div style="width:12px;height:12px;border-radius:6px;background:transparent;border:1px solid #a8a29e;"></div>
            <div style="width:12px;height:12px;border-radius:6px;background:transparent;border:1px solid #a8a29e;"></div>
            <div style="width:12px;height:12px;border-radius:6px;background:transparent;border:1px solid #a8a29e;"></div>
          </div>

          <!-- Keypad -->
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
            <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;">1</button>
            <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;">2</button>
            <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;">3</button>
            <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;">4</button>
            <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;">5</button>
            <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;">6</button>
            <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;">7</button>
            <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;">8</button>
            <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;">9</button>
            <span></span>
            <button style="min-height:56px;border:none;border-radius:16px;background:#f4f2ec;font-size:20px;font-weight:600;color:#1c1917;">0</button>
            <button style="min-height:56px;border:none;border-radius:16px;background:transparent;display:flex;align-items:center;justify-content:center;">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H11l-8 7 8 7h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><path d="m14 9-4 4"/><path d="m10 9 4 4"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
