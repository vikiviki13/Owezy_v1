<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Quick Add Sheet</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Dimmed underlying screen (simplified) -->
    <div style="position:absolute;inset:0;background:#fbfaf7;">
      <div style="height:47px;"></div>
      <div style="padding:24px 16px;">
        <p style="font-size:14px;color:#a8a29e;margin:0;">Good morning,</p>
        <h1 style="font-size:20px;font-weight:600;margin:0;color:#1c1917;">Arjun Mehta</h1>
      </div>
    </div>

    <!-- Scrim -->
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.4);"></div>

    <!-- Bottom sheet -->
    <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);">
      <!-- Handle -->
      <div style="display:flex;justify-content:center;padding-top:12px;">
        <div style="width:40px;height:6px;border-radius:3px;background:#e7e3d8;"></div>
      </div>

      <!-- Title row -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 4px;">
        <h2 style="font-size:18px;font-weight:600;margin:0;color:#1c1917;">Quick add</h2>
        <button style="padding:6px;border-radius:999px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <!-- Options -->
      <div style="display:flex;flex-direction:column;gap:12px;padding:8px 20px 24px;">
        <button style="display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;text-align:left;">
          <span style="width:44px;height:44px;border-radius:12px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>
          </span>
          <span>
            <span style="display:block;font-size:16px;font-weight:500;color:#1c1917;">Add Expense</span>
            <span style="display:block;font-size:14px;color:#a8a29e;">Record something you paid for a friend</span>
          </span>
        </button>

        <button style="display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;text-align:left;">
          <span style="width:44px;height:44px;border-radius:12px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"/><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 16 6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="2.9"/></svg>
          </span>
          <span>
            <span style="display:block;font-size:16px;font-weight:500;color:#1c1917;">Record Repayment</span>
            <span style="display:block;font-size:14px;color:#a8a29e;">Log money a friend paid you back</span>
          </span>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
