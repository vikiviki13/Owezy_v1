<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Toast Notification</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Home content behind (simplified) -->
    <div style="padding:71px 16px;">
      <p style="font-size:14px;color:#a8a29e;margin:0;">Good morning,</p>
      <h1 style="font-size:20px;font-weight:600;margin:0;color:#1c1917;">Arjun Mehta</h1>
    </div>

    <!-- Toast -->
    <div style="position:absolute;bottom:96px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;">
      <div style="display:flex;align-items:center;gap:8px;background:#1c1917;color:#ffffff;font-size:14px;font-weight:500;padding:12px 16px;border-radius:16px;box-shadow:0 10px 15px -3px rgba(0,0,0,0.25);max-width:384px;width:auto;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
        Priya Sharma added
      </div>
    </div>

    <!-- Bottom navigation -->
    <div style="position:absolute;bottom:0;left:0;right:0;background:#ffffff;border-top:1px solid #e7e3d8;padding-bottom:env(safe-area-inset-bottom,0px);">
      <div style="display:flex;align-items:stretch;justify-content:space-around;">
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span style="font-size:11px;font-weight:500;color:#059669;">Home</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span style="font-size:11px;font-weight:500;color:#a8a29e;">Friends</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span style="font-size:11px;font-weight:500;color:#a8a29e;">Activity</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
          <span style="font-size:11px;font-weight:500;color:#a8a29e;">Groups</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span style="font-size:11px;font-weight:500;color:#a8a29e;">Profile</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
