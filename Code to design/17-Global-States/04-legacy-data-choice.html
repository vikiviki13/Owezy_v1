<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Older Data Found</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;align-items:center;padding:47px 20px;box-sizing:border-box;">
    <section style="background:#ffffff;border:1px solid #e7e3d8;border-radius:24px;padding:24px;width:100%;box-sizing:border-box;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
      <h1 style="font-size:20px;font-weight:700;color:#1c1917;margin:16px 0 0;">Older data found on this device</h1>
      <p style="font-size:14px;line-height:24px;color:#57534e;margin:8px 0 0;">Import it only if it belongs to the account you just signed into. It will never be attached automatically.</p>

      <!-- Note -->
      <div style="border-radius:16px;background:#f4f2ec;padding:16px;margin-top:16px;font-size:12px;line-height:20px;color:#57534e;">Choosing “Start Fresh” removes the unassigned local copy from this browser after a new private account record is created.</div>

      <button style="margin-top:20px;width:100%;min-height:48px;border:none;border-radius:12px;background:#059669;color:#ffffff;font-size:16px;font-weight:600;">This Is My Data — Import</button>
      <button style="margin-top:12px;width:100%;min-height:48px;border:1px solid #e7e3d8;border-radius:12px;background:none;font-size:16px;font-weight:600;color:#1c1917;box-sizing:border-box;">Start Fresh</button>
    </section>
  </div>
</body>
</html>
