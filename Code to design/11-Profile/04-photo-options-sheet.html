<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Profile Photo Options Sheet</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Dimmed edit profile behind -->
  <div style="padding:24px 16px;opacity:0.4;">
    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:28px;">
      <div style="width:88px;height:88px;border-radius:9999px;background:hsl(160,55%,45%);"></div>
    </div>
    <div style="height:48px;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;margin-bottom:20px;"></div>
    <div style="height:48px;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;"></div>
  </div>

  <!-- Overlay scrim -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:#000000;opacity:0.4;"></div>

  <!-- Profile photo bottom sheet -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:24px 24px 0 0;">
    <!-- Grabber -->
    <div style="display:flex;justify-content:center;padding-top:12px;">
      <div style="height:6px;width:40px;border-radius:9999px;background:#e7e3d8;"></div>
    </div>

    <!-- Sheet header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
      <h2 style="font-size:18px;font-weight:600;margin:0;">Profile Photo</h2>
      <div style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </div>
    </div>

    <!-- Options -->
    <div style="padding:4px 20px 24px;">
      <button style="width:100%;min-height:56px;display:flex;align-items:center;gap:12px;border:none;background:transparent;border-bottom:1px solid #e7e3d8;font-family:'Inter',Arial,sans-serif;text-align:left;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        <span style="font-weight:500;color:#1c1917;">Take Photo</span>
      </button>
      <button style="width:100%;min-height:56px;display:flex;align-items:center;gap:12px;border:none;background:transparent;border-bottom:1px solid #e7e3d8;font-family:'Inter',Arial,sans-serif;text-align:left;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        <span style="font-weight:500;color:#1c1917;">Choose Photo</span>
      </button>
      <button style="width:100%;min-height:56px;display:flex;align-items:center;gap:12px;border:none;background:transparent;font-family:'Inter',Arial,sans-serif;text-align:left;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        <span style="font-weight:500;color:#dc2626;">Remove Photo</span>
      </button>
    </div>
  </div>

</div>

</body>
</html>
