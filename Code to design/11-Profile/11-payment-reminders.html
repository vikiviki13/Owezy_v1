<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Payment Reminder Settings</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Sticky header -->
  <div style="position:absolute;top:0;left:0;right:0;z-index:20;height:56px;background:#fbfaf7;border-bottom:1px solid #e7e3d8;display:flex;align-items:center;padding:0 12px;">
    <button style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <h1 style="font-size:18px;font-weight:600;margin-left:4px;">Payment Reminders</h1>
  </div>

  <div style="padding:76px 16px 40px;box-sizing:border-box;">
    <!-- Description -->
    <p style="font-size:14px;line-height:24px;color:#57534e;margin:0 0 20px;">Choose when Tab should remind you to follow up. Messages to friends are never sent automatically.</p>

    <!-- Default reminder timing -->
    <section style="margin-bottom:28px;">
      <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:#a8a29e;padding:0 4px;margin:0 0 8px;">Default Reminder Timing</h3>
      <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;">
        <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:#ffffff;border-bottom:1px solid #e7e3d8;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
          <span style="width:20px;height:20px;border-radius:9999px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
          <span style="flex:1;"><span style="display:block;font-weight:600;font-size:15px;">1 day</span></span>
        </button>
        <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:#ffffff;border-bottom:1px solid #e7e3d8;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
          <span style="width:20px;height:20px;border-radius:9999px;border:2px solid #059669;background:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          <span style="flex:1;"><span style="display:block;font-weight:600;font-size:15px;">3 days</span></span>
        </button>
        <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:#ffffff;border-bottom:1px solid #e7e3d8;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
          <span style="width:20px;height:20px;border-radius:9999px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
          <span style="flex:1;"><span style="display:block;font-weight:600;font-size:15px;">7 days</span></span>
        </button>
        <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:#ffffff;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
          <span style="width:20px;height:20px;border-radius:9999px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
          <span style="flex:1;"><span style="display:block;font-weight:600;font-size:15px;">Custom</span><span style="display:block;font-size:12px;color:#a8a29e;margin-top:4px;">14 days</span></span>
        </button>
      </div>
    </section>

    <!-- Reminder time -->
    <label style="display:block;margin-bottom:28px;">
      <span style="display:block;font-size:14px;font-weight:600;margin-bottom:8px;">Reminder time</span>
      <input type="text" value="09:00 AM" style="width:100%;box-sizing:border-box;min-height:48px;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
    </label>

    <!-- Note box -->
    <div style="border-radius:16px;background:#f4f2ec;padding:16px;margin-bottom:28px;font-size:12px;line-height:20px;color:#57534e;">
      Reminders notify you—the app owner—to take action. WhatsApp sharing always requires you to tap and send.
    </div>

    <!-- Save -->
    <button style="width:100%;min-height:48px;border-radius:12px;background:#059669;color:#ffffff;font-weight:600;border:none;font-family:'Inter',Arial,sans-serif;">Save Reminder Settings</button>

  </div>
</div>

</body>
</html>
