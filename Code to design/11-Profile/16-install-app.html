<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Install App Settings</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Sticky header -->
  <div style="position:absolute;top:0;left:0;right:0;z-index:20;height:56px;background:#fbfaf7;border-bottom:1px solid #e7e3d8;display:flex;align-items:center;padding:0 12px;">
    <button style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <h1 style="font-size:18px;font-weight:600;margin-left:4px;">Install App</h1>
  </div>

  <div style="padding:76px 16px 40px;box-sizing:border-box;">

    <!-- Install card -->
    <div style="border-radius:24px;background:#ffffff;border:1px solid #e7e3d8;padding:24px;text-align:center;margin-top:16px;">
      <!-- Icon -->
      <span style="width:64px;height:64px;border-radius:16px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;margin:0 auto;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>
      </span>
      <h2 style="font-size:20px;font-weight:700;margin-top:20px;">Install Tab</h2>
      <p style="font-size:14px;line-height:24px;color:#57534e;margin-top:8px;">Install this app on your device for quicker access.</p>

      <!-- Installed state badge -->
      <div style="margin-top:24px;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;background:#ecfdf5;color:#059669;font-weight:600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> App Installed
      </div>
    </div>

  </div>
</div>

</body>
</html>
