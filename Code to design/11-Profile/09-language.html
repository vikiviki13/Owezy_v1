<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Language Settings</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Sticky header -->
  <div style="position:absolute;top:0;left:0;right:0;z-index:20;height:56px;background:#fbfaf7;border-bottom:1px solid #e7e3d8;display:flex;align-items:center;padding:0 12px;">
    <button style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <h1 style="font-size:18px;font-weight:600;margin-left:4px;">Language</h1>
  </div>

  <div style="padding:76px 16px 40px;box-sizing:border-box;">
    <!-- Description -->
    <p style="font-size:14px;line-height:24px;color:#57534e;margin:0 0 20px;">Choose the language used throughout the app.</p>

    <!-- Available languages -->
    <section style="margin-bottom:16px;">
      <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:#a8a29e;padding:0 4px;margin:0 0 8px;">Available Languages</h3>
      <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;">
        <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:#ffffff;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
          <span style="width:20px;height:20px;border-radius:9999px;border:2px solid #059669;background:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          <span style="flex:1;">
            <span style="display:block;font-weight:600;font-size:15px;">English</span>
            <span style="display:block;font-size:12px;color:#a8a29e;margin-top:4px;">English</span>
          </span>
        </button>
      </div>
    </section>

    <!-- Footnote -->
    <p style="font-size:12px;line-height:20px;color:#a8a29e;margin:0;padding:0 4px;">More languages are coming later. Tab's interface is prepared for localization.</p>

  </div>
</div>

</body>
</html>
