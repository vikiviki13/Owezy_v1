<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Export Data Settings</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Sticky header -->
  <div style="position:absolute;top:0;left:0;right:0;z-index:20;height:56px;background:#fbfaf7;border-bottom:1px solid #e7e3d8;display:flex;align-items:center;padding:0 12px;">
    <button style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <h1 style="font-size:18px;font-weight:600;margin-left:4px;">Export Your Data</h1>
  </div>

  <div style="padding:76px 16px 40px;box-sizing:border-box;">
    <!-- Description -->
    <p style="font-size:14px;line-height:24px;color:#57534e;margin:0 0 20px;">Export and download your financial information.</p>

    <!-- Date range -->
    <section style="margin-bottom:28px;">
      <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:#a8a29e;padding:0 4px;margin:0 0 8px;">Date Range</h3>
      <select style="width:100%;box-sizing:border-box;min-height:48px;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
        <option>All Time</option>
        <option>Today</option>
        <option>This Week</option>
        <option>This Month</option>
        <option>Last Month</option>
        <option>Custom Date Range</option>
      </select>
    </section>

    <!-- Format cards -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px;">
      <!-- CSV selected -->
      <button style="position:relative;border-radius:16px;border:2px solid #059669;background:#ecfdf5;padding:16px;text-align:left;min-height:144px;font-family:'Inter',Arial,sans-serif;width:100%;box-sizing:border-box;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:16px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h2"/><path d="M14 13h2"/><path d="M8 17h2"/><path d="M14 17h2"/></svg>
        <p style="font-weight:700;margin:0;">Export Report</p>
        <p style="font-size:12px;line-height:20px;color:#a8a29e;margin-top:4px;">Simple expense and balance report.</p>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;right:12px;top:12px;"><polyline points="20 6 9 17 4 12"/></svg>
      </button>

      <!-- JSON -->
      <button style="position:relative;border-radius:16px;border:2px solid #e7e3d8;background:#ffffff;padding:16px;text-align:left;min-height:144px;font-family:'Inter',Arial,sans-serif;width:100%;box-sizing:border-box;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:16px;"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9c-1.5 0-2 .8-2 2s-.5 2-2 2"/><path d="M10 19c-1.5 0-2-.8-2-2"/></svg>
        <p style="font-weight:700;margin:0;">Full Backup</p>
        <p style="font-size:12px;line-height:20px;color:#a8a29e;margin-top:4px;">Complete backup for restoring your data.</p>
      </button>

      <!-- PDF (spans full width in real app grid) -->
      <button style="grid-column:span 2;position:relative;border-radius:16px;border:2px solid #e7e3d8;background:#ffffff;padding:16px;text-align:left;min-height:120px;font-family:'Inter',Arial,sans-serif;width:100%;box-sizing:border-box;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:16px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h2"/><path d="M14 13h2"/><path d="M8 17h2"/><path d="M14 17h2"/></svg>
        <p style="font-weight:700;margin:0;">Financial Statement</p>
        <p style="font-size:12px;line-height:20px;color:#a8a29e;margin-top:4px;">Simple summary for viewing or sharing.</p>
      </button>
    </div>

    <!-- Summary note -->
    <div style="border-radius:16px;background:#f4f2ec;padding:16px;margin-bottom:28px;font-size:12px;line-height:20px;color:#57534e;">
      All time. Includes financial summaries, friends, balances, expenses, repayments, categories, and safe backup metadata. Authentication and security credentials are never exported.
    </div>

    <!-- Download button -->
    <button style="width:100%;min-height:48px;border-radius:12px;background:#059669;color:#ffffff;font-weight:600;border:none;font-family:'Inter',Arial,sans-serif;">Download CSV</button>

  </div>
</div>

</body>
</html>
