<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notification Settings</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Sticky header -->
  <div style="position:absolute;top:0;left:0;right:0;z-index:20;height:56px;background:#fbfaf7;border-bottom:1px solid #e7e3d8;display:flex;align-items:center;padding:0 12px;">
    <button style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <h1 style="font-size:18px;font-weight:600;margin-left:4px;">Notifications</h1>
  </div>

  <div style="padding:76px 16px 40px;box-sizing:border-box;">
    <!-- Description -->
    <p style="font-size:14px;line-height:24px;color:#57534e;margin:0 0 20px;">Control the reminders and important updates you receive.</p>

    <!-- Enable browser notifications button -->
    <button style="width:100%;min-height:48px;border-radius:12px;background:#ecfdf5;color:#059669;font-weight:600;border:none;margin-bottom:24px;font-family:'Inter',Arial,sans-serif;">Enable browser notifications</button>

    <!-- Notifications section -->
    <section style="margin-bottom:28px;">
      <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:#a8a29e;padding:0 4px;margin:0 0 8px;">Notifications</h3>
      <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;">
        <div style="min-height:72px;padding:14px 16px;display:flex;align-items:center;gap:16px;">
          <label style="min-width:0;flex:1;">
            <span style="display:block;font-size:15px;font-weight:500;line-height:20px;">Allow Notifications</span>
          </label>
          <!-- Switch checked -->
          <span style="width:44px;height:24px;background:#059669;border-radius:9999px;display:inline-flex;align-items:center;padding:2px;flex-shrink:0;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:9999px;background:#ffffff;margin-left:auto;"></span>
          </span>
        </div>
      </div>
    </section>

    <!-- Categories section -->
    <section style="margin-bottom:28px;">
      <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;color:#a8a29e;padding:0 4px;margin:0 0 8px;">Categories</h3>
      <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;">
        <div style="min-height:72px;padding:14px 16px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #e7e3d8;">
          <label style="min-width:0;flex:1;">
            <span style="display:block;font-size:15px;font-weight:500;line-height:20px;">Payment Reminders</span>
            <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;margin-top:4px;">Notify me when I schedule a reminder for a friend.</span>
          </label>
          <span style="width:44px;height:24px;background:#059669;border-radius:9999px;display:inline-flex;align-items:center;padding:2px;flex-shrink:0;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:9999px;background:#ffffff;margin-left:auto;"></span>
          </span>
        </div>
        <div style="min-height:72px;padding:14px 16px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #e7e3d8;">
          <label style="min-width:0;flex:1;">
            <span style="display:block;font-size:15px;font-weight:500;line-height:20px;">Pending Balance Reminders</span>
            <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;margin-top:4px;">Remind me about long-pending balances.</span>
          </label>
          <span style="width:44px;height:24px;background:#e7e3d8;border-radius:9999px;display:inline-flex;align-items:center;padding:2px;flex-shrink:0;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:9999px;background:#ffffff;"></span>
          </span>
        </div>
        <div style="min-height:72px;padding:14px 16px;display:flex;align-items:center;gap:16px;">
          <label style="min-width:0;flex:1;">
            <span style="display:block;font-size:15px;font-weight:500;line-height:20px;">App Updates</span>
            <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;margin-top:4px;">Important product information. Marketing is off by default.</span>
          </label>
          <span style="width:44px;height:24px;background:#059669;border-radius:9999px;display:inline-flex;align-items:center;padding:2px;flex-shrink:0;box-sizing:border-box;">
            <span style="width:20px;height:20px;border-radius:9999px;background:#ffffff;margin-left:auto;"></span>
          </span>
        </div>
      </div>
    </section>

    <!-- Save -->
    <button style="width:100%;min-height:48px;border-radius:12px;background:#059669;color:#ffffff;font-weight:600;border:none;font-family:'Inter',Arial,sans-serif;">Save Preferences</button>

  </div>
</div>

</body>
</html>
