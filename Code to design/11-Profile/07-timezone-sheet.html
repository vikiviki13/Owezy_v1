<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Time Zone Bottom Sheet</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Dimmed date-time page behind -->
  <div style="padding:76px 16px 40px;opacity:0.4;box-sizing:border-box;">
    <div style="border-radius:16px;background:#ecfdf5;border:1px solid #e7e3d8;height:140px;margin-bottom:28px;"></div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:220px;margin-bottom:28px;"></div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:120px;"></div>
  </div>

  <!-- Overlay scrim -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:#000000;opacity:0.4;"></div>

  <!-- Time zone bottom sheet -->
  <div style="position:absolute;left:0;right:0;bottom:0;top:420px;background:#ffffff;border-radius:24px 24px 0 0;">
    <!-- Grabber -->
    <div style="display:flex;justify-content:center;padding-top:12px;">
      <div style="height:6px;width:40px;border-radius:9999px;background:#e7e3d8;"></div>
    </div>

    <!-- Sheet header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
      <h2 style="font-size:18px;font-weight:600;margin:0;">Time Zone</h2>
      <div style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </div>
    </div>

    <!-- Options list -->
    <div style="padding:4px 0 24px;background:#ffffff;border-radius:0 0 0 0;">
      <!-- Automatic selected -->
      <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:#ffffff;border-bottom:1px solid #f4f2ec;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
        <span style="width:20px;height:20px;border-radius:9999px;border:2px solid #059669;background:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span style="flex:1;">
          <span style="display:block;font-weight:600;font-size:15px;">Automatic</span>
          <span style="display:block;font-size:12px;color:#a8a29e;margin-top:4px;">Asia/Kolkata (GMT+5:30)</span>
        </span>
      </button>
      <!-- Manual options -->
      <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:#ffffff;border-bottom:1px solid #f4f2ec;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
        <span style="width:20px;height:20px;border-radius:9999px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
        <span style="flex:1;">
          <span style="display:block;font-weight:600;font-size:15px;">Asia/Kolkata</span>
          <span style="display:block;font-size:12px;color:#a8a29e;margin-top:4px;">GMT+5:30</span>
        </span>
      </button>
      <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:#ffffff;border-bottom:1px solid #f4f2ec;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
        <span style="width:20px;height:20px;border-radius:9999px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
        <span style="flex:1;">
          <span style="display:block;font-weight:600;font-size:15px;">Europe/London</span>
          <span style="display:block;font-size:12px;color:#a8a29e;margin-top:4px;">GMT+1</span>
        </span>
      </button>
      <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:#ffffff;border-bottom:1px solid #f4f2ec;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
        <span style="width:20px;height:20px;border-radius:9999px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
        <span style="flex:1;">
          <span style="display:block;font-weight:600;font-size:15px;">America/New_York</span>
          <span style="display:block;font-size:12px;color:#a8a29e;margin-top:4px;">GMT-4</span>
        </span>
      </button>
      <button style="width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 16px;border:none;background:#ffffff;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
        <span style="width:20px;height:20px;border-radius:9999px;border:2px solid #e7e3d8;flex-shrink:0;"></span>
        <span style="flex:1;">
          <span style="display:block;font-weight:600;font-size:15px;">Asia/Singapore</span>
          <span style="display:block;font-size:12px;color:#a8a29e;margin-top:4px;">GMT+8</span>
        </span>
      </button>
    </div>
  </div>

</div>

</body>
</html>
