<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quick Add Bottom Sheet</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Dimmed home content behind -->
  <div style="padding:24px 16px 120px;opacity:0.4;">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px;">
      <div>
        <p style="font-size:14px;color:#a8a29e;margin:0;">Good evening,</p>
        <h1 style="font-size:20px;font-weight:600;margin:0;">Alex Sharma</h1>
      </div>
    </div>
    <div style="border-radius:24px;background:#059669;color:#ffffff;padding:24px;margin-bottom:32px;">
      <p style="font-size:14px;font-weight:500;color:rgba(255,255,255,0.8);letter-spacing:0.05em;text-transform:uppercase;margin:0;">You'll get back</p>
      <p style="font-size:36px;font-weight:800;margin:4px 0 0;">₹12,480</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:32px;">
      <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:88px;"></div>
      <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:88px;"></div>
      <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:88px;"></div>
    </div>
    <div style="height:180px;background:#ffffff;border-radius:16px;border:1px solid #e7e3d8;"></div>
  </div>

  <!-- Floating add button (behind overlay) -->
  <div style="position:absolute;bottom:88px;right:20px;width:56px;height:56px;border-radius:9999px;background:#059669;display:flex;align-items:center;justify-content:center;opacity:0.4;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </div>

  <!-- Overlay scrim -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:#000000;opacity:0.4;"></div>

  <!-- Quick add bottom sheet -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:24px 24px 0 0;">
    <!-- Grabber -->
    <div style="display:flex;justify-content:center;padding-top:12px;">
      <div style="height:6px;width:40px;border-radius:9999px;background:#e7e3d8;"></div>
    </div>

    <!-- Sheet header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 4px;">
      <h2 style="font-size:18px;font-weight:600;margin:0;">Quick add</h2>
      <div style="width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </div>
    </div>

    <!-- Options -->
    <div style="padding:8px 20px 24px;display:flex;flex-direction:column;gap:12px;">
      <!-- Add Expense option -->
      <button style="display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;text-align:left;font-family:'Inter',Arial,sans-serif;">
        <span style="width:44px;height:44px;border-radius:12px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>
        </span>
        <span>
          <span style="display:block;font-weight:500;color:#1c1917;">Add Expense</span>
          <span style="display:block;font-size:14px;color:#a8a29e;">Record something you paid for a friend</span>
        </span>
      </button>

      <!-- Record Repayment option -->
      <button style="display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;text-align:left;font-family:'Inter',Arial,sans-serif;">
        <span style="width:44px;height:44px;border-radius:12px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"/><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 16 6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="3"/></svg>
        </span>
        <span>
          <span style="display:block;font-weight:500;color:#1c1917;">Record Repayment</span>
          <span style="display:block;font-size:14px;color:#a8a29e;">Log money a friend paid you back</span>
        </span>
      </button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-top:1px solid #e7e3d8;padding-bottom:8px;z-index:-1;">
    <div style="display:flex;align-items:stretch;justify-content:space-around;">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span style="font-size:11px;font-weight:500;color:#059669;">Home</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Friends</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Activity</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Groups</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Profile</span>
      </div>
    </div>
  </nav>

</div>

</body>
</html>
