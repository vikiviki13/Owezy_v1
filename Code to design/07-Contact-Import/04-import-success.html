<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contact Import - Success</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;align-items:center;padding:47px 20px;box-sizing:border-box;">
    <!-- Success state -->
    <main style="width:100%;max-width:384px;text-align:center;">
      <span style="margin:0 auto 20px;width:64px;height:64px;border-radius:32px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
      </span>
      <h1 style="font-size:24px;font-weight:700;color:#1c1917;margin:0;">4 friends added</h1>
      <p style="font-size:14px;color:#57534e;margin:8px 0 0;line-height:1.5;">They're ready for expenses and payments.</p>

      <div style="margin-top:32px;display:flex;flex-direction:column;gap:12px;">
        <button style="min-height:48px;border:none;border-radius:12px;background:#059669;color:#ffffff;font-size:16px;font-weight:600;">View Friends</button>
        <button style="min-height:48px;border-radius:12px;border:1px solid #e7e3d8;background:#ffffff;color:#1c1917;font-size:16px;font-weight:600;">Add Expense</button>
        <button style="min-height:44px;background:none;border:none;font-size:14px;font-weight:600;color:#57534e;">Done</button>
      </div>
    </main>
  </div>
</body>
</html>
