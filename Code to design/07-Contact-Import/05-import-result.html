<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contact Import - Result</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <div style="height:47px;"></div>

    <!-- Content -->
    <main style="padding:24px 16px 40px;">
      <!-- Back -->
      <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;margin-left:-4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>

      <!-- Heading -->
      <div style="margin-top:12px;">
        <span style="width:56px;height:56px;border-radius:28px;background:#fffbeb;display:flex;align-items:center;justify-content:center;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        </span>
        <h1 style="font-size:24px;font-weight:700;color:#1c1917;margin:20px 0 0;">2 of 4 friends added</h1>
        <p style="font-size:14px;color:#57534e;margin:8px 0 0;line-height:1.5;">The friends below still need your attention. Everyone else remains added.</p>
      </div>

      <!-- Failure cards -->
      <div style="margin-top:24px;display:flex;flex-direction:column;gap:12px;">
        <div style="border:1px solid #e7e3d8;background:#ffffff;border-radius:16px;padding:16px;">
          <div style="display:flex;align-items:flex-start;gap:12px;">
            <div style="width:42px;height:42px;border-radius:21px;background:#B2345E;color:#ffffff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;">AT</div>
            <div style="flex:1;min-width:0;">
              <p style="font-weight:600;color:#1c1917;margin:0;font-size:16px;">Anita Tiwari couldn't be added</p>
              <p style="font-size:14px;line-height:20px;color:#dc2626;margin:4px 0 0;">A friend with this WhatsApp number already exists in your account.</p>
            </div>
          </div>
          <div style="margin-top:12px;display:flex;gap:8px;padding-left:54px;">
            <button style="min-height:44px;padding:0 16px;border-radius:12px;border:1px solid #e7e3d8;background:none;font-size:14px;font-weight:600;color:#1c1917;">Fix</button>
            <button style="min-height:44px;padding:0 16px;border:none;border-radius:12px;background:#ecfdf5;color:#047857;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
              Try Again
            </button>
          </div>
        </div>

        <div style="border:1px solid #e7e3d8;background:#ffffff;border-radius:16px;padding:16px;">
          <div style="display:flex;align-items:flex-start;gap:12px;">
            <div style="width:42px;height:42px;border-radius:21px;background:#3488B2;color:#ffffff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;">RD</div>
            <div style="flex:1;min-width:0;">
              <p style="font-weight:600;color:#1c1917;margin:0;font-size:16px;">Rohit Desai couldn't be added</p>
              <p style="font-size:14px;line-height:20px;color:#dc2626;margin:4px 0 0;">WhatsApp number is required to add a friend from contacts.</p>
            </div>
          </div>
          <div style="margin-top:12px;display:flex;gap:8px;padding-left:54px;">
            <button style="min-height:44px;padding:0 16px;border-radius:12px;border:1px solid #e7e3d8;background:none;font-size:14px;font-weight:600;color:#1c1917;">Fix</button>
            <button style="min-height:44px;padding:0 16px;border:none;border-radius:12px;background:#ecfdf5;color:#047857;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
              Try Again
            </button>
          </div>
        </div>
      </div>

      <!-- Continue -->
      <button style="margin-top:24px;min-height:48px;width:100%;border:none;border-radius:12px;background:#059669;color:#ffffff;font-size:16px;font-weight:600;">View added friends</button>
    </main>
  </div>
</body>
</html>
