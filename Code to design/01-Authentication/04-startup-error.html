<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Could Not Open Your Data</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;display:flex;align-items:center;justify-content:center;padding:0 20px;box-sizing:border-box;">

  <!-- Error card -->
  <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:24px;padding:24px;width:100%;max-width:390px;text-align:center;">
    <!-- Icon -->
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 12px;display:block;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <!-- Title -->
    <h1 style="font-size:20px;font-weight:700;margin:0 0 8px;">Could not open your data</h1>
    <!-- Message -->
    <p style="font-size:14px;color:#57534e;margin:0 0 16px;">Your session has expired. Please sign in again.</p>
    <!-- Hint -->
    <p style="font-size:12px;color:#a8a29e;margin:0;">Check your environment variables and run supabase/schema.sql in the Supabase SQL Editor.</p>
  </div>

</div>

</body>
</html>
