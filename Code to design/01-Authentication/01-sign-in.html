<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign In</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:24px 20px 32px;box-sizing:border-box;">

  <!-- Background glow -->
  <div style="position:absolute;top:-40px;left:35px;width:320px;height:320px;border-radius:9999px;background:#ecfdf5;opacity:0.55;"></div>

  <!-- Content column -->
  <div style="position:relative;display:flex;flex-direction:column;flex:1;justify-content:center;width:350px;margin:0 auto;">

    <!-- Illustration scene -->
    <div style="position:relative;width:100%;height:140px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
      <!-- Background blob -->
      <div style="position:absolute;width:150px;height:150px;border-radius:9999px;background:#ecfdf5;"></div>

      <!-- Dotted ring -->
      <svg width="180" height="180" viewBox="0 0 180 180" style="position:absolute;">
        <circle cx="90" cy="90" r="82" fill="none" stroke="#d1fae5" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round"/>
      </svg>

      <!-- Floating shield badge top right -->
      <div style="position:absolute;top:8px;right:48px;width:34px;height:34px;background:#059669;border-radius:9999px;display:flex;align-items:center;justify-content:center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>

      <!-- 256-bit chip bottom left -->
      <div style="position:absolute;bottom:10px;left:40px;">
        <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:10px;padding:5px 8px;display:flex;align-items:center;gap:5px;">
          <span style="width:14px;height:14px;background:#ecfdf5;border-radius:4px;display:flex;align-items:center;justify-content:center;">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <span style="font-size:10px;font-weight:600;color:#1c1917;">256-bit</span>
        </div>
      </div>

      <!-- Accent dots -->
      <div style="position:absolute;top:24px;left:56px;width:7px;height:7px;background:#a7f3d0;border-radius:9999px;"></div>
      <div style="position:absolute;bottom:24px;right:54px;width:5px;height:5px;background:#e7e3d8;border-radius:9999px;"></div>

      <!-- Cloud sync stub card behind -->
      <div style="position:absolute;width:140px;height:66px;background:#ecfdf5;border:1px solid #d1fae5;border-radius:14px;left:118px;top:44px;"></div>

      <!-- Main cloud sync card -->
      <div style="position:relative;width:172px;height:92px;background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;">
        <!-- Top status row -->
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:5px;">
            <div style="width:6px;height:6px;background:#059669;border-radius:9999px;"></div>
            <span style="font-size:9.5px;font-weight:600;color:#57534e;">Cloud Synced</span>
          </div>
          <span style="font-size:9px;font-weight:600;color:#059669;background:#ecfdf5;border:1px solid #d1fae5;padding:2px 6px;border-radius:6px;">Live</span>
        </div>
        <!-- Sync graphic -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px;">
          <div style="width:28px;height:28px;background:#fbfaf7;border:1px solid #e7e3d8;border-radius:8px;display:flex;align-items:center;justify-content:center;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>
          </div>
          <div style="display:flex;align-items:center;gap:3px;">
            <div style="width:16px;height:1.5px;background:#a7f3d0;"></div>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            <div style="width:16px;height:1.5px;background:#a7f3d0;"></div>
          </div>
          <div style="width:28px;height:28px;background:#ecfdf5;border:1px solid #d1fae5;border-radius:8px;display:flex;align-items:center;justify-content:center;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Logo and app name -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <div style="width:48px;height:48px;border-radius:16px;background:#ecfdf5;border:1px solid #d1fae5;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0-4 2 2 0 0 0 0 4z"/></svg>
      </div>
      <div>
        <h1 style="font-size:28px;font-weight:700;color:#1c1917;line-height:1.15;letter-spacing:-0.02em;margin:0;">Owezy</h1>
        <p style="font-size:14px;color:#a8a29e;margin:2px 0 0;">You Pay, We Remember.</p>
      </div>
    </div>

    <!-- Card -->
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:24px;padding:20px;">
      <!-- Mode toggle -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#f4f2ec;border-radius:16px;padding:4px;margin-bottom:24px;">
        <div style="border-radius:12px;padding:10px 0;font-size:12px;font-weight:600;text-align:center;background:#ffffff;color:#1c1917;">Sign in</div>
        <div style="border-radius:12px;padding:10px 0;font-size:12px;font-weight:600;text-align:center;color:#57534e;">Create account</div>
      </div>

      <!-- Email field -->
      <label style="display:block;margin-bottom:16px;">
        <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;margin-bottom:6px;">Email</span>
        <div style="position:relative;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:14px;top:17px;"><rect width="20" height="16" x="2" y="4" rx="2"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="text" placeholder="you@example.com" style="width:100%;box-sizing:border-box;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px 14px 12px 42px;font-size:14px;color:#1c1917;font-family:'Inter',Arial,sans-serif;">
        </div>
      </label>

      <!-- Password field -->
      <label style="display:block;margin-bottom:20px;">
        <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;margin-bottom:6px;">Password</span>
        <div style="position:relative;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:14px;top:17px;"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="text" placeholder="At least 8 characters" style="width:100%;box-sizing:border-box;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px 14px 12px 42px;font-size:14px;color:#1c1917;font-family:'Inter',Arial,sans-serif;">
        </div>
      </label>

      <!-- Submit button -->
      <button style="width:100%;background:#059669;color:#ffffff;font-size:16px;font-weight:500;border:none;border-radius:16px;padding:16px 0;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',Arial,sans-serif;">
        Sign in
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>

    <!-- Footer note -->
    <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <p style="font-size:12px;text-align:center;color:#a8a29e;line-height:1.65;margin:0;">Your account keeps your expense data private and synced across devices.</p>
    </div>

  </div>
</div>

</body>
</html>
