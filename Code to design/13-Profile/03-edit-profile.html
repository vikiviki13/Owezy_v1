<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Edit Profile</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:Inter,ui-sans-serif,system-ui,sans-serif;">
  <div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
    <!-- Sticky header -->
    <header style="position:absolute;top:47px;left:0;right:0;z-index:20;height:56px;display:flex;align-items:center;background:rgba(251,250,247,0.95);border-bottom:1px solid #e7e3d8;padding:0 12px;box-sizing:border-box;">
      <button style="width:44px;height:44px;border-radius:22px;background:none;border:none;display:flex;align-items:center;justify-content:center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <h1 style="font-size:18px;font-weight:600;margin:0 0 0 4px;color:#1c1917;">Edit Profile</h1>
    </header>

    <!-- Content -->
    <div style="padding:120px 16px 96px;box-sizing:border-box;">
      <!-- Avatar -->
      <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:28px;">
        <div style="position:relative;">
          <div style="width:88px;height:88px;border-radius:44px;background:#34B288;color:#ffffff;font-size:32px;font-weight:600;display:flex;align-items:center;justify-content:center;">AM</div>
          <span style="position:absolute;right:-4px;bottom:-4px;width:36px;height:36px;border-radius:18px;background:#059669;border:4px solid #fbfaf7;display:flex;align-items:center;justify-content:center;box-sizing:border-box;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          </span>
        </div>
        <span style="margin-top:12px;font-size:14px;font-weight:600;color:#059669;min-height:36px;">Change photo</span>
      </div>

      <!-- Full name -->
      <label style="display:block;margin-bottom:20px;">
        <span style="display:block;font-size:14px;font-weight:600;color:#1c1917;margin-bottom:8px;">Full Name <span style="color:#dc2626;">*</span></span>
        <input type="text" value="Arjun Mehta" style="width:100%;min-height:48px;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
      </label>

      <!-- Email -->
      <label style="display:block;margin-bottom:20px;">
        <span style="display:block;font-size:14px;font-weight:600;color:#1c1917;margin-bottom:8px;">Email</span>
        <input type="email" value="arjun.mehta@example.com" style="width:100%;min-height:48px;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
        <span style="display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;color:#059669;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></svg>
          Verified
        </span>
      </label>

      <!-- Phone -->
      <label style="display:block;margin-bottom:112px;">
        <span style="display:block;font-size:14px;font-weight:600;color:#1c1917;margin-bottom:8px;">Phone Number <span style="font-weight:400;color:#a8a29e;">(optional)</span></span>
        <span style="display:flex;">
          <span style="height:48px;padding:0 12px;display:flex;align-items:center;border:1px solid #e7e3d8;border-right:none;border-radius:12px 0 0 12px;background:#f4f2ec;font-size:14px;font-weight:500;color:#1c1917;box-sizing:border-box;">+91</span>
          <input type="tel" value="98765 43210" placeholder="98765 43210" style="flex:1;min-height:48px;background:#ffffff;border:1px solid #e7e3d8;border-radius:0 12px 12px 0;padding:11px 14px;font-size:14px;color:#1c1917;outline:none;box-sizing:border-box;">
        </span>
      </label>

      <!-- Fixed save button -->
      <aside style="position:absolute;left:0;right:0;bottom:0;z-index:20;background:rgba(251,250,247,0.95);border-top:1px solid #e7e3d8;padding:16px;box-sizing:border-box;">
        <button style="width:100%;min-height:48px;border:none;border-radius:12px;background:#059669;color:#ffffff;font-size:16px;font-weight:600;">Save Changes</button>
      </aside>
    </div>
  </div>
</body>
</html>
