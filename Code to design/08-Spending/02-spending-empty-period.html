<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Spending Overview — Empty Period</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <div style="padding:24px 16px 40px;box-sizing:border-box;">

    <!-- Header -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <button style="width:36px;height:36px;border-radius:9999px;background:#ffffff;border:1px solid #e7e3d8;display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div>
        <h1 style="font-size:20px;font-weight:600;margin:0;">Spending Overview</h1>
        <p style="font-size:14px;color:#a8a29e;margin-top:4px;">Review your spending at month end.</p>
      </div>
    </div>

    <!-- Range chips (custom active) -->
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <span style="flex-shrink:0;border-radius:9999px;padding:6px 12px;font-size:12px;font-weight:500;background:#f4f2ec;color:#57534e;">today</span>
      <span style="flex-shrink:0;border-radius:9999px;padding:6px 12px;font-size:12px;font-weight:500;background:#f4f2ec;color:#57534e;">week</span>
      <span style="flex-shrink:0;border-radius:9999px;padding:6px 12px;font-size:12px;font-weight:500;background:#f4f2ec;color:#57534e;">month</span>
      <span style="flex-shrink:0;border-radius:9999px;padding:6px 12px;font-size:12px;font-weight:500;background:#f4f2ec;color:#57534e;">last month</span>
      <span style="flex-shrink:0;border-radius:9999px;padding:6px 12px;font-size:12px;font-weight:500;background:#059669;color:#ffffff;">custom</span>
    </div>

    <!-- Custom date inputs -->
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <input type="text" value="2026-08-01" style="flex:1;min-width:0;box-sizing:border-box;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:10px 12px;font-size:12px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
      <input type="text" value="2026-08-26" style="flex:1;min-width:0;box-sizing:border-box;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:10px 12px;font-size:12px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
    </div>

    <!-- Date range label -->
    <p style="font-size:12px;color:#a8a29e;margin:0 0 16px;">2026-07-27 → 2026-07-31</p>

    <!-- Summary metric grid (zeros) -->
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;">
      <div style="border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:16px;text-align:left;">
        <p style="font-size:12px;line-height:16px;color:#a8a29e;margin:0;">My actual spending</p>
        <p style="margin-top:8px;font-weight:600;">₹0</p>
      </div>
      <div style="border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:16px;text-align:left;">
        <p style="font-size:12px;line-height:16px;color:#a8a29e;margin:0;">Self spending</p>
        <p style="margin-top:8px;font-weight:600;">₹0</p>
      </div>
      <div style="border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:16px;text-align:left;">
        <p style="font-size:12px;line-height:16px;color:#a8a29e;margin:0;">Spent for friends</p>
        <p style="margin-top:8px;font-weight:600;">₹0</p>
      </div>
      <div style="border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:16px;text-align:left;">
        <p style="font-size:12px;line-height:16px;color:#a8a29e;margin:0;">Paid by friends for me</p>
        <p style="margin-top:8px;font-weight:600;">₹0</p>
      </div>
    </div>

    <!-- Empty statement -->
    <section style="margin-top:32px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <h2 style="font-size:16px;font-weight:600;margin:0;">Your spending statement</h2>
        <span style="font-size:12px;font-weight:600;color:#059669;">Show self only</span>
      </div>
      <div style="border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:20px;text-align:center;font-size:14px;color:#a8a29e;">
        No expenses recorded for this period.
      </div>
    </section>

  </div>
</div>

</body>
</html>
