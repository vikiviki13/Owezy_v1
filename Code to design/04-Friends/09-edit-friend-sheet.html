<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Edit Friend Bottom Sheet</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Dimmed manage screen behind -->
  <div style="padding:24px 16px;opacity:0.4;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <div style="width:36px;height:36px;border-radius:9999px;background:#ffffff;border:1px solid #e7e3d8;"></div>
      <div style="height:20px;width:140px;background:#f4f2ec;border-radius:6px;"></div>
    </div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:120px;margin-bottom:28px;"></div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:200px;"></div>
  </div>

  <!-- Overlay scrim -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:#000000;opacity:0.4;"></div>

  <!-- Edit Friend bottom sheet -->
  <div style="position:absolute;left:0;right:0;bottom:0;top:96px;background:#ffffff;border-radius:24px 24px 0 0;display:flex;flex-direction:column;">
    <!-- Grabber -->
    <div style="display:flex;justify-content:center;padding-top:12px;">
      <div style="height:6px;width:40px;border-radius:9999px;background:#e7e3d8;"></div>
    </div>

    <!-- Sheet header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
      <h2 style="font-size:18px;font-weight:600;margin:0;">Edit Friend</h2>
      <div style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </div>
    </div>

    <!-- Scrollable body -->
    <div style="flex:1;overflow:hidden;padding:4px 20px 24px;display:flex;flex-direction:column;gap:16px;">
      <!-- Photo row -->
      <div style="display:flex;align-items:center;gap:16px;">
        <div style="width:64px;height:64px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#ffffff;background:hsl(160,55%,45%);">JM</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <span style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:#059669;min-height:36px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg> Add photo</span>
        </div>
      </div>

      <!-- Name field -->
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:14px;font-weight:500;color:#57534e;">Name <span style="color:#dc2626;">*</span></span>
        <input type="text" value="Jiya Mehta" style="box-sizing:border-box;width:100%;background:#ffffff;border:1px solid #059669;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
      </label>

      <!-- Nickname field -->
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:14px;font-weight:500;color:#57534e;">Nickname</span>
        <input type="text" value="Jiya" style="box-sizing:border-box;width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
      </label>

      <!-- WhatsApp field -->
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:14px;font-weight:500;color:#57534e;">WhatsApp number</span>
        <input type="text" value="98765 43210" style="box-sizing:border-box;width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
      </label>

      <!-- Phone field -->
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:14px;font-weight:500;color:#57534e;">Phone number</span>
        <input type="text" placeholder="Optional" style="box-sizing:border-box;width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
      </label>

      <!-- Email field -->
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:14px;font-weight:500;color:#57534e;">Email</span>
        <input type="text" placeholder="Optional" style="box-sizing:border-box;width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
      </label>

      <!-- Save button -->
      <button style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;background:#059669;color:#ffffff;font-size:15px;font-weight:500;border:none;border-radius:12px;padding:12px 0;font-family:'Inter',Arial,sans-serif;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Save Changes
      </button>
    </div>
  </div>

</div>

</body>
</html>
