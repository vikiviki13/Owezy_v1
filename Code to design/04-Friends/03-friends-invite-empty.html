<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Friends — Invite Friends (Empty)</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Main content -->
  <div style="padding:24px 16px 120px;">

    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <h1 style="font-size:20px;font-weight:600;margin:0;">Friends</h1>
      <button style="width:44px;height:44px;border-radius:9999px;background:#059669;display:flex;align-items:center;justify-content:center;border:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <!-- Search -->
    <div style="position:relative;margin-bottom:16px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:14px;top:13px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" placeholder="Search friends" style="width:100%;box-sizing:border-box;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:10px 16px 10px 40px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
    </div>

    <!-- Filter tabs -->
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <span style="padding:6px 16px;border-radius:9999px;font-size:14px;font-weight:500;background:#059669;color:#ffffff;">all</span>
      <span style="padding:6px 16px;border-radius:9999px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">pending</span>
      <span style="padding:6px 16px;border-radius:9999px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">settled</span>
    </div>

    <!-- Empty state: invite friends -->
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 24px;">
      <div style="width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;background:#f4f2ec;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <p style="font-weight:500;color:#1c1917;margin:0;">Invite Friends</p>
      <p style="font-size:14px;color:#a8a29e;margin:4px 0 16px;max-width:240px;">Share Owezy with your friends so you can easily manage expenses together.</p>
      <div style="display:flex;flex-direction:column;gap:8px;width:208px;">
        <button style="font-size:14px;font-weight:500;color:#ffffff;background:#059669;padding:8px 16px;border-radius:12px;border:none;font-family:'Inter',Arial,sans-serif;">Share App</button>
        <button style="font-size:14px;font-weight:500;color:#57534e;background:#f4f2ec;padding:8px 16px;border-radius:12px;border:none;font-family:'Inter',Arial,sans-serif;">Add Friend</button>
      </div>
    </div>

  </div>

  <!-- Bottom Navigation (Friends active) -->
  <nav style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-top:1px solid #e7e3d8;padding-bottom:8px;">
    <div style="display:flex;align-items:stretch;justify-content:space-around;">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Home</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span style="font-size:11px;font-weight:500;color:#059669;">Friends</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Activity</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Groups</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span style="font-size:11px;font-weight:500;color:#a8a29e;">Profile</span>
      </div>
    </div>
  </nav>

</div>

</body>
</html>
