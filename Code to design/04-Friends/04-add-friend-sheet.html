<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Add Friend Bottom Sheet</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Dimmed friends list behind -->
  <div style="padding:24px 16px 120px;opacity:0.4;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <h1 style="font-size:20px;font-weight:600;margin:0;">Friends</h1>
      <div style="width:44px;height:44px;border-radius:9999px;background:#059669;"></div>
    </div>
    <div style="height:44px;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;margin-bottom:16px;"></div>
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <div style="padding:6px 16px;border-radius:9999px;font-size:14px;background:#059669;"></div>
      <div style="padding:6px 16px;border-radius:9999px;font-size:14px;background:#f4f2ec;"></div>
      <div style="padding:6px 16px;border-radius:9999px;font-size:14px;background:#f4f2ec;"></div>
    </div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:74px;margin-bottom:8px;"></div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:74px;"></div>
  </div>

  <!-- Overlay scrim -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:#000000;opacity:0.4;"></div>

  <!-- Add Friend bottom sheet -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:24px 24px 0 0;">
    <!-- Grabber -->
    <div style="display:flex;justify-content:center;padding-top:12px;">
      <div style="height:6px;width:40px;border-radius:9999px;background:#e7e3d8;"></div>
    </div>

    <!-- Sheet header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
      <h2 style="font-size:18px;font-weight:600;margin:0;">Add Friend</h2>
      <div style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </div>
    </div>

    <!-- Sheet body -->
    <div style="padding:4px 20px 24px;display:flex;flex-direction:column;gap:16px;">
      <!-- Import from contacts -->
      <button style="min-height:56px;display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:0 16px;text-align:left;font-family:'Inter',Arial,sans-serif;">
        <span style="width:40px;height:40px;border-radius:12px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="10" r="2.5"/><path d="M7.5 17c.8-2 2.5-3 4.5-3s3.7 1 4.5 3"/></svg>
        </span>
        <span style="flex:1;">
          <span style="display:block;font-weight:600;color:#1c1917;">Import from Contacts</span>
          <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Select and review multiple contacts</span>
        </span>
      </button>

      <!-- Divider -->
      <div style="display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#a8a29e;">
        <span style="height:1px;flex:1;background:#e7e3d8;"></span>or add manually<span style="height:1px;flex:1;background:#e7e3d8;"></span>
      </div>

      <!-- Name field -->
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:14px;font-weight:500;color:#57534e;">Name <span style="color:#dc2626;">*</span></span>
        <input type="text" placeholder="e.g. Arun Kumar" value="Meera Nair" style="box-sizing:border-box;width:100%;background:#ffffff;border:1px solid #059669;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
      </label>

      <!-- Nickname field -->
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:14px;font-weight:500;color:#57534e;">Nickname</span>
        <input type="text" placeholder="Optional" style="box-sizing:border-box;width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
      </label>

      <!-- Phone field -->
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:14px;font-weight:500;color:#57534e;">Phone / WhatsApp</span>
        <input type="text" placeholder="e.g. 98765 43210" style="box-sizing:border-box;width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
      </label>

      <!-- Save button -->
      <button style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;background:#059669;color:#ffffff;font-size:15px;font-weight:500;border:none;border-radius:12px;padding:12px 0;font-family:'Inter',Arial,sans-serif;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        Add Friend
      </button>
    </div>
  </div>

</div>

</body>
</html>
