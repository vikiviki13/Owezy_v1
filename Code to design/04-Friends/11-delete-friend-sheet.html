<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Delete Friend Bottom Sheet (Has History)</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Dimmed manage screen behind -->
  <div style="padding:24px 16px;opacity:0.4;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <div style="width:36px;height:36px;border-radius:9999px;background:#ffffff;border:1px solid #e7e3d8;"></div>
      <div style="height:20px;width:140px;background:#f4f2ec;border-radius:6px;"></div>
    </div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:120px;margin-bottom:28px;"></div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:200px;"></div>
  </div>

  <!-- Overlay scrim -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:#000000;opacity:0.4;"></div>

  <!-- Delete Friend bottom sheet -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:24px 24px 0 0;">
    <!-- Grabber -->
    <div style="display:flex;justify-content:center;padding-top:12px;">
      <div style="height:6px;width:40px;border-radius:9999px;background:#e7e3d8;"></div>
    </div>

    <!-- Sheet header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
      <h2 style="font-size:18px;font-weight:600;margin:0;">Delete Friend</h2>
      <div style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </div>
    </div>

    <!-- Body -->
    <div style="padding:4px 20px 24px;">
      <p style="font-size:14px;line-height:24px;color:#57534e;margin:0 0 16px;"><span style="font-weight:600;">Jiya Mehta</span> has financial history. Deleting the profile immediately would also remove it — instead, choose how to proceed.</p>

      <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;">
        <!-- Archive option -->
        <button style="display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:14px 16px;width:100%;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
          <span style="width:36px;height:36px;border-radius:12px;background:#ecfdf5;color:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg></span>
          <span style="flex:1;">
            <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;">Archive Friend</span>
            <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Recommended — keeps all history and balances</span>
          </span>
        </button>

        <!-- Clear data & delete option -->
        <button style="display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid #e7e3d8;background:#ffffff;padding:14px 16px;width:100%;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
          <span style="width:36px;height:36px;border-radius:12px;background:#fef2f2;color:#dc2626;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></span>
          <span style="flex:1;">
            <span style="display:block;font-size:14px;font-weight:500;color:#dc2626;">Clear Data &amp; Delete</span>
            <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Removes the profile and all financial history</span>
          </span>
        </button>
      </div>

      <!-- Cancel -->
      <button style="width:100%;border-radius:12px;border:none;padding:12px 0;margin-top:8px;font-weight:500;color:#57534e;background:transparent;font-family:'Inter',Arial,sans-serif;">Cancel</button>
    </div>
  </div>

</div>

</body>
</html>
