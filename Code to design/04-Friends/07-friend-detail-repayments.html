      <!-- Tabs (repayments active) -->
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <span style="padding:6px 16px;border-radius:9999px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">overview</span>
        <span style="padding:6px 16px;border-radius:9999px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">transactions</span>
        <span style="padding:6px 16px;border-radius:9999px;font-size:14px;font-weight:500;background:#059669;color:#ffffff;">repayments</span>

      <!-- Repayments list -->
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;align-items:center;justify-content:space-between;background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;padding:16px;">
