<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clear All Dues Bottom Sheet</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Dimmed manage screen behind -->
  <div style="padding:24px 16px;opacity:0.4;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <div style="width:36px;height:36px;border-radius:9999px;background:#ffffff;border:1px solid #e7e3d8;"></div>
      <div style="height:20px;width:140px;background:#f4f2ec;border-radius:6px;"></div>
    </div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:120px;margin-bottom:28px;"></div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:200px;"></div>
  </div>

  <!-- Overlay scrim -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:#000000;opacity:0.4;"></div>

  <!-- Clear All Dues bottom sheet -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:24px 24px 0 0;">
    <!-- Grabber -->
    <div style="display:flex;justify-content:center;padding-top:12px;">
      <div style="height:6px;width:40px;border-radius:9999px;background:#e7e3d8;"></div>
    </div>

    <!-- Sheet header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
      <h2 style="font-size:18px;font-weight:600;margin:0;">Clear All Dues</h2>
      <div style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </div>
    </div>

    <!-- Body -->
    <div style="padding:4px 20px 24px;display:flex;flex-direction:column;gap:16px;">
      <!-- Summary box -->
      <div style="border-radius:16px;background:#f4f2ec;padding:16px;">
        <p style="font-size:14px;color:#57534e;margin:0;">Clear <span style="font-weight:700;">₹2,400</span> pending for <span style="font-weight:600;">Jiya Mehta</span>?</p>
        <p style="margin-top:4px;font-size:12px;line-height:20px;color:#a8a29e;">A settlement record will be created. Past expenses and repayments stay in history.</p>
      </div>

      <!-- Settlement date -->
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:14px;font-weight:500;color:#57534e;">Settlement date</span>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div style="display:flex;gap:8px;">
            <span style="flex:1;padding:10px 0;border-radius:12px;font-size:14px;font-weight:500;text-align:center;background:#059669;color:#ffffff;">Today</span>
            <span style="flex:1;padding:10px 0;border-radius:12px;font-size:14px;font-weight:500;text-align:center;background:#f4f2ec;color:#57534e;">Yesterday</span>
            <span style="flex:1;padding:10px 0;border-radius:12px;font-size:14px;font-weight:500;text-align:center;background:#f4f2ec;color:#57534e;">Select Date</span>
          </div>
          <p style="font-size:12px;color:#a8a29e;margin:0;">Today, 26 Aug 2026</p>
        </div>
      </label>

      <!-- Payment method -->
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:14px;font-weight:500;color:#57534e;">Payment method (optional)</span>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          <span style="padding:8px 14px;border-radius:12px;font-size:14px;font-weight:500;background:#059669;color:#ffffff;">UPI</span>
          <span style="padding:8px 14px;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Cash</span>
          <span style="padding:8px 14px;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Bank Transfer</span>
          <span style="padding:8px 14px;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Card</span>
          <span style="padding:8px 14px;border-radius:12px;font-size:14px;font-weight:500;background:#f4f2ec;color:#57534e;">Other</span>
        </div>
      </label>

      <!-- Notes -->
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:14px;font-weight:500;color:#57534e;">Notes (optional)</span>
        <textarea rows="2" placeholder="e.g. Settled outside the app" style="box-sizing:border-box;width:100%;background:#ffffff;border:1px solid #e7e3d8;border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Inter',Arial,sans-serif;color:#1c1917;resize:none;"></textarea>
      </label>

      <!-- Actions -->
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button style="flex:1;border-radius:12px;border:1px solid #e7e3d8;padding:12px 0;font-weight:500;color:#57534e;background:#ffffff;font-family:'Inter',Arial,sans-serif;">Cancel</button>
        <button style="flex:1;border-radius:12px;border:none;padding:12px 0;font-weight:500;background:#059669;color:#ffffff;font-family:'Inter',Arial,sans-serif;">Clear Dues</button>
      </div>
    </div>
  </div>

</div>

</body>
</html>
