<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Manage Friend</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;min-height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <div style="padding:24px 16px 32px;box-sizing:border-box;">

    <!-- Header -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <button style="width:36px;height:36px;border-radius:9999px;background:#ffffff;border:1px solid #e7e3d8;display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <h1 style="font-size:18px;font-weight:600;margin:0;">Manage Friend</h1>
    </div>

    <!-- Friend summary -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <div style="width:52px;height:52px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:#ffffff;background:hsl(160,55%,45%);">JM</div>
      <div style="flex:1;min-width:0;">
        <p style="font-weight:600;margin:0;">Jiya Mehta</p>
        <p style="font-size:12px;color:#a8a29e;margin:2px 0 0;">Known as Jiya</p>
      </div>
      <button style="flex-shrink:0;display:flex;align-items:center;gap:6px;background:#f4f2ec;border:none;border-radius:12px;padding:8px 14px;font-size:14px;font-weight:500;font-family:'Inter',Arial,sans-serif;color:#1c1917;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
        Edit
      </button>
    </div>

    <!-- Friend Information section -->
    <div style="margin-bottom:28px;">
      <p style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#a8a29e;font-weight:500;margin:0 0 8px;">Friend Information</p>
      <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;overflow:hidden;">
        <!-- Row -->
        <button style="display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;border:none;background:#ffffff;border-bottom:1px solid #e7e3d8;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
          <span style="width:36px;height:36px;border-radius:12px;background:#f4f2ec;color:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="10" r="2.5"/><path d="M7.5 17c.8-2 2.5-3 4.5-3s3.7 1 4.5 3"/></svg></span>
          <span style="flex:1;min-width:0;">
            <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;">Edit Profile</span>
            <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Photo, name, nickname, contact details</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <!-- Row -->
        <button style="display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;border:none;background:#ffffff;border-bottom:1px solid #e7e3d8;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
          <span style="width:36px;height:36px;border-radius:12px;background:#f4f2ec;color:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span>
          <span style="flex:1;min-width:0;">
            <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;">WhatsApp Number</span>
            <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">98765 43210</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <!-- Row -->
        <button style="display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;border:none;background:#ffffff;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
          <span style="width:36px;height:36px;border-radius:12px;background:#f4f2ec;color:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
          <span style="flex:1;min-width:0;">
            <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;">Phone</span>
            <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">98765 43210</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <!-- Financial section -->
    <div style="margin-bottom:28px;">
      <p style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#a8a29e;font-weight:500;margin:0 0 8px;">Financial</p>
      <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;overflow:hidden;">
        <!-- Pending card row -->
        <div style="padding:16px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;background:#ffffff;border-bottom:1px solid #e7e3d8;">
          <div>
            <p style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#a8a29e;font-weight:500;margin:0;">Current Pending</p>
            <p style="font-size:24px;font-weight:800;color:#059669;margin:4px 0 0;">₹2,400</p>
          </div>
          <span style="width:44px;height:44px;border-radius:12px;background:#ecfdf5;color:#059669;display:flex;align-items:center;justify-content:center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
          </span>
        </div>
        <!-- Row -->
        <button style="display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;border:none;background:#ffffff;border-bottom:1px solid #e7e3d8;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
          <span style="width:36px;height:36px;border-radius:12px;background:#f4f2ec;color:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          <span style="flex:1;min-width:0;">
            <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;">Clear All Dues</span>
            <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Mark the complete outstanding balance as settled</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <!-- Row -->
        <button style="display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;border:none;background:#ffffff;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
          <span style="width:36px;height:36px;border-radius:12px;background:#f4f2ec;color:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><rect x="4" y="15" width="16" height="6" rx="2"/></svg></span>
          <span style="flex:1;min-width:0;">
            <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;">Export Statement</span>
            <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Share a statement summary over WhatsApp</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <!-- Data section -->
    <div>
      <p style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#a8a29e;font-weight:500;margin:0 0 8px;">Data</p>
      <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;overflow:hidden;">
        <!-- Row -->
        <button style="display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;border:none;background:#ffffff;border-bottom:1px solid #e7e3d8;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
          <span style="width:36px;height:36px;border-radius:12px;background:#f4f2ec;color:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg></span>
          <span style="flex:1;min-width:0;">
            <span style="display:block;font-size:14px;font-weight:500;color:#1c1917;">Archive Friend</span>
            <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Hide from Add Expense while keeping all history</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <!-- Danger row -->
        <button style="display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;border:none;background:#ffffff;border-bottom:1px solid #e7e3d8;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
          <span style="width:36px;height:36px;border-radius:12px;background:#fef2f2;color:#dc2626;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></span>
          <span style="flex:1;min-width:0;">
            <span style="display:block;font-size:14px;font-weight:500;color:#dc2626;">Clear Friend Data</span>
            <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Permanently remove this friend's financial history</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <!-- Danger row -->
        <button style="display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;border:none;background:#ffffff;text-align:left;font-family:'Inter',Arial,sans-serif;box-sizing:border-box;">
          <span style="width:36px;height:36px;border-radius:12px;background:#fef2f2;color:#dc2626;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></span>
          <span style="flex:1;min-width:0;">
            <span style="display:block;font-size:14px;font-weight:500;color:#dc2626;">Delete Friend</span>
            <span style="display:block;font-size:12px;line-height:20px;color:#a8a29e;">Archive first, or clear data and delete</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>

  </div>
</div>

</body>
</html>
