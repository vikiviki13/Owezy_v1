<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Delete Friend Bottom Sheet (No History)</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf7;font-family:'Inter',Arial,sans-serif;color:#1c1917;">

<div style="width:390px;height:844px;margin:0 auto;background:#fbfaf7;position:relative;overflow:hidden;">
  <!-- Dimmed manage screen behind -->
  <div style="padding:24px 16px;opacity:0.4;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <div style="width:36px;height:36px;border-radius:9999px;background:#ffffff;border:1px solid #e7e3d8;"></div>
      <div style="height:20px;width:140px;background:#f4f2ec;border-radius:6px;"></div>
    </div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:120px;margin-bottom:28px;"></div>
    <div style="background:#ffffff;border:1px solid #e7e3d8;border-radius:16px;height:200px;"></div>
  </div>

  <!-- Overlay scrim -->
  <div style="position:absolute;top:0;left:0;right:0;bottom:0;background:#000000;opacity:0.4;"></div>

  <!-- Delete Friend bottom sheet (no history) -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:24px 24px 0 0;">
    <!-- Grabber -->
    <div style="display:flex;justify-content:center;padding-top:12px;">
      <div style="height:6px;width:40px;border-radius:9999px;background:#e7e3d8;"></div>
    </div>

    <!-- Sheet header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;">
      <h2 style="font-size:18px;font-weight:600;margin:0;">Delete Friend</h2>
      <div style="width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </div>
    </div>

    <!-- Body -->
    <div style="padding:4px 20px 24px;">
      <p style="font-size:14px;line-height:24px;color:#57534e;margin:0;">Remove <span style="font-weight:600;">Sameer Patel</span> from your friends list? There is no financial history attached to this profile.</p>

      <!-- Actions -->
      <div style="display:flex;gap:8px;margin-top:20px;">
        <button style="flex:1;border-radius:12px;border:1px solid #e7e3d8;padding:12px 0;font-weight:500;color:#57534e;background:#ffffff;font-family:'Inter',Arial,sans-serif;">Cancel</button>
        <button style="flex:1;border-radius:12px;border:none;padding:12px 0;font-weight:500;background:#dc2626;color:#ffffff;font-family:'Inter',Arial,sans-serif;">Delete</button>
      </div>
    </div>
  </div>

</div>

</body>
</html>
