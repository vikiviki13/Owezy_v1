<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#059669" />
    <meta name="description" content="Track what friends owe you. You Pay, We Remember." />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <title>Owezy — Friend Expense Tracker</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem;
        background: #fbfaf7;
        color: #1c1917;
        transition: opacity 400ms ease;
        -webkit-user-select: none;
        user-select: none;
      }
      html.dark #boot-splash { background: #14120f; color: #f5f4f0; }
      #boot-splash.is-hiding { opacity: 0; pointer-events: none; }

      .boot-logo-container {
        position: relative;
        width: 5.75rem;
        height: 5.75rem;
        display: grid;
        place-items: center;
        margin-bottom: 0.25rem;
      }
      .boot-ambient-glow {
        position: absolute;
        inset: -12px;
        border-radius: 2rem;
        background: radial-gradient(circle, rgba(5, 150, 105, 0.4) 0%, transparent 70%);
        filter: blur(14px);
        opacity: 0.75;
        animation: boot-breathe 2.4s ease-in-out infinite alternate;
        pointer-events: none;
      }
      html.dark .boot-ambient-glow {
        background: radial-gradient(circle, rgba(16, 185, 129, 0.45) 0%, transparent 70%);
      }
      .boot-ring-wave {
        position: absolute;
        inset: 0;
        border-radius: 1.625rem;
        border: 2px solid rgba(5, 150, 105, 0.5);
        pointer-events: none;
      }
      html.dark .boot-ring-wave { border-color: rgba(16, 185, 129, 0.5); }
      .boot-ring-1 {
        animation: boot-wave 2.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
      .boot-ring-2 {
        animation: boot-wave 2.2s 1.1s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
      .boot-logo-card {
        position: relative;
        width: 5.25rem;
        height: 5.25rem;
        border-radius: 1.5rem;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        box-shadow: 0 16px 36px -6px rgba(5, 150, 105, 0.35), 0 4px 14px rgba(0, 0, 0, 0.08);
        animation: boot-pop 540ms cubic-bezier(0.16, 1, 0.3, 1) both, boot-float 3.6s ease-in-out infinite alternate;
        z-index: 1;
      }
      html.dark .boot-logo-card {
        background: #18181b;
        box-shadow: 0 16px 40px -6px rgba(16, 185, 129, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.1);
      }
      .boot-logo-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        transform: scale(1.02);
      }
      .boot-sheen {
        position: absolute;
        top: -50%;
        left: -120%;
        width: 100%;
        height: 200%;
        background: linear-gradient(60deg, transparent 20%, rgba(255, 255, 255, 0.35) 50%, transparent 80%);
        transform: rotate(25deg);
        animation: boot-shine 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        pointer-events: none;
      }

      .boot-brand-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.25rem;
        animation: boot-pop 540ms 70ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .boot-title {
        margin: 0;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 1.625rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #047857;
      }
      html.dark .boot-title { color: #10b981; }
      .boot-tagline {
        margin: 0;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        color: #78716c;
      }
      html.dark .boot-tagline { color: #a8a29e; }

      .boot-loader-bar {
        width: 8rem;
        height: 3px;
        background: rgba(0, 0, 0, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        animation: boot-pop 540ms 120ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      html.dark .boot-loader-bar { background: rgba(255, 255, 255, 0.12); }
      .boot-loader-track {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #059669, #34d399);
        animation: boot-progress 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      html.dark .boot-loader-track {
        background: linear-gradient(90deg, transparent, #10b981, #6ee7b7);
      }

      .boot-dots {
        display: flex;
        gap: 0.45rem;
        animation: boot-pop 540ms 140ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .boot-dots i {
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 9999px;
        background: #059669;
        box-shadow: 0 0 6px rgba(5, 150, 105, 0.5);
        animation: boot-dot 1.2s ease-in-out infinite;
      }
      html.dark .boot-dots i {
        background: #10b981;
        box-shadow: 0 0 6px rgba(16, 185, 129, 0.5);
      }
      .boot-dots i:nth-child(2) { animation-delay: 160ms; }
      .boot-dots i:nth-child(3) { animation-delay: 320ms; }

      .boot-status {
        margin: 0;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 0.8125rem;
        font-weight: 500;
        color: #57534e;
        animation: boot-pop 540ms 160ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      html.dark .boot-status { color: #b8b3a8; }

      @keyframes boot-pop {
        from { opacity: 0; transform: translateY(12px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes boot-float {
        0% { transform: translateY(0) scale(1); }
        100% { transform: translateY(-4px) scale(1.02); }
      }
      @keyframes boot-breathe {
        0% { transform: scale(0.92); opacity: 0.45; }
        100% { transform: scale(1.12); opacity: 0.85; }
      }
      @keyframes boot-wave {
        0% { transform: scale(1); opacity: 0.8; }
        60%, 100% { transform: scale(1.65); opacity: 0; }
      }
      @keyframes boot-shine {
        0%, 25% { left: -120%; }
        60%, 100% { left: 160%; }
      }
      @keyframes boot-progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(320%); }
      }
      @keyframes boot-dot {
        0%, 70%, 100% { transform: translateY(0) scale(0.9); opacity: 0.55; }
        35% { transform: translateY(-0.4rem) scale(1.15); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash, #boot-splash * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <script>
      // Apply the saved theme before first paint so the splash and the app
      // never flash a mismatched background.
      try {
        var t = localStorage.getItem('tab_theme');
        if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* ignore */ }
      // A service-worker update reloads the page; tell the splash to say so.
      try {
        if (sessionStorage.getItem('tab_boot_mode') === 'updating') {
          document.addEventListener('DOMContentLoaded', function () {
            var s = document.getElementById('boot-splash-status');
            if (s) s.textContent = 'Applying update…';
          });
        }
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-logo-container">
        <div class="boot-ambient-glow"></div>
        <div class="boot-ring-wave boot-ring-1"></div>
        <div class="boot-ring-wave boot-ring-2"></div>
        <div class="boot-logo-card">
          <img src="/icons/icon-512.png" alt="Owezy Logo" width="84" height="84" class="boot-logo-img" />
          <span class="boot-sheen"></span>
        </div>
      </div>
      <div class="boot-brand-block">
        <p class="boot-title">Owezy</p>
        <p class="boot-tagline">Track what friends owe you</p>
      </div>
      <div class="boot-loader-bar">
        <div class="boot-loader-track"></div>
      </div>
      <div class="boot-dots"><i></i><i></i><i></i></div>
      <p id="boot-splash-status" class="boot-status">Loading your account…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
